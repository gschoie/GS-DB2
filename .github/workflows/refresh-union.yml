name: 노조게시판만 갱신

# 현중 노조게시판(hhiun)만 다시 수집·반영하는 경량 워크플로.
# 뉴스/톤/매크로 재수집은 건너뛰고 build_hhiun_report + build_static만 돌린다.
on:
  workflow_dispatch:
  schedule:
    # 하루 2회 노조게시판 수집 — KST 09:20, 21:20 (UTC 00:20, 12:20)
    - cron: "20 0,12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# concurrency는 deploy 잡에만(빌드가 다른 워크플로에 의해 취소돼 수집/캐시저장이 유실되지 않게)
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # 뉴스DB는 읽기전용 복원(노조 run이 뉴스 캐시를 덮지 않게 → 리버트 방지).
      - name: 뉴스DB 캐시 복원(읽기전용)
        uses: actions/cache/restore@v5
        with:
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_messages.json
            telegram_research_dashboard/data/daol_tone_history.json
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/macro.json
          key: newsdb-${{ github.run_id }}
          restore-keys: |
            newsdb-
            dashboard-db-

      - name: 노조 캐시 복원
        uses: actions/cache/restore@v5
        with:
          path: |
            telegram_research_dashboard/data/hhiun_snapshot.json
            telegram_research_dashboard/data/hhiun_top.json
            telegram_research_dashboard/static/hhiun_board_report.html
          key: hhiun-${{ github.run_id }}
          restore-keys: |
            hhiun-

      - name: 파이프라인 계약 테스트
        working-directory: telegram_research_dashboard
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Python 패키지 준비
        run: python -m pip install requests beautifulsoup4 lxml pycryptodome

      - name: 현중 노조게시판 수집
        working-directory: telegram_research_dashboard
        run: python build_hhiun_report.py

      - name: 배포용 HTML 생성 (노조만 갱신 · 뉴스/톤은 기존 데이터 유지)
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
        run: python build_static.py

      - name: 배포 안전망 검사
        working-directory: telegram_research_dashboard
        run: python verify_static_output.py _site/index.html

      - name: 노조 캐시 저장
        uses: actions/cache/save@v5
        with:
          path: |
            telegram_research_dashboard/data/hhiun_snapshot.json
            telegram_research_dashboard/data/hhiun_top.json
            telegram_research_dashboard/static/hhiun_board_report.html
          key: hhiun-${{ github.run_id }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: telegram_research_dashboard/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
