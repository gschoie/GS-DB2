name: 친환경 에너지 브리핑

# 매일 아침 KST 06:40경 친환경 에너지·FDC 데일리 브리핑을 생성해 대시보드에 커밋한다.
# 주제: 친환경 선박(암모니아·수소·원자력/SMR 추진) / FDC / FLNG / LNG 액화 FID /
# 미국 발전원 투자(가스복합·신재생·SMR). Gemini 단일 파이프라인, 텔레그램 없음.
# 방산(05:40)·건기 수집(06:10)과 30분 오프셋 — Gemini 분당 한도 충돌 회피.
on:
  workflow_dispatch:
  schedule:
    # UTC 21:40 = KST 06:40
    - cron: "40 21 * * *"

permissions:
  contents: write

concurrency:
  group: energy-briefing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: energy_briefing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 브리핑 생성
        working-directory: energy_briefing
        env:
          # 전용 키 권장 — 없으면 건기 키 → 방산 키 순 폴백
          GEMINI_API_KEY: ${{ secrets.ENERGY_GEMINI_API_KEY || secrets.CONSTRUCTION_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-latest
        run: python energy_briefing_bot.py

      - name: 아카이브 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/energy_daily \
                  telegram_research_dashboard/static/energy_briefing_report.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(energy): 친환경 에너지 브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "push 실패" >&2
          exit 1
