name: KOSPI200 컨센 트래킹

# 매주 금요일 한국시간 17:00 (장마감 후): KOSPI200 영업이익 컨센 스냅샷 → 리비전 페이지 → 배포
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 5,6"   # 08:00 UTC 금·토 = 한국 17:00 (주간 스냅샷 2회)
    # 정시성은 GAS 시계(gas/dispatch_proxy.gs SCHEDULE)가 담당 — 이 크론은 안전망이다.

permissions:
  contents: write   # 갱신된 DB/HTML 커밋·푸시 → deploy-pages 트리거

concurrency:
  group: kospi-consensus
  cancel-in-progress: false

jobs:
  # GAS 시계(gas/dispatch_proxy.gs의 tick)가 정시에 workflow_dispatch로 쏘고,
  # GitHub 크론은 안전망으로 남긴다. 크론이 뒤늦게 돌 때 같은 일을 두 번 하지
  # 않도록, 최근 600분 내에 dispatch 실행이 이미 있었으면 이 예약 실행은 건너뛴다.
  # (주 1회(금 17:00)) 수동 버튼(dispatch)은 언제나 그대로 실행된다.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 최근 dispatch 실행 확인
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-600 minutes' +%Y-%m-%dT%H:%M)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/kospi-consensus.yml/runs?event=workflow_dispatch&created=%3E${since}" \
                --jq '[.workflow_runs[] | select(.conclusion=="success" or .status=="in_progress" or .status=="queued")] | length' || echo 0)
          echo "최근 600분 내 dispatch 실행 ${n:-0}건"
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::GAS가 이미 실행했습니다 — 이 예약 실행은 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  snapshot:
    needs: guard
    if: ${{ always() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35   # 네이버가 클라우드 IP를 스로틀하면 스크랩이 느려짐 → 완주 여지 확보
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: kospi_consensus
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 주간 컨센 스냅샷 (KOSPI200)
        working-directory: kospi_consensus
        run: python run_snapshot.py --refresh-universe

      - name: 리비전 페이지 생성 (대시보드 static)
        working-directory: kospi_consensus
        run: python build_static.py

      - name: 커밋 및 푸시 (→ Pages 재배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kospi_consensus/data/consensus.db \
                  kospi_consensus/data/universe.json \
                  telegram_research_dashboard/static/consensus_revision.html \
                  telegram_research_dashboard/static/consensus_full.xlsx
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(consensus): 주간 컨센 스냅샷 $(date -u +%Y-%m-%d)"
            # 스크랩이 ~10분 걸려 그 사이 main이 앞서가면 push가 non-fast-forward로 거부된다.
            # 재기반(rebase) 후 재시도해 동시 커밋과 충돌해도 안전하게 반영한다.
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && { echo "push 성공"; break; }
              echo "원격이 앞서감 — 재기반 후 재시도 ($i/5)"
              git pull --rebase --autostash origin main || exit 1
              sleep 3
            done
          fi
