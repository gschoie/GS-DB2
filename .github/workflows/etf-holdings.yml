name: 액티브 ETF 매매동향

# 매시간(KST 09~21시, 월~금) '기준일 워처'가 CU 구성종목 기준일만 가볍게 확인하고,
# 기준일이 넘어갔을 때(=새 구성 반영)만 전체 수집→감지→리포트→텔레그램을 1회 실행한다.
# → "기준일이 몇 시에 바뀌는지" 몰라도 갱신되는 즉시(1시간 내) 잡는다. self-adjusting.
# (KRX 장마감 기준이라 보통 저녁에 갱신 예상 — 실제 시각은 런 기록으로 드러남. 이후 창을 좁혀도 됨.)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 0-12 * * 1-5"  # UTC 00~12시 매시 17분 = KST 09~21시, 월~금 (정각은 GitHub 혼잡으로 자주 스킵됨)

permissions:
  contents: write

concurrency:
  group: etf-holdings
  cancel-in-progress: false

jobs:
  # GAS 시계(gas/dispatch_proxy.gs의 tick)가 정시에 workflow_dispatch로 쏘고,
  # GitHub 크론은 안전망으로 남긴다. 크론이 뒤늦게 돌 때 같은 일을 두 번 하지
  # 않도록, 최근 45분 내에 dispatch 실행이 이미 있었으면 이 예약 실행은 건너뛴다.
  # (매시 · 간격 60분) 수동 버튼(dispatch)은 언제나 그대로 실행된다.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 최근 dispatch 실행 확인
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-45 minutes' +%Y-%m-%dT%H:%M)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/etf-holdings.yml/runs?event=workflow_dispatch&created=%3E${since}" \
                --jq '[.workflow_runs[] | select(.conclusion=="success" or .status=="in_progress" or .status=="queued")] | length' || echo 0)
          echo "최근 45분 내 dispatch 실행 ${n:-0}건"
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::GAS가 이미 실행했습니다 — 이 예약 실행은 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  track:
    needs: guard
    if: ${{ always() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: etf_holdings
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 기준일 워처 판정 (매시간 가볍게)
        id: watch
        working-directory: etf_holdings
        env:
          WATCH_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python watch.py check

      - name: 구성종목 스냅샷 수집
        if: steps.watch.outputs.should_run == 'true'
        working-directory: etf_holdings
        run: python fetch_holdings.py

      - name: 전일 대비 변화 감지
        if: steps.watch.outputs.should_run == 'true'
        working-directory: etf_holdings
        run: python detect_changes.py

      - name: 카드 종목 시세 수집 (스파크라인용 · 하루 1회만 API 사용)
        if: steps.watch.outputs.should_run == 'true'
        working-directory: etf_holdings
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        # 실패해도 리포트는 나가야 하므로 스크립트가 예외를 삼킨다(스파크라인만 비표시).
        run: python fetch_prices.py

      - name: HTML 리포트 생성 (대시보드 static)
        if: steps.watch.outputs.should_run == 'true'
        working-directory: etf_holdings
        env:
          ETF_HOLDINGS_OUT: ../telegram_research_dashboard/static/etf_holdings_report.html
        run: python build_report.py

      - name: 텔레그램 알림 (ETF섹터와 동일 봇 · 수동 실행이면 확인메시지)
        if: steps.watch.outputs.should_run == 'true'
        working-directory: etf_holdings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ETF_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ETF_TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: 처리 기준일 state 갱신
        if: steps.watch.outputs.should_run == 'true'
        working-directory: etf_holdings
        run: python watch.py commit

      - name: 스냅샷·리포트·state 커밋 및 푸시 (→ Pages 재배포)
        if: steps.watch.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/etf_holdings_report.html \
                  etf_holdings/snapshots etf_holdings/changes.json \
                  etf_holdings/telegram_status.json etf_holdings/state.json \
                  etf_holdings/prices.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(holdings): 액티브 ETF 매매동향 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
