name: 주보 튀는 차트

# 주보 5종(피어그룹 주가변동표 · 주가 INDEX 비교 · 수급 그림 · 컨센서스 · ER)에서 '이번 주 의미 있는 변화' 만
# 규칙(weekly_highlights/rules.py)으로 골라 JSON 으로 굽고 커밋 → deploy-pages(workflow_run) 가 배포.
# 사이드바 📰 주보 › ✨ 이번주.튀는차트 (weekly_highlights_report.html).
#
# 시각: 매주 토요일 새벽, 미국장 마감(겨울 06:00 KST · 여름 05:00) 뒤. 정시는 Claude 예약 작업(토 07:12 KST,
# `gh workflow run weekly-highlights.yml --ref main`)이 맡고 아래 크론은 안전망 — 무료 러너 크론은 몇 시간씩
# 밀린다(CLAUDE.md 17번). 같은 날 두 번 돌아도 같은 날짜 파일을 덮어쓸 뿐이라(멱등) guard 가 필요 없다.
#
# 종목 정의는 ecos-fx-rates(public) 생성기 모듈을 그대로 import 하고(목록을 두 곳에 두지 않는다),
# 컨센서스·ER CSV 도 그 체크아웃에서 읽는다 → 러너가 그 리포를 _ecos/ 에 clone 한다.
on:
  workflow_dispatch:
  push:
    branches: [claude/sweet-bell-c7ao5b]   # 임시 — 러너 실검증용, 머지 전 제거
  schedule:
    - cron: "40 23 * * 5"   # 금 23:40 UTC = 토 08:40 KST (안전망)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 야후 230 티커 + 시총 120개(fast_info 개별 호출)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r weekly_highlights/requirements.txt

      - name: ecos-fx-rates 체크아웃 (종목 정의 + 컨센서스·ER CSV)
        run: git clone --depth 1 https://github.com/gschoie/ecos-fx-rates _ecos

      - name: 규칙 테스트
        working-directory: weekly_highlights
        run: python -m unittest tests.test_rules -v

      - name: 수집 · 판정 · JSON 생성
        working-directory: weekly_highlights
        env:
          ECOS_DIR: ${{ github.workspace }}/_ecos
        run: python build.py

      - name: 산출물 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-highlights
          path: telegram_research_dashboard/static/weekly_highlights/
          if-no-files-found: warn

      - name: 커밋 및 푸시 (→ Pages 재배포)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/weekly_highlights/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(weekly-highlights): 주보 튀는 차트 $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && { echo "push 성공"; break; }
              echo "원격이 앞서감 — 재기반 후 재시도 ($i/5)"
              git pull --rebase --autostash origin main || exit 1
              sleep 3
            done
          fi
