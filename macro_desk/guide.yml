      - {band: "반도체 YoY 두 자릿수 증가", tone: cool, mean: "IT 사이클 상승 — 지수 주도주에 직접"}
      - {band: "수출 YoY 마이너스 지속", tone: hot, mean: "대외 수요 둔화. 수출주 실적 추정 하향 압력"}
