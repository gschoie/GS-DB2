name: 글로벌 방산 주간정리

# 매주 토요일 KST 11:50에 지난 7일의 데일리 브리핑 2종(제미나이·클로드)을
# 종합한 주간 정리본을 생성해 대시보드에 커밋한다.
# 최근 4주 묶음(last4weeks.md/.html)도 함께 갱신 — 월간 세미나(NotebookLM) 소스.
on:
  workflow_dispatch:
    inputs:
      for_date:
        description: "소급 재생성할 토요일 날짜(YYYY-MM-DD). 비우면 오늘 기준 정기 생성"
        required: false
        default: ""
  schedule:
    # UTC 02:50 = KST 11:50 (토) — 안전망. 정시 발사는 GAS 스케줄러(defweekly 슬롯)가
    # 담당한다(토요일 크론이 매주 +4.5시간대로 밀려 텔레가 오후 5시에 오던 문제, 9/19).
    - cron: "50 2 * * 6"

permissions:
  contents: write

concurrency:
  group: defense-weekly
  cancel-in-progress: false

jobs:
  # 예약(schedule) 실행 중복 가드 — "이 일이 이미 됐나"를 묻는다: 이벤트를 가리지 않고
  # 최근 600분 내 성공·진행중 run(자기 자신 제외)이 있으면 뒤늦은 크론을 건너뛴다.
  # fail-open: 가드가 죽으면 그냥 실행된다.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 최근 실행 확인
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-600 minutes' +%Y-%m-%dT%H:%M)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/defense-weekly.yml/runs?created=%3E${since}" \
                --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion=="success" or .status=="in_progress" or .status=="queued")] | length' || echo 0)
          echo "최근 600분 내 다른 실행 ${n:-0}건"
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::이번 주 주간정리는 이미 처리됐습니다 — 이 예약 실행은 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  weekly:
    needs: guard
    if: ${{ always() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: defense_briefing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 주간 정리 생성
        working-directory: defense_briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 주 1회라 pro 무료 티어로 충분. 쿼터 초과 시 flash 자동 폴백.
          # gemini-2.5-pro 가 404(신규 사용자 제공 중단)로 죽어 3.1 프리뷰로 이동 — flash 폴백 내장
          GEMINI_MODEL: gemini-3.1-pro-preview
          # 일간 방산 브리핑과 같은 텔레그램 채널(GS K-Defence NEWS)로 요약+링크 발송
          TELEGRAM_BOT_TOKEN: ${{ secrets.KDEF_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.KDEF_TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ inputs.for_date }}" ]; then
            python weekly_defense_bot.py --for-date "${{ inputs.for_date }}"
          else
            python weekly_defense_bot.py
          fi

      - name: 아카이브 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/defense_weekly \
                  telegram_research_dashboard/static/defense_weekly_report.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(defense): 방산 주간 정리 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "push 실패" >&2
          exit 1
