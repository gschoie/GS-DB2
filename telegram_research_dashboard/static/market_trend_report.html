var PAGES = {"2026-08-14": "<p class=\"oneliner\">AI 인프라의 자산 가치 부각 속 기업 실적 발표가 이어지고, 글로벌 증시 및 산업 동향에 관심이 집중된 하루.<\/p><p class=\"sub\">창 08-13 06:00~08-14 06:00 KST · 채널 98개 · 글 2289건(중복 접은 뒤 2139건) · Gemini(gemini-2.5-flash)<\/p><div class=\"card theme\"><div class=\"ctitle\">1. AI 인프라 — 자산 가치 및 비용 효율성 <span class=\"badge\">지속<\/span> <span class=\"dots\">●●●●●<\/span><\/div><p class=\"narr\">AI CapEx가 단순 소모 비용이 아닌 장기 수익 창출이 가능한 자산으로 인식되며, 구형 GPU의 가치 유지와 함께 AI 투자에 있어 비용 효율성 및 하이퍼스케일러의 역량이 중요해지고 있다.<\/p><div class=\"kws\"><span class=\"kw\">AI<\/span><span class=\"kw\">분기<\/span><span class=\"kw\">올해<\/span><span class=\"kw\">미국<\/span><span class=\"kw\">종합<\/span><span class=\"kw\">연결<\/span><\/div><ul class=\"ev\"><li><b>[ IT는 SK ]<\/b> — “AI CapEx는 단순 반복 비용이 아닌, 금융 가능한 자산으로 변모하고 있습니다.”<\/li><li><b>메리츠증권 리서치<\/b> — “이제 축적만큼 비용이 중요한 AI - AI가 만든 멋진 신세계 의심 않지만, 올 하반기부터 옥석 가리기와 순환매 속 수익&amp;비용 중요”<\/li><li><b>GS의 조선/기계/방산 「바담」<\/b> — “네이버가 파력 발전 기반 부유식 해상 AI 데이터센터 기술을 개발하는 미국 스타트업 판탈라사(Panthalassa)에 투자함”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">2. 2분기/반기 기업 실적 — 호실적 및 옥석 가리기 <span class=\"badge\">지속<\/span> <span class=\"dots\">●●●●○<\/span><\/div><p class=\"narr\">2분기 및 반기 실적 발표가 활발히 진행되며, 달바글로벌, 자화전자, 아이티센엔텍, 제주반도체 등 다수 기업이 예상치를 상회하는 호실적을 기록했다. 반면 일부 기업은 예상치를 하회하며 개별 기업의 성과에 따른 시장의 옥석 가리기가 심화되고 있다.<\/p><div class=\"kws\"><span class=\"kw\">매출액<\/span><span class=\"kw\">순이익<\/span><span class=\"kw\">영업익<\/span><span class=\"kw\">예상치<\/span><span class=\"kw\">분기<\/span><span class=\"kw\">시가총액<\/span><span class=\"kw\">공시링크<\/span><span class=\"kw\">기간<\/span><span class=\"kw\">연결<\/span><\/div><ul class=\"ev\"><li><b>AWAKE - 실시간 주식 공시 정리채널<\/b> — “기업명: 달바글로벌(시가총액: 3조 3,046억) A483650 보고서명: 연결재무제표기준영업(잠정)실적(공정공시) 매출액 : 1,869억(예상치 : 1,825억+/ 2%) 영업익 : 472억(예상치 : 410억/ +15%) 순이익 : 381억(예상치 : 310억+/ 23%)”<\/li><li><b>여의도스토리 Ver2.0<\/b> — “기업명: 자화전자(시가총액: 6,104억) A033240 매출액 : 2,352억(예상치 : 2,058억, +14.3%) 영업익 : 224억(예상치 : 93억, +141.4%)”<\/li><li><b>간 ●○<\/span><\/div><p class=\"narr\">미국 국채 바이백 효과가 하루 만에 약화되고 장기 국채 금리 상승 압력이 지속되는 가운데, 월마트 실적 쇼크로 소비 섹터 전반에 대한 우려가 확산되었다. 다만, 8월 S&amp;P 글로벌 종합 PMI 예비치가 예상치를 상회하며 서비스업의 강한 확장세를 보여 혼조세를 보였다.<\/p><div class=\"kws\"><span class=\"kw\">하루 만에<\/span><span class=\"kw\">압력 강하게<\/span><span class=\"kw\">WMT<\/span><span class=\"kw\">PMI<\/span><span class=\"kw\">서비스업<\/span><span class=\"kw\">정기<\/span><span class=\"kw\">없어<\/span><span class=\"kw\">압력 증가할<\/span><\/div><ul class=\"ev\"><li><b>여의도스토리 Ver2.0-习近平是个狗东西<\/b> — “② 미국채 바이백 효과 하루 만에 약화”<\/li><li><b>김현석(자본주의 바이어스 있는 채널입니다)<\/b> — “월마트 실적 쇼크의 소비 섹터 전이 — 월마트(WMT) 주가는 4년여 만의 최대 낙폭을 기록하였으며, 소비재 전반으로 매도세가 확산되었다.”<\/li><li><b>미국 주식 인사이더 🇺🇸 (US Stocks Insider)<\/b> — “미국 8월 S&amp;P 글로벌 종합 PMI 예비치는 56.0으로 전월 54.5와 예상 54.0을 모두 상회하며 2022년 4월 이후 최고 수준 기록. 서비스업 PMI는 56.8로 예상 54.0을 크게 웃돌아 2024년 말 이후 가장 강한 확장세를 보인 반면 제조업 PMI는 53.2로 예상 53.9를 하회하며 5개월 만의 최저…”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">2. 바이오 — 임상 성공 및 생산 역량 확대 기대 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●●●<\/span><\/div><p class=\"narr\">디앤디파마텍이 MASH 치료제 임상 2상에서 1차 평가지표를 달성하며 긍정적인 결과를 발표했고, 올릭스는 Hansoh와의 공동연구 계약을 체결했다. 알테오젠 또한 바이오의약품 사업 확대를 위한 신규 공장 투자를 발표하며 국내 바이오 기업들의 성장 기대감이 높아졌다.<\/p><div class=\"kws\"><span class=\"kw\">계약 따라<\/span><span class=\"kw\">조달한<\/span><span class=\"kw\">예정일<\/span><\/div><ul class=\"ev\"><li><b>간절한 투자스터디카페<\/b> — “📌 디앤디파마텍... (대사이상지방간염 (MASH) 치료제 DD01의 미국 임상 제2상 임상시험결과보고서(CSR) 수령)... 1차 평가지표 달성 및 경쟁력 있는 48주 조직생검 결과 최종 확정”<\/li><li><b>AWAKE - 실시간 주식 공시 정리채널<\/b> — “기업명: 올릭스... 투자판단관련주요경영사항 (Hansoh와의 공동연구 및 염기서열 이전 계약 체결)”<\/li><li><b>간절한 투자스터디카페<\/b> — “📌 알테오젠... 투자구분 및 목적 - 공장신설 - 바이오의약품 사업 확대 및 글로벌 시장 대응을 위한 생산역량 확보 목적”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">3. 국내 대기업 — 삼성전자 주주환원 강화, 카카오 인적분할에 시장 실망 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●●●<\/span><\/div><p class=\"narr\">삼성전자가 대규모 주주환원 정책과 임직원 보상용 자사주 취득 계획을 발표하며 긍정적인 반응을 얻었다. 반면 카카오는 기업가 function show(i) {
  idx = Math.max(0, Math.min(i, DATES.length - 1));

});
