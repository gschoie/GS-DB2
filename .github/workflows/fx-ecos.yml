name: ECOS 환율 엑셀

# 매 평일 한국시간 17:30: ECOS 주요국 환율 → BOK_exchange_rates.xlsx 갱신
# (기존 Apps Script를 이식 — ECOS가 Google IP를 차단해 UrlFetchApp이 실패)
on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"   # 08:30 UTC 평일 = 한국 17:30

permissions:
  contents: write   # 갱신된 xlsx 커밋·푸시 → deploy-pages 트리거

concurrency:
  group: fx-ecos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: fx_ecos
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 환율 엑셀 생성
        working-directory: fx_ecos
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python run_fx.py

      - name: 커밋 및 푸시 (→ Pages 재배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/BOK_exchange_rates.xlsx
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(fx): ECOS 환율 엑셀 갱신 $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && { echo "push 성공"; break; }
              echo "원격이 앞서감 — 재기반 후 재시도 ($i/5)"
              git pull --rebase --autostash origin main || exit 1
              sleep 3
            done
          fi
