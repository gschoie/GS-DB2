name: ETF 섹터 신호

# 매일 한국시간 오전 7시: 55개 ETF 스캔 → HTML 신호판 + 텔레그램 알림 → 배포
# 신호는 전일 확정 종가로만 계산하므로 장중을 기다릴 이유가 없다. 개장(09:00) 전에
# 받아보려고 07:00으로 잡았다. 다만 Actions 대기열 지연이 1~3시간 붙는 편이라
# 실제 실행은 그보다 늦을 수 있다.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 한국 07:00 (다음 날)

permissions:
  contents: write   # 갱신된 신호판 HTML 커밋/푸시 → deploy-pages 트리거

concurrency:
  group: etf-signal
  cancel-in-progress: false

jobs:
  # GAS 시계(gas/dispatch_proxy.gs의 tick)가 정시에 workflow_dispatch로 쏘고,
  # GitHub 크론은 안전망으로 남긴다. 크론이 뒤늦게 돌 때 같은 일을 두 번 하지
  # 않도록, 최근 600분 내에 dispatch 실행이 이미 있었으면 이 예약 실행은 건너뛴다.
  # (하루 1회(07:00)) 수동 버튼(dispatch)은 언제나 그대로 실행된다.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 최근 dispatch 실행 확인
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-600 minutes' +%Y-%m-%dT%H:%M)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/etf-signal.yml/runs?event=workflow_dispatch&created=%3E${since}" \
                --jq '[.workflow_runs[] | select(.conclusion=="success" or .status=="in_progress" or .status=="queued")] | length' || echo 0)
          echo "최근 600분 내 dispatch 실행 ${n:-0}건"
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::GAS가 이미 실행했습니다 — 이 예약 실행은 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: guard
    if: ${{ always() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: etf_signal
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 55개 ETF 스캔
        working-directory: etf_signal
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python etf_signal.py

      - name: HTML 신호판 생성 (대시보드 static)
        working-directory: etf_signal
        env:
          ETF_REPORT_OUT: ../telegram_research_dashboard/static/etf_signal_report.html
        run: python build_report.py

      - name: 텔레그램 알림 (수동 🔄이면 신호 없어도 확인메시지 · ETF 전용 봇)
        working-directory: etf_signal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ETF_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.ETF_TELEGRAM_CHAT_ID }}
        # 수동 실행(🔄 ETF 갱신)이면 --force 로 신호가 없어도 확인 메시지를 보낸다.
        # 전송 결과는 telegram_status.json 에 남아 커밋되므로 원인 진단 가능.
        run: python etf_telegram.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: 신호판 커밋 및 푸시 (→ Pages 재배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/etf_signal_report.html etf_signal/signals.json etf_signal/history etf_signal/telegram_status.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(etf): 신호 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
