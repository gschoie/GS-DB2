name: (임시) t.me 주소 프로브

# ked_epic_ai_summary 주소가 텔레그램에 실존하는지 + 계정 대화 목록에서
# 아침 발간 목록 방의 실제 이름/주소를 찾는 일회용 프로브. 끝나면 지운다.
on:
  push:
    branches: [claude/telegram-shipbuilding-alerts-xznnl4]
    paths: [.github/workflows/_probe-tme.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: telethon 설치
        run: pip -q install telethon

      - name: 계정 세션 복호화
        env:
          SESSION_PASSPHRASE: ${{ secrets.SESSION_PASSPHRASE }}
        run: |
          VALUE=$(openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -d \
            -in source_watcher/state/session.enc -pass env:SESSION_PASSPHRASE)
          echo "::add-mask::$VALUE"
          echo "TELEGRAM_SESSION_STRING=$VALUE" >> "$GITHUB_ENV"

      - name: 대화 목록에서 후보 방 찾기
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python - <<'PY'
          import asyncio, os, sys
          sys.path.insert(0, "source_watcher")
          from adapters import DEVICE_INFO, _account_session

          KEYS = ("epic", "에이셀", "요약", "ked", "리서치")

          async def main():
              from telethon import TelegramClient
              client = TelegramClient(_account_session(),
                                      int(os.environ["TELEGRAM_API_ID"]),
                                      os.environ["TELEGRAM_API_HASH"], **DEVICE_INFO)
              await client.connect()
              try:
                  n = 0
                  async for d in client.iter_dialogs(limit=500):
                      e = d.entity
                      title = getattr(e, "title", None) or ""
                      person = " ".join(p for p in (getattr(e, "first_name", None),
                                                    getattr(e, "last_name", None)) if p)
                      shown = title or person
                      uname = getattr(e, "username", None) or "-"
                      hay = f"{shown} {uname}".casefold()
                      if any(k in hay for k in KEYS):
                          n += 1
                          kind = ("channel" if getattr(e, "broadcast", False)
                                  else "group" if getattr(e, "megagroup", False)
                                  else "bot/user")
                          print(f"[{kind}] title={shown!r} username=@{uname} "
                                f"last={d.date:%m-%d %H:%M}")
                  print(f"-- 키워드 일치 {n}개 / 대화 500개 내 --")
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY
