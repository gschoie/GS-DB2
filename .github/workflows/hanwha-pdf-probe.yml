name: 한화 리포트 공개 PDF 소스 진단 (일회성)
on:
  workflow_dispatch:
  push:
    branches: ["claude/sweet-hypatia-1ozbht"]
    paths: [".github/workflows/hanwha-pdf-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -q requests beautifulsoup4 lxml pypdf
      - name: 네이버 리서치 · 한경컨센서스에서 한화투자증권 PDF 확인
        run: |
          python - <<'PY'
          import re, io, requests, json
          from bs4 import BeautifulSoup
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Referer':'https://finance.naver.com/'}
          s=requests.Session(); s.headers.update(UA)
          def collapse(t): return re.sub(r'\s+',' ',t)
          def try_pdf(u, ref=None):
              try:
                  r=s.get(u,timeout=60,headers={'Referer':ref} if ref else None)
                  ok=r.content[:4]==b'%PDF'
                  print('   PDF?',ok,r.status_code,r.headers.get('content-type'),len(r.content),u[:140])
                  if ok:
                      from pypdf import PdfReader
                      rd=PdfReader(io.BytesIO(r.content)); t=rd.pages[0].extract_text() or ''
                      print('   pages',len(rd.pages),'| p1:',collapse(t)[:500])
              except Exception as e: print('   PDF err',u[:100],e)
          # 1) 네이버 금융 리서치 (옛 PC 페이지 + 신규)
          for u in ['https://finance.naver.com/research/company_list.naver','https://finance.naver.com/research/industry_list.naver',
                    'https://finance.naver.com/research/company_list.naver?searchType=brokerCode&brokerCode=22',
                    'https://m.stock.naver.com/api/research/stock?page=1&pageSize=20','https://m.stock.naver.com/front-api/research/list?category=stock&page=1&pageSize=20']:
              try:
                  r=s.get(u,timeout=30); txt=r.text
                  print(f'\n=== {u}\n   status={r.status_code} len={len(txt)} final={r.url}')
                  if 'json' in (r.headers.get('content-type') or '') or txt.strip().startswith('{') or txt.strip().startswith('['):
                      print('   JSON head:',txt[:1500]); continue
                  soup=BeautifulSoup(txt,'lxml')
                  rows=[tr for tr in soup.select('table.type_1 tr') if tr.find('td')]
                  print('   rows',len(rows))
                  hw=[tr for tr in rows if '한화' in tr.get_text()]
                  print('   한화 rows',len(hw))
                  for tr in (hw or rows)[:4]:
                      a=tr.find('a',href=True); pdf=tr.find('a',href=re.compile(r'\.pdf',re.I))
                      print('   ROW',collapse(tr.get_text())[:120],'| detail',a['href'][:100] if a else None,'| pdf',pdf['href'][:140] if pdf else None)
                  pdfs=[a['href'] for a in soup.find_all('a',href=re.compile(r'\.pdf',re.I))]
                  print('   pdf links',len(pdfs),pdfs[:2])
                  if pdfs: try_pdf(pdfs[0], ref=u)
                  # broker select 옵션(한화 코드)
                  for o in soup.select('select option'):
                      if '한화' in o.get_text(): print('   BROKER OPTION',o.get('value'),o.get_text())
              except Exception as e: print('ERR',u,e)
          # 2) 한경컨센서스
          for u in ['https://consensus.hankyung.com/analysis/list?sdate=2026-10-20&edate=2026-11-01&now_page=1&search_text=%ED%95%9C%ED%99%94&pagenum=20',
                    'https://consensus.hankyung.com/analysis/list?now_page=1&search_text=&pagenum=20']:
              try:
                  r=s.get(u,timeout=30); soup=BeautifulSoup(r.text,'lxml')
                  print(f'\n=== {u}\n   status={r.status_code} len={len(r.text)} final={r.url}')
                  rows=[tr for tr in soup.select('table tr') if tr.find('td')]
                  print('   rows',len(rows))
                  hw=[tr for tr in rows if '한화' in tr.get_text()]
                  print('   한화 rows',len(hw))
                  for tr in (hw or rows)[:4]:
                      links=[a['href'] for a in tr.find_all('a',href=True)]
                      print('   ROW',collapse(tr.get_text())[:140],'|',links[:3])
                  dl=[a['href'] for a in soup.find_all('a',href=re.compile(r'downpdf|\.pdf|report_idx',re.I))]
                  print('   dl links',len(dl),dl[:2])
                  if dl:
                      d=dl[0] if dl[0].startswith('http') else 'https://consensus.hankyung.com'+dl[0]
                      try_pdf(d, ref=u)
              except Exception as e: print('ERR',u,e)
          PY
