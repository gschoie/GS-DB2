<!DOCTYPE html>
<!--
  Earnings Revision(ER) — ecos-fx-rates 리포의 Actions('건설기계·방산 Earnings Revision 적재')가 매일 쌓는
  output/earnings_revision/er_history.csv 를 raw.githubusercontent(CORS *) 로 읽어 섹터별로 보여준다.
  ?s=조선|방산|건설기계 로 섹터 선택(대시보드 메뉴 주보 › ER › 조선/방산/건설기계).
  ER = (상향 건수 − 하향 건수) / 애널리스트 수 × 100. 자료: Yahoo Finance(무료, 2026-11-10부터 적재).
  색: 한국 증시 관례대로 상향 = 빨강, 하향 = 파랑(값·부호도 같이 표기해 색만으로 읽지 않게).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earnings Revision — GS Research Desk</title>
<style>
:root{--bg:#fff;--fg:#1c2430;--muted:#6b7684;--line:#e5e8ec;--card:#f7f8fa;--btn:#1f2937;--grid:#eceef1;--zero:#9aa3ae;
  --up:#e34948;--dn:#2a78d6;--mid:#f0efec;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e6e9ee;--muted:#8b93a1;--line:#2a313c;--card:#1b212b;--btn:#e6e9ee;--grid:#232a34;--zero:#5b6472;
  --up:#e66767;--dn:#3987e5;--mid:#383835;--warn:#f59e0b}}
*{box-sizing:border-box}
body{margin:0;padding:18px 16px 48px;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.note{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.7}
.note a{color:inherit}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:600 12.5px inherit;padding:5px 12px;border:0;background:var(--bg);color:var(--fg);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--btn);color:var(--bg)}
button.dl{font:600 12.5px inherit;padding:5px 12px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;margin-left:auto}
.card{border:1px solid var(--line);border-radius:8px;margin:0 0 18px;background:var(--card);overflow:hidden}
.card .hd{padding:9px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.card .hd small{color:var(--muted);font-weight:400;font-size:11.5px;margin-left:8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);text-align:right;background:var(--bg)}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td{text-align:right}
tr.grp td{background:var(--bg);color:var(--muted);font-weight:700;text-align:left;font-size:12px}
.erc{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.erbar{position:relative;width:120px;height:12px;background:var(--mid);border-radius:2px}
.erbar i{position:absolute;top:0;bottom:0;border-radius:2px}
.erbar:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--zero)}
.v{display:inline-block;min-width:38px}
.lo{color:var(--warn);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:10px}
.sm{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px 4px;position:relative}
.sm .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.sm .t span{color:var(--muted);font-weight:400;font-size:11.5px}
.sm svg{display:block;width:100%;height:130px;overflow:visible}
.tip{position:fixed;pointer-events:none;background:var(--btn);color:var(--bg);font-size:11.5px;padding:4px 8px;border-radius:5px;display:none;z-index:9;white-space:nowrap}
.msg{padding:14px;color:var(--warn);font-size:13px}
.led{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}
.led .c{flex:0 0 auto;min-width:74px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:5px 8px;text-align:center;line-height:1.35}
.led .c b{display:block;font-size:13.5px}
.led .c i{font-style:normal;display:block;font-size:11px;color:var(--muted)}
.led .c em{font-style:normal;display:block;font-size:12px;font-weight:700;color:#15803d}
.led .c.part em{color:var(--warn)}
.led .c.miss{border-style:dashed;border-color:var(--up);background:transparent}
.led .c.miss em{color:var(--up)}
.led .c.we{opacity:.7}
.led .c.last{border:2px solid var(--fg)}
.stat{padding:0 12px 10px;font-size:13px;font-weight:600}
.dlt{font-size:11.5px;font-weight:600}
.dlt.u{color:var(--up)}.dlt.d{color:var(--dn)}.dlt.z{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h1">📐 Earnings Revision</h1>
  <p class="sub" id="sub"></p>
  <p class="note">
    <b>ER</b> = (기간 내 EPS 추정 상향 건수 − 하향 건수) ÷ 애널리스트 수 × 100 (−100 ~ +100). <b>EPS 1M·3M</b> = 컨센서스 EPS 의 30·90일 전 대비 변화율.
    자료: Yahoo Finance — 평일 16:44 KST 적재(2026-11-10 시작), 블룸버그보다 커버 증권사가 적어 <span class="lo">애널리스트 5명 미만</span>은 1~2건에도 크게 튄다.
    갱신: <a href="https://github.com/gschoie/ecos-fx-rates/actions/workflows/earnings-revision.yml" target="_blank" rel="noopener">ecos-fx-rates Actions › Earnings Revision 적재 › Run workflow</a>
  </p>
  <div class="bar">
    <div class="seg" id="segS"></div>
    <div class="seg" id="segP"><button data-p="0y" class="on">FY1(올해)</button><button data-p="+1y">FY2(내년)</button></div>
    <div class="seg" id="segW"><button data-w="30" class="on">30일</button><button data-w="7">7일</button></div>
    <button class="dl" id="dl">⬇ 데이터(CSV)</button>
  </div>
  <div id="out"></div>
</div>
<div class="tip" id="tip"></div>
<script>
(function(){
  const URL_CSV="https://raw.githubusercontent.com/gschoie/ecos-fx-rates/main/output/earnings_revision/er_history.csv?t="+Math.floor(Date.now()/600000);
  const SECTORS=[["조선","🚢"],["방산","🛡️"],["건설기계","🏗️"]];
  const qs=new URLSearchParams(location.search);
  let S=qs.get("s")||"조선",P="0y",W="30",ROWS=[],RAW="";
  const $=id=>document.getElementById(id),tip=$("tip");
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const num=v=>v===""||v==null?null:+v;
  const fmtPct=v=>v==null||!isFinite(v)?"–":(v>0?"+":"")+(v*100).toFixed(1)+"%";
  const fmtEr=v=>v==null?"–":(v>0?"+":"")+Math.round(v);

  function parseCSV(t){
    t=t.replace(/^﻿/,"");const out=[];let row=[],f="",q=false;
    for(let i=0;i<t.length;i++){const c=t[i];
      if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
      else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
      else if(c=="\n"){row.push(f);out.push(row);row=[];f=""}else if(c!="\r")f+=c}
    if(f||row.length){row.push(f);out.push(row)}
    const h=out.shift();return out.filter(r=>r.length===h.length).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])));
  }

  SECTORS.forEach(([s,ic])=>{const b=document.createElement("button");b.textContent=ic+" "+s;b.dataset.s=s;$("segS").appendChild(b)});
  function syncSeg(){
    $("segS").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.s===S));
    $("segP").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.p===P));
    $("segW").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.w===W));
  }
  $("segS").onclick=e=>{const b=e.target.closest("button");if(!b)return;S=b.dataset.s;history.replaceState(null,"","?s="+encodeURIComponent(S));render()};
  $("segP").onclick=e=>{const b=e.target.closest("button");if(!b)return;P=b.dataset.p;render()};
  $("segW").onclick=e=>{const b=e.target.closest("button");if(!b)return;W=b.dataset.w;render()};
  $("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([RAW],{type:"text/csv"}));
    a.download="er_history_"+new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Seoul"}).replace(/-/g,"")+".csv";document.body.appendChild(a);a.click();a.remove()};

  function erBar(v){
    if(v==null)return `<div class="erc"><div class="erbar"></div><span class="v">–</span></div>`;
    const w=Math.min(100,Math.abs(v))/2,left=v>=0?50:50-w;
    return `<div class="erc"><div class="erbar"><i style="left:${left}%;width:${w}%;background:var(${v>=0?"--up":"--dn"})"></i></div><span class="v">${fmtEr(v)}</span></div>`;
  }

  function spark(series){
    // series: [{d,er}] 날짜순. y = −100~+100 고정(종목 간 비교), x = 날짜 순번
    const Wd=240,H=130,pt=8,pb=18,pl=26,pr=8,n=series.length;
    const x=i=>pl+(n<=1?(Wd-pl-pr)/2:i*(Wd-pl-pr)/(n-1)),y=v=>pt+(100-v)/200*(H-pt-pb);
    let g=`<line x1="${pl}" x2="${Wd-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--zero)" stroke-width="1"/>`;
    [100,50,-50,-100].forEach(v=>g+=`<line x1="${pl}" x2="${Wd-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`);
    [100,0,-100].forEach(v=>g+=`<text x="${pl-4}" y="${y(v)+3.5}" font-size="9" fill="var(--muted)" text-anchor="end">${v}</text>`);
    const pts=series.map((s,i)=>s.er==null?null:[x(i),y(s.er)]);
    let d="",pen=false;pts.forEach(p=>{if(!p){pen=false;return}d+=(pen?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1);pen=true});
    if(d)g+=`<path d="${d}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/>`;
    // 날마다 점 하나 = 그날 적재됨(빈 날은 점·선이 끊김), 마지막 점만 크게 색칠
    const col=v=>`var(${v>0?"--up":v<0?"--dn":"--zero"})`,li=series.map(s=>s.er!=null).lastIndexOf(true);
    series.forEach((s,i)=>{if(s.er==null)return;
      g+=i===li?`<circle cx="${x(i)}" cy="${y(s.er)}" r="4.5" fill="${col(s.er)}" stroke="var(--bg)" stroke-width="2"/>`
               :`<circle cx="${x(i)}" cy="${y(s.er)}" r="2.6" fill="var(--fg)"/>`});
    // 날짜 눈금: 8개 이하면 전부, 많으면 간격을 두고(처음·끝은 항상)
    const step=n<=8?1:Math.ceil(n/6);
    series.forEach((s,i)=>{if(i%step&&i!==n-1)return;if(i!==n-1&&n-1-i<step&&i)return;
      const a=n===1?"middle":i===0?"start":i===n-1?"end":"middle";
      g+=`<text x="${x(i)}" y="${H-4}" font-size="9.5" fill="var(--muted)" text-anchor="${a}">${+s.d.slice(5,7)}/${+s.d.slice(8)}</text>`});
    return `<svg viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none" data-s='${esc(JSON.stringify(series))}' data-g="${pl},${Wd-pr}">${g}<rect x="0" y="0" width="${Wd}" height="${H}" fill="transparent"/></svg>`;
  }

  // ── 적재 현황: 날짜마다 몇 종목이 들어왔나 + 빠진 평일 ──
  const kst=()=>new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
  const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const WK="일월화수목금토";
  function ledger(dates){
    const secRows=ROWS.filter(r=>r.sector===S);
    const expAll=new Set(ROWS.map(r=>r.ticker)).size, expSec=new Set(secRows.map(r=>r.ticker)).size;
    const cnt=(rs,d)=>new Set(rs.filter(r=>r.date===d).map(r=>r.ticker)).size;
    // 평일인데 빠진 날: 첫 적재일 ~ '받았어야 할 마지막 날'(평일 17:30 이후면 오늘, 아니면 직전 평일)
    const now=kst(),have=new Set(dates),cells=[];
    let due=new Date(now);if(!(now.getDay()%6&&now.getHours()*60+now.getMinutes()>=17*60+30))due.setDate(due.getDate()-1);
    while(!(due.getDay()%6))due.setDate(due.getDate()-1);
    const end=ymd(due)>dates[dates.length-1]?ymd(due):dates[dates.length-1];
    for(let d=new Date(dates[0]+"T00:00:00");ymd(d)<=end;d.setDate(d.getDate()+1)){
      const k=ymd(d),we=!(d.getDay()%6);
      if(have.has(k))cells.push({k,we,a:cnt(ROWS,k),s:cnt(secRows,k)});
      else if(!we)cells.push({k,we,miss:true});
    }
    const missing=cells.filter(c=>c.miss).length,lastC=cells.filter(c=>!c.miss).pop();
    const okToday=have.has(ymd(due));
    const stat=missing?`⚠️ 빠진 평일 ${missing}일 — 아래 빨간 점선 칸(그날 값은 소급 불가)`
      :okToday?`✅ ${+ymd(due).slice(5,7)}/${+ymd(due).slice(8)}(${WK[due.getDay()]})까지 하루도 빠짐없이 적재됨`
      :`⏳ 오늘 분은 16:44 이후 적재`;
    const show=cells.slice(-20);
    let h=`<div class="card"><div class="hd">📅 적재 현황<small>칸마다 그날 들어온 종목 수 · 위 = 전체 ${expAll}종목 · 아래 = ${S} ${expSec}종목${cells.length>20?" · 최근 20칸":""}</small></div><div class="led">`;
    show.forEach(c=>{const md=`${+c.k.slice(5,7)}/${+c.k.slice(8)}`,w=WK[new Date(c.k+"T00:00:00").getDay()];
      if(c.miss){h+=`<div class="c miss"><b>${md}</b><i>${w}</i><em>누락</em></div>`;return}
      const full=c.a>=expAll;
      h+=`<div class="c${full?"":" part"}${c.we?" we":""}${c===lastC?" last":""}" title="${c.k} · 전체 ${c.a}/${expAll} · ${S} ${c.s}/${expSec}${c.we?" · 주말에 늦게 돈 실행(직전 평일 값과 거의 같음)":""}">
        <b>${md}</b><i>${w}${c.we?" · 주말":""}</i><em>${full?"✓ ":""}${c.a}/${expAll}</em><i>${S} ${c.s}/${expSec}</i></div>`});
    return h+`</div><div class="stat">${stat}</div></div>`;
  }

  function render(){
    syncSeg();
    const ic=(SECTORS.find(s=>s[0]===S)||["","📐"])[1];
    $("h1").textContent=`📐 Earnings Revision — ${ic} ${S}`;
    const rows=ROWS.filter(r=>r.sector===S&&r.period===P);
    if(!rows.length){$("out").innerHTML=`<div class="msg">${S} 데이터가 아직 없습니다.</div>`;$("sub").textContent="";return}
    const dates=[...new Set(ROWS.map(r=>r.date))].sort(),last=dates[dates.length-1];
    $("sub").textContent=`기준일 ${last} · 적재 ${dates.length}일 (${dates[0]}~) · ${P==="0y"?"FY1(올해 회계연도)":"FY2(내년)"} · ER ${W}일`;
    const prev=dates.length>1?dates[dates.length-2]:null;
    const erk="er"+W,upk="up"+W,dnk="down"+W;
    // 종목 순서 = CSV 첫 등장 순, 지역별로 묶는다
    const order=[];rows.forEach(r=>{if(!order.includes(r.ticker))order.push(r.ticker)});
    const latest=Object.fromEntries(rows.filter(r=>r.date===last).map(r=>[r.ticker,r]));
    const any=Object.fromEntries(rows.map(r=>[r.ticker,r]));
    const prevRows=prev?Object.fromEntries(rows.filter(r=>r.date===prev).map(r=>[r.ticker,r])):{};
    const prevOf=t=>prevRows[t]?num(prevRows[t][erk]):null;
    const delta=(a,b)=>{if(a==null||b==null)return '<span class="dlt z">–</span>';const d=Math.round(a-b);
      return d===0?'<span class="dlt z">0</span>':`<span class="dlt ${d>0?"u":"d"}">${d>0?"▲":"▼"}${Math.abs(d)}</span>`};
    // 지역 그룹 순서: 한국 → 한국 조기 → 그 외
    const regions=[];order.forEach(t=>{const g=any[t].region;if(!regions.includes(g))regions.push(g)});
    const rk=g=>g==="한국"?0:g.startsWith("한국")?1:2;regions.sort((a,b)=>rk(a)-rk(b));   // 안정 정렬 → 해외는 첫 등장 순
    let tb=`<div class="card"><div class="hd">최신 스냅샷<small>${last} · 막대 = ER(−100 ~ +100), 빨강 상향 · 파랑 하향</small></div><div class="tw"><table>
      <thead><tr><th>종목</th><th></th><th>애널리스트</th><th>상향</th><th>하향</th><th>ER ${W}일</th><th title="직전 적재일 대비 ER 변화">${prev?`vs ${+prev.slice(5,7)}/${+prev.slice(8)}`:"전일 대비"}</th><th>EPS 1M</th><th>EPS 3M</th><th>통화</th></tr></thead><tbody>`;
    regions.forEach(g=>{
      tb+=`<tr class="grp"><td colspan="10">${esc(g)}</td></tr>`;
      order.filter(t=>any[t].region===g).forEach(t=>{const r=latest[t];
        if(!r){tb+=`<tr><td>${esc(any[t].name)}</td><td></td><td colspan="8" style="text-align:left;color:var(--muted)">오늘 수집 실패(최근값 아래 차트 참고)</td></tr>`;return}
        const n=num(r.n_analysts);
        tb+=`<tr><td title="${esc(r.ticker)}">${esc(r.name)}</td><td style="color:var(--muted);font-size:11px">${esc(r.ticker)}</td>
          <td>${n==null?"–":n}${n!=null&&n<5?' <span class="lo">⚠적음</span>':""}</td>
          <td>${num(r[upk])??"–"}</td><td>${num(r[dnk])??"–"}</td><td>${erBar(num(r[erk]))}</td><td>${delta(num(r[erk]),prevOf(t))}</td>
          <td>${fmtPct(num(r.eps_chg_1m))}</td><td>${fmtPct(num(r.eps_chg_3m))}</td><td style="color:var(--muted)">${esc(r.currency)}</td></tr>`});
    });
    tb+=`</tbody></table></div></div>`;
    let sm=`<div class="card"><div class="hd">ER ${W}일 추이<small>종목별 같은 축(−100 ~ +100) · 작은 점 = 그날 적재값, 큰 점 = 최신 · 마우스를 올리면 날짜별 값</small></div><div class="grid">`;
    regions.forEach(g=>order.filter(t=>any[t].region===g).forEach(t=>{
      const byD=Object.fromEntries(rows.filter(r=>r.ticker===t).map(r=>[r.date,r]));
      const ser=dates.filter(d=>d>=Object.keys(byD).sort()[0]).map(d=>({d,er:byD[d]?num(byD[d][erk]):null,n:byD[d]?num(byD[d].n_analysts):null}));
      const lv=latest[t]?num(latest[t][erk]):null;
      sm+=`<div class="sm"><div class="t">${esc(any[t].name)}<span>${esc(g)} · ${lv==null?"–":fmtEr(lv)}</span></div>${spark(ser)}</div>`;
    }));
    sm+=`</div>${dates.length<5?'<div class="note" style="padding:0 12px 6px">적재 초기라 점이 몇 개뿐입니다 — 매일 하나씩 쌓여 선이 됩니다.</div>':""}</div>`;
    $("out").innerHTML=ledger(dates)+tb+sm;
  }

  // 작은 차트 hover: 가장 가까운 날짜의 값
  document.addEventListener("mousemove",e=>{
    const svg=e.target.closest&&e.target.closest(".sm svg");
    if(!svg){tip.style.display="none";return}
    const ser=JSON.parse(svg.dataset.s),[x0,x1]=svg.dataset.g.split(",").map(Number),rc=svg.getBoundingClientRect();
    const vx=(e.clientX-rc.left)/rc.width*240,n=ser.length;
    const i=n<=1?0:Math.max(0,Math.min(n-1,Math.round((vx-x0)/(x1-x0)*(n-1))));const s=ser[i];
    tip.innerHTML=`${s.d} · ER ${fmtEr(s.er)}${s.n!=null?` · 애널 ${s.n}명`:""}`;tip.style.display="block";
    tip.style.left=Math.min(innerWidth-tip.offsetWidth-8,e.clientX+12)+"px";tip.style.top=(e.clientY+14)+"px";
  });

  fetch(URL_CSV,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text()})
    .then(t=>{RAW=t;ROWS=parseCSV(t);render()})
    .catch(x=>{syncSeg();$("out").innerHTML=`<div class="msg">데이터를 불러오지 못했습니다(${esc(x.message)}) — ecos-fx-rates 의 ER 적재가 main 에 아직 반영되지 않았을 수 있습니다.</div>`});
})();
</script>
</body>
</html>
