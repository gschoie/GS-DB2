name: "[시험용] 베이시스 수집 실호출 확인"

# 새로 넣은 베이시스 수집 함수들을 **실제 한투 API 로** 한 번 돌려본다.
# 저장·발송·커밋은 하지 않는다(읽기만). 확인이 끝나면 이 파일은 지운다.
on:
  push:
    branches: [claude/telegram-trend-analysis-logic-7efsdy]
    paths: [".github/workflows/_probe-futures-price.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: 패키지
        working-directory: market_flow
        run: pip install -r requirements.txt
      - name: 산식 테스트
        working-directory: market_flow
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: 실호출
        working-directory: market_flow
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python - <<'PY'
          import json
          import scrape

          con = scrape.front_contract()
          print("근월물:", con)

          b = scrape.futures_basis(con["code"])
          print("현재 베이시스:", json.dumps(b, ensure_ascii=False))
          assert b["fut"] and b["spot"], "선물/현물 가격이 비었다"
          assert abs((b["fut"] - b["spot"]) - b["basis"]) < 0.05, \
              f"베이시스 불일치: {b['fut']} - {b['spot']} != {b['basis']}"

          bd = scrape.basis_daily(con["ym"])
          print(f"\n일별 베이시스 {len(bd)}일")
          for d in sorted(bd)[-12:]:
              v = bd[d]
              print(f"  {d} 선물 {v['fut']:>9,.2f} · 현물 {v['spot']:>9,.2f} "
                    f"· 베이시스 {v['basis']:+7.2f}p · {v['contract']}")
          contracts = sorted({v["contract"] for v in bd.values()})
          print("\n쓰인 월물:", contracts)
          PY
