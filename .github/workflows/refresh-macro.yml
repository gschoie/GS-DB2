name: 네이버 매크로 2시간 갱신

# 오늘의 요약 상단 '네이버 글로벌경제 Top5'만 2시간마다 새로 긁어 재배포한다.
# 뉴스/톤 파이프라인은 건드리지 않고, 캐시된 데이터로 사이트를 통째로 다시 빌드한다.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"   # 2시간마다(UTC 정각)

permissions:
  contents: read
  pages: write
  id-token: write

# 주의: 워크플로 레벨 concurrency에 'pages'를 걸지 말 것. 아래 deploy 잡도 같은 그룹을
# 쓰기 때문에 자기 run이 쥔 자물쇠를 자기 잡이 다시 기다리는 교착이 되어, deploy 잡이
# 러너도 배정받지 못하고 0초 만에 실패한다(2026-08-23 Pages 원복 이후 78회 연속 실패의 원인).
# 배포 직렬화는 deploy 잡의 concurrency만으로 충분하다 — 나머지 4개 워크플로와 동일.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 주의: 캐시가 newsdb-/hhiun- 둘로 분리된 뒤에도 이 워크플로만 옛 dashboard-db- 키로
      # 복원하고 있었다. 그 키는 더 이상 저장되지 않아 07-13 시점에 얼어붙었고, 2시간마다
      # 그 냉동 DB로 사이트를 통째로 되돌려 배포했다. 반드시 deploy-pages와 같은 키 순서로 복원할 것.
      - name: 뉴스DB 캐시 복원(읽기 전용)
        uses: actions/cache/restore@v5
        with:
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/macro.json
          key: newsdb2-${{ github.run_id }}
          # newsdb2-: 2026-07-30 캐시 오염 사고 후 새 네임스페이스. path 목록이 버전 해시라
          # 5개 워크플로 모두 동일해야 함(다르면 조용한 복원 미스).
          restore-keys: |
            newsdb2-

      - name: 노조 캐시 복원(읽기 전용)
        uses: actions/cache/restore@v5
        with:
          path: |
            telegram_research_dashboard/data/hhiun_snapshot.json
            telegram_research_dashboard/data/hhiun_top.json
            telegram_research_dashboard/static/hhiun_board_report.html
          key: hhiun-${{ github.run_id }}
          restore-keys: |
            hhiun-

      - name: 매크로 데이터 수집 (네이버 글로벌경제 Top5)
        working-directory: telegram_research_dashboard
        run: python fetch_macro.py

      - name: 배포용 HTML 생성 (fresh, prebuilt 덮어쓰기 없음)
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
          # 배포본 안전망 fetch가 Access 로그인 벽을 통과하기 위한 서비스 토큰(선택)
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python build_static.py

      - name: 배포 안전망 검사
        working-directory: telegram_research_dashboard
        run: python verify_static_output.py _site/index.html

      - uses: actions/configure-pages@v6
        with:
          # 8/18 Unpublish로 사이트가 꺼져 있으면 자동으로 다시 켠다
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: telegram_research_dashboard/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
