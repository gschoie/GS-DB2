name: 대시보드 업데이트 및 배포

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  # 봇(GITHUB_TOKEN)이 스냅샷을 push하면 on:push가 안 걸리므로(무한루프 방지 정책),
  # 컨센 워크플로 완료 이벤트로 배포를 잇는다. workflow_run은 토큰 제약을 우회한다.
  workflow_run:
    workflows: ["KOSPI200 컨센 트래킹", "시장 수급 동향", "시장관심 내러티브", "글로벌 방산 브리핑", "글로벌 방산 주간정리", "글로벌 건설기계 브리핑", "글로벌 건설기계 주간정리", "유튜브 3일 모음", "ETF 섹터 신호", "Claude 방산 브리핑 수집", "밸류에이션 PER·PBR·ROE·PSR"]
    types: [completed]
  schedule:
    # 한국시간 06·09·12·15·18·21·24시 (3시간 간격, 하루 7회) 자동 갱신.
    # KST→UTC: 06→21(전일) 09→00 12→03 15→06 18→09 21→12 24→15
    # 정각은 GitHub 큐가 몰려 자주 밀리므로 10분 오프셋을 준다(베스트에포트).
    - cron: "10 0,3,6,9,12,15,21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# 주의: concurrency를 워크플로 전체에 걸면, group을 공유하는 여러 워크플로(deploy-pages·
# refresh-news·refresh-union)가 서로의 '대기 중' run을 취소해 수집/캐시저장이 유실된다.
# → concurrency는 Pages 배포 직렬화를 위해 deploy 잡에만 건다(빌드는 취소 없이 완주).

jobs:
  build:
    runs-on: ubuntu-latest
    # 컨센 워크플로가 실패로 끝났으면 새 커밋이 없으므로 재배포하지 않는다.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 캐시를 뉴스DB/노조 둘로 분리한다. 복원은 모든 run이 읽기전용으로(restore),
      # 저장은 그 데이터를 실제로 갱신하는 run만(save). → push·refresh-union 같은
      # 비수집 run이 stale DB로 뉴스 캐시를 덮어써 07-08로 리버트되던 문제를 근절.
      - name: 뉴스DB 캐시 복원
        uses: actions/cache/restore@v5
        with:
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/macro.json
          key: newsdb2-${{ github.run_id }}
          # newsdb2-: 2026-07-30 캐시 오염 사고 후 새 네임스페이스. 캐시 '버전'은 path 목록의
          # 해시라서 path를 바꾸면 기존 캐시 전체가 조용히 복원 불가가 된다(사고 원인) —
          # path 목록은 5개 워크플로 모두 동일하게 유지하고, 바꿀 땐 키 네임스페이스도 함께 올릴 것.
          # 콜드스타트 시 커밋 DB로 폴백해도 임포터가 DB 최신일까지 거슬러 수집 + 신선도 검사가 방어.
          restore-keys: |
            newsdb2-

      - name: 노조 캐시 복원
        uses: actions/cache/restore@v5
        with:
          path: |
            telegram_research_dashboard/data/hhiun_snapshot.json
            telegram_research_dashboard/data/hhiun_top.json
            telegram_research_dashboard/static/hhiun_board_report.html
          key: hhiun-${{ github.run_id }}
          restore-keys: |
            hhiun-

      - name: 파이프라인 계약 테스트
        working-directory: telegram_research_dashboard
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Python 패키지 준비
        if: github.event_name != 'push' && github.event_name != 'workflow_run'
        run: |
          python -m pip install requests beautifulsoup4 lxml pycryptodome pypdf telethon pypdfium2 pytesseract
          # 이미지형 PDF(2025년 시절) 표지에서 적정주가를 읽기 위한 OCR
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor

      - name: 공개 텔레그램 최신 글 수집
        if: github.event_name != 'push' && github.event_name != 'workflow_run'
        working-directory: telegram_research_dashboard
        # 날짜 기반 증분 수집. 3시간마다(하루 7회) 도는 자동 갱신이라 3일 재확인이면
        # 겹침이 충분해 누락 0이고, 매번 재긁는 페이지가 적어 빠르다. (수동 🔄뉴스갱신은 2주창)
        # --pages 120 은 안전 상한(콜드스타트·이상시 무한 크롤 방지).
        run: python public_importer.py --channel https://t.me/HI_GS --pages 120 --since-days 3

      # 전체 재분류는 파서 버전(parser.PARSER_VERSION)이 캐시 DB의 기록과 다를 때만 돈다.
      # 평상시엔 수 초 만에 생략되고, 파서 규칙을 바꾼 뒤 첫 수집 런에서 한 번만 40분+ 소요.
      - name: 파서 변경 시 전체 재분류 (1회성)
        if: github.event_name != 'push' && github.event_name != 'workflow_run'
        working-directory: telegram_research_dashboard
        run: python rebuild_parsed_data.py --if-parser-changed

      - name: 링크 기사 제목 및 기업 보강
        if: github.event_name != 'push' && github.event_name != 'workflow_run'
        working-directory: telegram_research_dashboard
        run: python enrich_link_news.py --limit 5000 --all

      - name: 내 코멘트 backfill 및 기사 제목 정리
        if: github.event_name != 'push' && github.event_name != 'workflow_run'
        working-directory: telegram_research_dashboard
        run: python backfill_comments.py

      - name: 수동 기업 교정 적용
        if: github.event_name != 'push' && github.event_name != 'workflow_run'
        working-directory: telegram_research_dashboard
        run: python apply_corrections.py

      # 텔레그램 본문에 TP가 없는 기업분석 보고서는 PDF 표지에서 적정주가를 읽어 채운다
      # (2025년 이후, 이미지형 PDF는 OCR). 재분류/재수집이 지운 값도 여기서 다시 채워진다.
      - name: 보고서 TP 보강 (PDF 표지·OCR)
        if: github.event_name != 'push' && github.event_name != 'workflow_run'
        working-directory: telegram_research_dashboard
        # 2026-07-30: 이 단계가 행에 걸려 수집 런이 2~3시간 잠기는 사고 → 상한을 두고,
        # TP 보강은 부가 기능이므로 실패해도 나머지 파이프라인(빌드·배포)은 계속 간다.
        timeout-minutes: 20
        continue-on-error: true
        run: python enrich_report_tp.py

      - name: 매크로 데이터 수집 (글로벌경제 · 핵심요약)
        if: github.event_name != 'push' && github.event_name != 'workflow_run'
        working-directory: telegram_research_dashboard
        run: python fetch_macro.py

      # ── 배포 레이스 방지 ──
      # 예약 런은 수집에 20분+ 걸려, 시작 시점 커밋의 낡은 코드로 그 사이 완료된
      # push 배포(최신 코드)를 덮어쓸 수 있다(2026-07-29 실제 발생: 8c290ab push
      # 배포 완료 27초 뒤, 14:27에 시작된 a4c8d9d 예약 런이 덮어씀).
      # concurrency group=pages는 배포를 직렬화할 뿐 순서를 보장하지 않으므로,
      # 빌드 직전에 origin/main이 앞서 있으면 '코드'(*.py·static)만 최신으로 당겨
      # 방금 수집한 데이터 위에 재빌드한다. → 남는 레이스 창이 20분 → 1~2분으로 준다.
      # data/* 와 캐시로 복원된 static/hhiun_board_report.html 은 리포지토리 버전이
      # 더 낡으므로 건드리지 않는다(나머지 static/*.html 봇 산출물은 커밋되므로 OK).
      - name: 최신 코드 동기화 (배포 레이스 방지)
        run: |
          git fetch --quiet --depth=1 origin main
          latest=$(git rev-parse FETCH_HEAD)
          current=$(git rev-parse HEAD)
          if [ "$latest" != "$current" ]; then
            echo "::notice::main 전진 감지(${current:0:7} → ${latest:0:7}) — 코드 파일을 최신으로 동기화해 빌드"
            git checkout "$latest" -- \
              'telegram_research_dashboard/*.py' \
              'telegram_research_dashboard/static/' \
              ':(exclude)telegram_research_dashboard/static/hhiun_board_report.html'
          fi

      - name: 배포용 HTML 생성
        if: github.event_name != 'push' && github.event_name != 'workflow_run'
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
          # 배포본 안전망 fetch가 Access 로그인 벽을 통과하기 위한 서비스 토큰(선택)
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        # 노조게시판(build_hhiun) 수집은 여기서 빼고 별도 refresh-union 워크플로가 하루 2회만 돌린다.
        # 캐시로 복원된 hhiun_top.json 을 build_static 이 그대로 구우므로 대시보드엔 항상 표시된다.
        run: python build_static.py

      - name: 배포용 HTML 생성 (push · 커밋된 데이터로 재빌드)
        # push에서도 얼어붙은 prebuilt 대신, 리포지토리에 커밋된 최신 데이터(dashboard.db·톤)로
        # 다시 빌드한다. 텔레그램 수집 등 무거운 단계는 건너뛰고 build_static만 돌린다(표준 라이브러리).
        # → static/app.js 등 코드 변경도 prebuilt 재생성 없이 바로 반영된다.
        if: github.event_name == 'push' || github.event_name == 'workflow_run'
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
          # 배포본 안전망 fetch가 Access 로그인 벽을 통과하기 위한 서비스 토큰(선택)
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python build_static.py

      - name: 배포 안전망 검사
        working-directory: telegram_research_dashboard
        run: python verify_static_output.py _site/index.html

      # 뉴스/톤/매크로를 실제로 수집한 run(비 push)만 뉴스DB 캐시를 저장한다.
      - name: 뉴스DB 캐시 저장 (수집 run만)
        if: github.event_name != 'push' && github.event_name != 'workflow_run'
        uses: actions/cache/save@v5
        with:
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/macro.json
          key: newsdb2-${{ github.run_id }}

      - uses: actions/configure-pages@v6
        with:
          # 8/18 Unpublish로 사이트가 꺼져 있으면 자동으로 다시 켠다
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: telegram_research_dashboard/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
