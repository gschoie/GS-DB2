# 친구 휴가 일정 추적 설정.
#
# friends: 추적할 1:1 대화 상대. 이름만 적으면 텔레그램 대화 목록의 '표시 이름'으로
# 찾는다(성+이름, 공백 무시). 표시 이름이 다르거나 동명이인이 있으면 아래처럼
# username(@ 없이)이나 chat_id를 붙여 확정할 것:
#   - name: 이준범
#     username: junbeom_lee
# 매칭이 되는지는 워크플로 mode=probe로 확인할 수 있다(메시지는 읽지 않는다).

friends:
  # scan: false = 텔레그램 수집은 안 하고, 기입 폼의 이름 목록에만 올린다 (본인 등).
  - name: 최광식
    scan: false
  - 이준범
  - 박영도
  - 김지원
  - 이정우
  - 김진영
  - 유지웅
  - 고영민
  - 김혜영
  - 김연미
  - 김상혁
  - 이지수
  - 박종현
  - 이다연
  - 임도영
  - 박소현
  - 한수빈

# 첫 실행(또는 오래 쉰 뒤)에 거슬러 읽을 날짜 창. 이후에는 마지막 메시지 id부터 증분.
lookback_days: 30
# 대화당 한 번에 읽는 최대 메시지 수 (증분이라 평소엔 몇 건 안 된다)
per_chat_limit: 300
# 내가 보낸 메시지도 후보로 볼지 — 내가 대화창에 상대 일정을 대신 적어두는 관행 지원.
# 켜면 내 메시지도 '그 대화 상대'의 휴가/출장으로 판정된다 (질문은 Gemini가 걸러냄).
include_own_messages: true
