    youtube: 금통위 기준금리 소수의견

# ── 시세 밴드 ────────────────────────────────────────────────────────────
# 위 indicators 는 **달에 한 번 발표되는 지표**의 해석이다. 이쪽은 **매일 바뀌는 시세**가
# 지금 어느 구간에 있는지 — 텔레그램 '지금 구간' 줄과 그 아래 한 줄의 근거가 된다.
#
# 밴드는 **위에서부터 처음 맞는 것 하나**만 쓴다. ge = 이상, lt = 미만, 조건이 없으면
# 마지막 폴백. 그래서 순서가 곧 규칙이다 — 좁은 조건을 위에 둔다.
# 값을 못 구한 항목은 아예 빠진다(지어내지 않는다 — '–' 원칙의 같은 줄기).
#
# 여기 적는 숫자는 **대략의 기준**이고 매매 신호가 아니다. 기준을 바꾸고 싶으면
# 코드가 아니라 이 절만 고치면 된다.
quote_reads:
  us10y:
    name: 미 10년물
    unit: pct
    bands:
      - {ge: 5.0, say: "5% 이상 — 장기자금 조달이 비싸진 구간. 장기채·성장주에 역풍이 강하다"}
      - {ge: 4.0, say: "4~5% — 높지만 시장이 이미 적응한 구간"}
      - {ge: 3.0, say: "3~4% — 부담이 눌린 구간. 밸류에이션에 숨통이 트인다"}
      - {say: "3% 미만 — 경기 둔화를 선반영하는 구간"}
  t10y2y:
    name: 10−2년 스프레드
    unit: pp
    bands:
      - {lt: 0,   say: "역전 — 침체 신호로 읽히는 구간. 길게 유지되면 은행 마진도 눌린다"}
      - {lt: 0.3, say: "정상이지만 평탄 — 역전에서 막 벗어난 구간"}
      - {say: "정상 — 장기금리가 단기보다 높다"}
  dfii10:
    name: 10년 실질금리
    unit: pct
    bands:
      - {ge: 2.5, say: "2.5% 이상 — 물가를 뺀 실질 부담이 큰 구간. 금·성장주에 가장 아프다"}
      - {ge: 1.0, say: "1~2.5% — 중립 범위"}
      - {say: "1% 미만 — 돈이 싼 구간. 위험자산에 우호적"}
  usdkrw:
    name: 원/달러
    unit: krw
    bands:
      - {ge: 1400, say: "1,400원 이상 — 당국 개입·외국인 순매도가 같이 거론되는 구간"}
      - {ge: 1300, say: "1,300원대 — 수출엔 유리, 외국인 수급엔 부담인 구간"}
      - {say: "1,300원 미만 — 원화가 안정된 구간"}
  vix:
    name: VIX
    unit: idx
    bands:
      - {ge: 30, say: "30 이상 — 공포 구간. 상관관계가 1로 붙어 분산이 안 통한다"}
      - {ge: 20, say: "20~30 — 경계 구간"}
      - {ge: 15, say: "15~20 — 보통"}
      - {say: "15 미만 — 평온. 나쁜 뉴스에 과민해지기 쉬운 구간이기도 하다"}

# ── 기초 ────────────────────────────────────────────────────────────────
# "매크로를 잘 모른다"에서 출발하는 사람이 먼저 알아야 할 것들
basics:
  - id: bond_price
    title: 금리가 오르면 채권값은 왜 떨어지나
    body: |
      채권은 **정해진 이자를 주는 종이**다. 시장금리가 4%로 올랐는데 내 채권이 3%만
      준다면, 그 종이는 싸게 팔아야 팔린다. 그래서 **금리 ↑ = 채권가격 ↓**가 항상 성립한다.
      만기가 길수록(10년 > 2년) 같은 금리 변화에 가격이 더 크게 움직인다(듀레이션).
    youtube: 금리와 채권가격 반비례 듀레이션

  - id: curve
    title: 수익률곡선과 '장단기 역전'
    body: |
      보통은 돈을 오래 빌려줄수록 이자를 더 받는다(10년 > 2년). 그런데 **10년물이
      2년물보다 낮아지는 역전**이 생기면, 시장이 "곧 경기가 나빠져 금리가 내려갈 것"이라고
      보는 것이다. 역사적으로 침체를 앞서 알린 적이 많아 가장 유명한 경고등이다.
      다만 **역전 자체보다 역전이 풀리는 시점**이 침체와 더 가깝다는 점이 자주 간과된다.
    youtube: 장단기 금리 역전 수익률곡선

  - id: real_rate
    title: 실질금리 — 진짜 돈값
    body: |
      명목금리에서 기대 물가를 뺀 것이 **실질금리**다. 금리가 5%여도 물가가 4%면
      실제 부담은 1%뿐이다. 금·성장주·신흥국 자산은 명목금리보다 **실질금리**에 더
      민감하다. 미국 10년 물가연동국채(TIPS) 금리가 실질금리의 대표 지표다.
    youtube: 실질금리 TIPS 금 상관관계

  - id: expectation
    title: 왜 '예상 대비'가 숫자 자체보다 중요한가
    body: |
      시장 가격에는 **이미 예상치가 들어가 있다.** CPI가 3%로 높아도 예상이 3.2%였다면
      그날은 금리가 내린다. 그래서 지표를 볼 때는 항상 ① 예상치 ② 직전치 ③ 실제치
      셋을 같이 봐야 한다. "좋은 숫자인데 왜 떨어지지?"의 답은 대개 여기에 있다.
    youtube: 경제지표 예상치 서프라이즈

  - id: good_bad_news
    title: 좋은 뉴스가 나쁜 뉴스가 되는 구간
    body: |
      연준이 물가를 잡으려 금리를 높일 때는 **경기가 좋다는 소식이 주식에 악재**가 된다
      (금리를 더 오래 높게 유지할 테니까). 반대로 침체가 걱정인 국면에서는 같은 소식이
      호재다. **지금이 '물가 걱정' 국면인지 '성장 걱정' 국면인지**를 먼저 정해야
      지표 해석의 방향이 선다.
    youtube: 좋은뉴스 나쁜뉴스 연준 긴축

  - id: kr_link
    title: 미국 지표가 한국 증시로 오는 길
    body: |
      ① 미 금리 ↑ → ② 한미 금리차 확대 → ③ 원화 약세 → ④ 외국인 순매도 압력,
      그리고 ⑤ 미국 소비·제조업 둔화 → 한국 수출 감소 → 수출주 이익 추정 하향.
      **환율 경로(빠름)와 수출 경로(느림)가 따로 움직인다**는 점을 기억하면 헷갈리지 않는다.
    youtube: 미국 금리 원달러 외국인 수급
