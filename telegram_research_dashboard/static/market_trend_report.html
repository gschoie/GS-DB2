var PAGES = {"2026-08-14": "<p class=\"oneliner\">AI 인프라의 자산 가치 부각 속 기업 실적 발표가 이어지고, 글로벌 증시 및 산업 동향에 관심이 집중된 하루.<\/p><p class=\"sub\">창 08-13 06:00~08-14 06:00 KST · 채널 98개 · 글 2289건(중복 접은 뒤 2139건) · Gemini(gemini-2.5-flash)<\/p><div class=\"card theme\"><div class=\"ctitle\">1. AI 인프라 — 자산 가치 및 비용 효율성 <span class=\"badge\">지속<\/span> <span class=\"dots\">●●●●●<\/span><\/div><p class=\"narr\">AI CapEx가 단순 소모 비용이 아닌 장기 수익 창출이 가능한 자산으로 인식되며, 구형 GPU의 가치 유지와 함께 AI 투자에 있어 비용 효율성 및 하이퍼스케일러의 역량이 중요해지고 있다.<\/p><div class=\"kws\"><span class=\"kw\">AI<\/span><span class=\"kw\">분기<\/span><span class=\"kw\">올해<\/span><span class=\"kw\">미국<\/span><span class=\"kw\">종합<\/span><span class=\"kw\">연결<\/span><\/div><ul class=\"ev\"><li><b>[ IT는 SK ]<\/b> — “AI CapEx는 단순 반복 비용이 아닌, 금융 가능한 자산으로 변모하고 있습니다.”<\/li><li><b>메리츠증권 리서치<\/b> — “이제 축적만큼 비용이 중요한 AI - AI가 만든 멋진 신세계 의심 않지만, 올 하반기부터 옥석 가리기와 순환매 속 수익&amp;비용 중요”<\/li><li><b>GS의 조선/기계/방산 「바담」<\/b> — “네이버가 파력 발전 기반 부유식 해상 AI 데이터센터 기술을 개발하는 미국 스타트업 판탈라사(Panthalassa)에 투자함”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">2. 2분기/반기 기업 실적 — 호실적 및 옥석 가리기 <span class=\"badge\">지속<\/span> <span class=\"dots\">●●●●○<\/span><\/div><p class=\"narr\">2분기 및 반기 실적 발표가 활발히 진행되며, 달바글로벌, 자화전자, 아이티센엔텍, 제주반도체 등 다수 기업이 예상치를 상회하는 호실적을 기록했다. 반면 일부 기업은 예상치를 하회하며 개별 기업의 성과에 따른 시장의 옥석 가리기가 심화되고 있다.<\/p><div class=\"kws\"><span class=\"kw\">매출액<\/span><span class=\"kw\">순이익<\/span><span class=\"kw\">영업익<\/span><span class=\"kw\">예상치<\/span><span class=\"kw\">분기<\/span><span class=\"kw\">시가총액<\/span><span class=\"kw\">공시링크<\/span><span class=\"kw\">기간<\/span><span class=\"kw\">연결<\/span><\/div><ul class=\"ev\"><li><b>AWAKE - 실시간 주식 공시 정리채널<\/b> — “기업명: 달바글로벌(시가총액: 3조 3,046억) A483650 보고서명: 연결재무제표기준영업(잠정)실적(공정공시) 매출액 : 1,869억(예상치 : 1,825억+/ 2%) 영업익 : 472억(예상치 : 410억/ +15%) 순이익 : 381억(예상치 : 310억+/ 23%)”<\/li><li><b>여의도스토리 Ver2.0<\/b> — “기업명: 자화전자(시가총액: 6,104억) A033240 매출액 : 2,352억(예상치 : 2,058억, +14.3%) 영업익 : 224억(예상치 : 93억, +141.4%)”<\/li><li><b>간
