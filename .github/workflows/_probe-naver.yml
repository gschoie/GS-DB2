name: (임시) 네이버 수급 페이지 프로브

# market-flow 가 410 으로 죽어 어느 경로가 살아 있는지 러너에서 확인하는 일회용 워크플로.
# 이 브랜치에 push 될 때만 돈다(main 에는 올리지 않는다). 원인 파악이 끝나면 삭제한다.
on:
  push:
    branches: [claude/market-flow-naver-410]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r market_flow/requirements.txt
      - name: 후보 경로 상태 확인
        run: python .github/probe_naver.py
