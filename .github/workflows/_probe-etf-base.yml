name: "[시험용] ETF 구성종목 기준일 경로 확인"

# 신규 front-api 응답 어딘가에 CU 구성종목 '기준일'이 있는지 끝까지 본다.
# 확인이 끝나면 이 파일은 지운다.
on:
  push:
    branches: [claude/telegram-trend-analysis-logic-7efsdy]
    paths: [".github/workflows/_probe-etf-base.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: 탐색
        run: |
          python - <<'PY'
          import json, re
          import requests

          S = requests.Session()
          S.headers.update({"User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) "
                                          "AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148",
                            "Referer": "https://m.stock.naver.com/"})
          F = "https://m.stock.naver.com/front-api"
          DATE = re.compile(r"20\d{2}[-.]?\d{2}[-.]?\d{2}")

          def walk(o, path=""):
              """날짜처럼 생긴 값을 경로와 함께 전부 모은다(구성종목 배열 안은 건너뜀)."""
              if isinstance(o, dict):
                  for k, v in o.items():
                      yield from walk(v, f"{path}.{k}")
              elif isinstance(o, list):
                  if o: yield from walk(o[0], f"{path}[0]")
              elif isinstance(o, (str, int)) and DATE.fullmatch(str(o).strip()):
                  yield path, o

          for code, name in (("445290", "KODEX 로봇액티브"), ("385720", "TIME 코스피액티브")):
              print("\n" + "=" * 70); print(code, name); print("=" * 70)
              for path, params in (("/stock/domestic/etf/component/list", {"code": code, "pageSize": 100}),
                                   ("/stock/domestic/etf/analysis", {"code": code}),
                                   ("/stock/domestic/integration", {"code": code, "endType": "etf"}),
                                   ("/stock/domestic/basic", {"code": code, "endType": "etf"})):
                  try:
                      r = S.get(F + path, params=params, timeout=20)
                      j = r.json()
                  except Exception as e:
                      print(f"  {path} 실패 {e}"); continue
                  res = j.get("result", j)
                  keys = list(res) if isinstance(res, dict) else f"<list {len(res)}>"
                  print(f"\n  [{r.status_code}] {path}\n    result 키: {keys}")
                  for p, v in walk(res):
                      print(f"      날짜값 {p} = {v}")
                  if path.endswith("component/list") and isinstance(res, dict):
                      it = (res.get("items") or [{}])[0]
                      print("    items[0] 키:", list(it))
                      print("    totalCount:", res.get("totalCount"), "· hasNext:", res.get("hasNext"))
          PY
