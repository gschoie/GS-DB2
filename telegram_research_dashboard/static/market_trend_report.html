var PAGES = {"2026-09-28": "<p class=\"oneliner\">미국 자동차 연비 규제 완화, 중동 정세에 따른 유가 및 해운 시장 변동성, 그리고 AI/반도체 섹터의 확장세가 시장의 주요 관심사로 부상하고 있다.<\/p><p class=\"sub\">창 09-27 06:00~09-28 06:00 KST · 채널 47개 · 글 345건(중복 접은 뒤 323건) · Gemini(gemini-2.5-flash)<\/p><div class=\"card theme\"><div class=\"ctitle\">1. 미국 자동차 연비 규제 완화 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●○○<\/span><\/div><p class=\"narr\">미국 교통부가 2031년까지 적용될 자동차 연비 기준을 대폭 완화하고, 트럼프 대통령이 바이든 행정부의 전기차 정책 종료를 언급하며 자동차 산업의 규제 비용 감소 및 에너지 정책 변화에 대한 기대감이 형성되고 있다.<\/p><div class=\"kws\"><span class=\"kw\">연비<\/span><span class=\"kw\">트럼프<\/span><span class=\"kw\">전기차 관련 정책 종료<\/span><span class=\"kw\">규제 완화<\/span><\/div><ul class=\"ev\"><li><b>서화백의 AI놀이🚀<\/b> — “📝 미국 교통부가 2031년까지 적용되는 자동차 연비 기준을 대폭 완화하는 ...”<\/li><li><b>미국 주식 인사이더 🇺🇸 (US Stocks Insider)<\/b> — “• 트럼프 대통령은 새로운 자동차 연비 기준을 승인하고 바이든 행정부의 전기차 관련 정책을 종료한다고 발표.”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">2. 미국 거시경제 지표 발표 임박 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●●○<\/span><\/div><p class=\"narr\">이번 주 미국 8월 PCE 물가지수, 9월 비농업 고용보고서, 9월 제조업 ISM 등 주요 경제지표 발표가 예정되어 있어, 연준의 금리 인상 경로와 인플레이션 및 고용 시장의 건전성을 가늠할 중요한 시험대가 될 것으로 보인다.<\/p><div class=\"kws\"><span class=\"kw\">물가지수<\/span><span class=\"kw\">PCE 물가지수<\/span><span class=\"kw\">근원 PCE<\/span><span class=\"kw\">ISM<\/span><span class=\"kw\">고용보고서<\/span><span class=\"kw\">경제지표<\/span><\/div><ul class=\"ev\"><li><b>서화백의 AI놀이🚀<\/b> — “• 미국 8월 PCE 물가지수는 헤드라인 및 근원 모두 7월과 동일하게 각각 +3.7%, +3.3%를 유지할 것으로 예상됩니다.”<\/li><li><b>하나 중국/신흥국 전략 김경환<\/b> — “•미국 경제지표: 9월 30일 미국 8월 PCE 물가지수가 발표, 10월 2일에는 9월 비농업 고용보고서가 발표. 시장은 이를 통해 연준의 10월 금리인상 경로를 확인할 전망.”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">3. 중동 정세, 유가 및 해운 시장 변동성 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●●●<\/span><\/div><p class=\"narr\">미국-이란 간 호르무즈 해협 단계적 재개방 협상 보도로 유가가 급락하며 비용 절감 기대감이 확산되는 한편, 이란 사태 및 호르무즈 해협 봉쇄 여파로 희망봉 우회 항로가 늘고 파나마 운하 혼잡이 겹쳐 VLGC 운임이 급등하는 등 해운 시장에 복합적인 영향이 나타나고 있다.<\/p><div class=\"kws\"><span class=\"kw\">호르무즈 협상<\/span><span class=\"kw\">이란<\/span><span class=\"kw\">유가 하락<\/span><span class=\"kw\">비용 절감<\/span><span class=\"kw\">운하<\/span><span class=\"kw\">VLCC<\/span><span class=\"kw\">조선<\/span><\/div><ul class=\"ev\"><li><b>한투증권 미국/중국전략 정정영<\/b> — “트럼프 대통령: 이란 전쟁은 곧 끝날 것이고 유가는 하락할 것. 어젯밤 미국은 호르무즈 해협에서 기록적인 규모의 석유 통과시킴”<\/li><li><b>김현석(자본주의 바이어스 있는 채널입니다)<\/b> — “-미·이란 호르무즈 해협 단계적 재개방 협상 보도(로이터)로 장 후반 낙폭 축소. 브렌트유 107달러 부근 마감.”<\/li><li><b>GS의 조선/기계/방산 「바담」<\/b> — “[호르무즈 봉쇄에 가스선 운임↑…한국 조선 수주 전망은 &#x27;맑음&#x27;] • 이란 사태 및 호르무즈 해협 봉쇄 여파로 희망봉 우회 항로가 늘며 VLGC 하루 운임이 18만9천711달러로 전주 대비 17% 급등함”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">4. 소비자 지출 및 소매 기업 실적 전망 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●○○<\/span><\/div><p class=\"narr\">나이키(NKE)와 카니발(CCL) 등 주요 소비재 기업들의 실적 발표를 앞두고 소비 심리와 지출 추이에 대한 관심이 높아지고 있다. 부정적인 거시경제 상황과 연료비 상승 우려 속에서도 일부 기업은 예상보다 견조한 예약 및 유가 하락에 따른 안도 랠리 가능성도 제기된다.<\/p><div class=\"kws\"><span class=\"kw\">나이키<\/span><span class=\"kw\">CCL<\/span><span class=\"kw\">소비자 지출<\/span><span class=\"kw\">기업 실적<\/span><span class=\"kw\">소비 심리<\/span><\/div><ul class=\"ev\"><li><b>서화백의 AI놀이🚀<\/b> — “• Nike(NKE): 나이키에 대한 기대치가 워낙 낮기 때문에, 실적이 예상보다 나쁘지 않다면 안도 랠리를 보일 가능성이 있습니다.”<\/li><li><b>서화백의 AI놀이🚀<\/b> — “CCL (카니발): 9월 29일 화요일 개장 전 FQ3 실적을 발표합니다. 연료비 상승과 소비 수요 위축에 대한 우려로 주가가 부진했지만, 예약은 예상보다 견조하고 유가도 최악의 수준에서 내려왔다는 전망이 있습니다.”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">5. AI 및 반도체 섹터 확장세 <span class=\"badge\">지속<\/span> <span class=\"dots\">●●●●●<\/span><\/div><p class=\"narr\">AI 투자 사이클이 GPU·HBM 중심에서 AI 에이전트, CPU, DRAM 등으로 확장되며 반도체 업황에 대한 긍정적 전망이 우세하다. 삼성전자와 SK하이닉스가 HBM 공급 본격화로 AI 거래의 시험대에 오르고 LG전자가 엔비디아의 AI 데이터센터 냉각 파트너로 선정되는 등 AI 관련 기대감이 고조되지만, 마이크론(MU)과 팩트셋(FDS)은 새로운 공급 증가 및 AI 도구에 의한 플랫폼 대체 위협 등 불확실성도 존재한다.<\/p><div class=\"kws\"><span class=\"kw\">AI<\/span><span class=\"kw\">반도체<\/span><span class=\"kw\">MU<\/span><span class=\
