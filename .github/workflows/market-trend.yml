name: 시장관심 내러티브

# 구독한 텔레그램 전 채널의 하루치(전일 06:00~당일 06:00 KST)를 훑어 급증 키워드를
# 계량으로 뽑고, Gemini 1회 호출로 시장 테마·내러티브 리포트를 만든다.
# 산출물(static/market_trend/)과 기준선 이력(state/trend_history.json)을 커밋한다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: run
        # check = 수집·계량 통계만(토큰·저장 없음), no-llm = Gemini 없이 신호만 저장
        options: [run, check, no-llm, dry-run]
  schedule:
    - cron: "30 21 * * *"   # 매일 KST 06:30

permissions:
  contents: write

# 이력 커밋이 겹치지 않게 한 번에 하나만. 대기 취소는 하지 않는다(실행 유실 방지).
concurrency:
  group: market-trend
  cancel-in-progress: false

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r market_trend/requirements.txt

      - name: 계량 로직 테스트
        working-directory: market_trend
        run: python -m unittest discover -s tests -p "test_*.py"

      # 소스 감시 봇과 같은 계정 세션을 쓴다('텔레그램 계정 로그인' 워크플로가 만든 암호문).
      - name: 계정 세션 복호화
        env:
          SESSION_PASSPHRASE: ${{ secrets.SESSION_PASSPHRASE }}
        run: |
          if [ -f source_watcher/state/session.enc ] && [ -n "$SESSION_PASSPHRASE" ]; then
            VALUE=$(openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -d \
              -in source_watcher/state/session.enc -pass env:SESSION_PASSPHRASE)
            echo "::add-mask::$VALUE"
            echo "TELEGRAM_SESSION_STRING=$VALUE" >> "$GITHUB_ENV"
          else
            echo "세션 없음 — 먼저 '텔레그램 계정 로그인' 워크플로를 실행하세요" >&2
            exit 1
          fi

      - name: 트렌드 산출
        working-directory: market_trend
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          MODE: ${{ inputs.mode || 'run' }}
        run: |
          FLAGS=""
          case "$MODE" in
            check)   FLAGS="--check" ;;
            no-llm)  FLAGS="--no-llm" ;;
            dry-run) FLAGS="--dry-run" ;;
          esac
          python trend_daily.py $FLAGS

      # 리포트와 기준선 이력을 함께 커밋한다. 이력이 쌓여야 '평소 대비 배수'가 나온다.
      - name: 산출물 커밋 및 푸시
        if: ${{ success() && !contains(fromJSON('["check","dry-run"]'), inputs.mode || 'run') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/market_trend market_trend/state/trend_history.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "시장관심.내러티브 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "push 실패" >&2
          exit 1
