name: 휴가 일정 추적

# config.yml에 지정한 친구들과의 텔레그램 1:1 대화를 내 계정 세션으로 훑어
# 휴가 보고를 잡아 정리한다. 세션은 source_watcher와 같은 것(state/session.enc)을 쓴다.
# 산출물: vacation_tracker/state/*.json(누적 DB) + static/vacation_report.html(대시보드).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: run
        # probe = 친구 이름이 실제 대화로 매칭되는지 확인(메시지 안 읽음)
        # dry-run = 수집·추출까지만, 상태·페이지·발송 없음
        # add = 대시보드 기입 폼에서 온 항목 1건 추가 (entry 입력 필요)
        options: [run, dry-run, probe, rebuild-page, add, indepth-backfill]
      entry:
        description: '직접 기입 JSON {"name","start","end","kind","note"} — mode=add 전용'
        type: string
        required: false
        default: ""
  schedule:
    # KST 08:30 · 18:30 (UTC 23:30 전일 · 09:30). 하루 2회면 충분 — 휴가 보고는 드문 이벤트다.
    - cron: "30 23,9 * * *"

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: vacation_tracker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 규칙 파서 테스트
        working-directory: vacation_tracker
        run: python -m unittest discover -s tests -p "test_*.py"

      # '텔레그램 계정 로그인' 워크플로가 만든 암호문을 푼다 — source_watcher와 공유.
      - name: 계정 세션 복호화
        env:
          SESSION_PASSPHRASE: ${{ secrets.SESSION_PASSPHRASE }}
        run: |
          if [ -f source_watcher/state/session.enc ] && [ -n "$SESSION_PASSPHRASE" ]; then
            VALUE=$(openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -d \
              -in source_watcher/state/session.enc -pass env:SESSION_PASSPHRASE)
            echo "::add-mask::$VALUE"
            echo "TELEGRAM_SESSION_STRING=$VALUE" >> "$GITHUB_ENV"
          elif [ "${{ inputs.mode }}" = "add" ] || [ "${{ inputs.mode }}" = "rebuild-page" ]; then
            echo "세션 불필요 모드 — 복호화 생략"
          else
            echo "세션 없음 — 먼저 '텔레그램 계정 로그인' 워크플로를 실행하세요" >&2
            exit 1
          fi

      - name: 휴가 추적 실행
        working-directory: vacation_tracker
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 알림 봇: 전용 시크릿이 없으면 소스 감시와 같은 봇으로 보낸다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.VACATION_TELEGRAM_BOT_TOKEN || secrets.WATCH_TELEGRAM_BOT_TOKEN || secrets.KDEF_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.VACATION_TELEGRAM_CHAT_ID || secrets.WATCH_TELEGRAM_CHAT_ID || secrets.KDEF_TELEGRAM_CHAT_ID }}
          # 발간계획(인뎁스) 신규 건은 매크로봇(매크로_공부 방)으로 — 미설정 시 위 봇 폴백.
          IDX_TELEGRAM_BOT_TOKEN: ${{ secrets.CONGPT_TELEGRAM_BOT_TOKEN }}
          IDX_TELEGRAM_CHAT_ID: ${{ secrets.CONGPT_TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'run' }}
          # 근태는 수동 수집 전용 — 페이지 🔄 버튼(workflow_dispatch)일 때만 켠다.
          # 크론(schedule) 자동 run은 휴가·발간계획만 보고 근태는 건드리지 않는다.
          ATT_SCAN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          # 셸을 거치지 않고 환경변수로 — 메모에 따옴표가 들어와도 안전하다.
          ENTRY: ${{ inputs.entry }}
        run: |
          case "$MODE" in
            probe)        python vacation_bot.py --probe ;;
            dry-run)      python vacation_bot.py --dry-run ;;
            rebuild-page) python vacation_bot.py --rebuild-page ;;
            add)          python vacation_bot.py --add "$ENTRY" ;;
            indepth-backfill) python vacation_bot.py --indepth-backfill ;;
            *)            python vacation_bot.py ;;
          esac

      # 상태 커밋은 발송까지 끝난 뒤에만 — 실패한 run이 last_id를 올리면 그 보고는 영영 안 잡힌다.
      - name: 상태·페이지 커밋
        if: ${{ success() && !contains(fromJSON('["probe","dry-run"]'), inputs.mode || 'run') }}
        env:
          MODE: ${{ inputs.mode || 'run' }}
          ENTRY: ${{ inputs.entry }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          commit_all() {
            git add vacation_tracker/state telegram_research_dashboard/static/vacation_report.html \
              telegram_research_dashboard/static/attendance_report.html \
              telegram_research_dashboard/static/indepth_report.html
            if git diff --cached --quiet; then
              echo "변경 없음 — 커밋 생략"
              return 1
            fi
            git commit -m "chore(vacation): 휴가 일정 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          }
          commit_all || exit 0
          # push 재시도: run이 겹치면 내 커밋은 낡은 base 위의 것이다. 예전 방식
          # (pull --rebase -X theirs)은 JSON을 줄 병합해 그 사이 main에 실린 다른
          # run의 op를 덮어썼다(10/6 근태 수동 체크 유실). 이제는 '일을 다시 한다':
          # 내 산출을 떼어 두고 최신 main으로 reset한 뒤 — add 모드는 op를 재적용,
          # run 모드는 reconcile_state.py로 키 단위 병합 — 새로 커밋해 다시 민다.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            OURS=$(mktemp -d)
            cp vacation_tracker/state/*.json "$OURS"/ 2>/dev/null || true
            if ! git fetch origin main; then sleep 5; continue; fi
            git reset --hard origin/main
            if [ "$MODE" = "add" ]; then
              (cd vacation_tracker && python vacation_bot.py --add "$ENTRY")
            else
              (cd vacation_tracker && python reconcile_state.py "$OURS")
            fi
            (cd vacation_tracker && python vacation_bot.py --rebuild-page)
            commit_all || exit 0
            sleep 3
          done
          echo "push 실패" >&2
          exit 1
