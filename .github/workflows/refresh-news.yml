name: 뉴스 아카이브만 갱신

# 뉴스.아카이브만 다시 수집·반영하는 경량 워크플로.
# 전체 파이프라인(deploy-pages)과 달리 DAOL 톤·매크로·노조 재수집은 건너뛴다.
# (build_static 은 톤/매크로/노조를 '있으면 읽고 없으면 기본값'으로 처리하므로 안전)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이전 수집 데이터 복원
        uses: actions/cache@v4
        with:
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_messages.json
            telegram_research_dashboard/data/daol_tone_history.json
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/hhiun_snapshot.json
            telegram_research_dashboard/data/macro.json
          key: dashboard-db-${{ github.run_id }}
          restore-keys: |
            dashboard-db-

      - name: 파이프라인 계약 테스트
        working-directory: telegram_research_dashboard
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Python 패키지 준비
        run: python -m pip install requests beautifulsoup4 lxml

      - name: 공개 텔레그램 최신 글 수집 (뉴스)
        working-directory: telegram_research_dashboard
        # 날짜 기반 증분 수집(2주 안전창). 최근 2주만 재확인 → 전체 이력 크롤 안 함.
        run: python public_importer.py --channel https://t.me/HI_GS --pages 120 --since-days 14

      - name: 저장 원문 전체 재분류
        working-directory: telegram_research_dashboard
        run: python rebuild_parsed_data.py

      - name: 링크 기사 제목 및 기업 보강
        working-directory: telegram_research_dashboard
        run: python enrich_link_news.py --limit 5000 --all

      - name: 내 코멘트 backfill 및 기사 제목 정리
        working-directory: telegram_research_dashboard
        run: python backfill_comments.py

      - name: 수동 기업 교정 적용
        working-directory: telegram_research_dashboard
        run: python apply_corrections.py

      - name: 배포용 HTML 생성 (뉴스만 갱신 · 톤/매크로는 기존 데이터 유지)
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
        run: python build_static.py

      - name: 배포 안전망 검사
        working-directory: telegram_research_dashboard
        run: python verify_static_output.py _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: telegram_research_dashboard/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
