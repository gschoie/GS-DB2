name: 소스 감시 봇

# sources.yml에 등록된 블로그·텔레그램 채널을 주기적으로 훑어 새 글만 텔레그램으로 쏜다.
# 무엇을 이미 보냈는지는 source_watcher/state/seen.json이 기억한다 — 러너는 매번
# 새 컨테이너라 이 파일을 커밋해 두지 않으면 같은 글이 반복 발송된다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: run
        # test = 발송 경로 점검. 최신 글 1건을 상태 변경 없이 보낸다.
        options: [run, check, dry-run, seed, test]
      only:
        description: "특정 소스 key만 (비우면 전체)"
        default: ""
  schedule:
    # 장 전후(KST 07:00~15:45)는 15분 간격. (UTC 22~23시 + 0~6시)
    - cron: "*/15 22,23,0-6 * * *"
    # 그 외 정시: KST 16시, 저녁 18~23시 매시, 아침 6시. (UTC 7시, 9~14시, 21시)
    - cron: "0 7,9-14,21 * * *"

permissions:
  contents: write

# 앞 실행이 상태를 커밋하는 중에 다음 실행이 겹치면 같은 글이 두 번 나간다.
concurrency:
  group: source-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: source_watcher
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 계약 테스트
        working-directory: source_watcher
        run: python -m unittest discover -s tests -p "test_*.py"

      # 조선 감시(ship_all)가 쓰는 계정 세션. '텔레그램 계정 로그인' 워크플로가 만든
      # 암호문(state/session.enc)을 풀어 환경변수로 넘긴다. 아직 로그인 전이면 조용히
      # 건너뛰고 ship_all만 수집 실패로 남는다(다른 소스는 정상 동작).
      - name: 계정 세션 복호화
        env:
          SESSION_PASSPHRASE: ${{ secrets.SESSION_PASSPHRASE }}
        run: |
          if [ -f source_watcher/state/session.enc ] && [ -n "$SESSION_PASSPHRASE" ]; then
            VALUE=$(openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -d \
              -in source_watcher/state/session.enc -pass env:SESSION_PASSPHRASE)
            echo "::add-mask::$VALUE"
            echo "TELEGRAM_SESSION_STRING=$VALUE" >> "$GITHUB_ENV"
          else
            echo "세션 없음 — telegram_account 소스는 건너뜁니다"
          fi

      - name: 소스 감시 실행
        working-directory: source_watcher
        env:
          # 방산 브리핑과 같은 봇을 쓰려면 WATCH_* 시크릿을 비워두면 된다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.WATCH_TELEGRAM_BOT_TOKEN || secrets.KDEF_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.WATCH_TELEGRAM_CHAT_ID || secrets.KDEF_TELEGRAM_CHAT_ID }}
          # 조선 코멘트(route: spying)는 염탐봇으로 갈라 보낸다.
          # SPYING_* 시크릿이 비어 있으면 옛 이름(SHIP_*)으로 폴백한다.
          SPYING_TELEGRAM_BOT_TOKEN: ${{ secrets.SPYING_TELEGRAM_BOT_TOKEN || secrets.SHIP_TELEGRAM_BOT_TOKEN }}
          SPYING_TELEGRAM_CHAT_ID: ${{ secrets.SPYING_TELEGRAM_CHAT_ID || secrets.SHIP_TELEGRAM_CHAT_ID }}
          # telegram_account 소스(내 계정으로 전 채널 훑기)용.
          # TELEGRAM_SESSION_STRING은 위 복호화 단계가 GITHUB_ENV로 넘긴다.
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          MODE: ${{ inputs.mode || 'run' }}
          ONLY: ${{ inputs.only }}
        run: |
          FLAGS=""
          case "$MODE" in
            check)   FLAGS="--check" ;;
            dry-run) FLAGS="--dry-run" ;;
            seed)    FLAGS="--seed" ;;
            test)    FLAGS="--test" ;;
          esac
          if [ -n "$ONLY" ]; then FLAGS="$FLAGS --only $ONLY"; fi
          python watch_sources.py $FLAGS

      # 상태 커밋은 발송이 끝난 뒤에만 한다(발송 실패 시 커밋하면 그 글은 영영 안 온다).
      - name: 상태 커밋 및 푸시
        if: ${{ success() && !contains(fromJSON('["check","dry-run","test"]'), inputs.mode || 'run') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source_watcher/state/seen.json
          if git diff --cached --quiet; then
            echo "새 글 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(watch): 소스 감시 상태 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          # 실행 중 main이 앞서가면 rebase 후 재시도 (최대 5회)
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "push 실패" >&2
          exit 1
