name: 노조게시판만 갱신

# 현중 노조게시판(hhiun)만 다시 수집·반영하는 경량 워크플로.
# 뉴스/톤/매크로 재수집은 건너뛰고 build_hhiun_report + build_static만 돌린다.
on:
  workflow_dispatch:
  schedule:
    # 하루 2회 노조게시판 수집 — KST 09:20, 21:20 (UTC 00:20, 12:20)
    - cron: "20 0,12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # 뉴스DB는 읽기전용 복원(노조 run이 뉴스 캐시를 덮지 않게 → 리버트 방지).
      - name: 뉴스DB 캐시 복원(읽기전용)
        uses: actions/cache/restore@v5
        with:
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/macro.json
          key: newsdb2-${{ github.run_id }}
          # newsdb2-: 2026-07-30 캐시 오염 사고 후 새 네임스페이스. path 목록이 버전 해시라
          # 5개 워크플로 모두 동일해야 함(다르면 조용한 복원 미스).
          restore-keys: |
            newsdb2-

      - name: 노조 캐시 복원
        uses: actions/cache/restore@v5
        with:
          path: |
            telegram_research_dashboard/data/hhiun_snapshot.json
            telegram_research_dashboard/data/hhiun_top.json
            telegram_research_dashboard/static/hhiun_board_report.html
          key: hhiun-${{ github.run_id }}
          restore-keys: |
            hhiun-

      - name: 파이프라인 계약 테스트
        working-directory: telegram_research_dashboard
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Python 패키지 준비
        run: python -m pip install requests beautifulsoup4 lxml pycryptodome

      - name: 현중 노조게시판 수집
        working-directory: telegram_research_dashboard
        run: python build_hhiun_report.py

      - name: 배포용 HTML 생성 (노조만 갱신 · 뉴스/톤은 기존 데이터 유지)
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
          # 배포본 안전망 fetch가 Access 로그인 벽을 통과하기 위한 서비스 토큰(선택)
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python build_static.py

      - name: 배포 안전망 검사
        working-directory: telegram_research_dashboard
        run: python verify_static_output.py _site/index.html

      - name: 노조 캐시 저장
        uses: actions/cache/save@v5
        with:
          path: |
            telegram_research_dashboard/data/hhiun_snapshot.json
            telegram_research_dashboard/data/hhiun_top.json
            telegram_research_dashboard/static/hhiun_board_report.html
          key: hhiun-${{ github.run_id }}

      - uses: actions/configure-pages@v6
        with:
          # 8/18 Unpublish로 사이트가 꺼져 있으면 자동으로 다시 켠다
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: telegram_research_dashboard/_site

      # 공유용 주소(https://gs-research-desk.github.io)에도 같은 산출물을 올린다 — GitHub 조직
      # `gs-research-desk` 의 Pages 리포(gs-research-desk/gs-research-desk.github.io) main 에 _site 를
      # 통째로 push(매번 orphan 커밋이라 이력이 안 쌓인다). 대시보드의 '새 창으로'·사이드바 새 탭
      # 링크·공유 허브(invest.html)가 전부 이 주소로 열려, 화면 공유 때 주소창에
      # gschoie.github.io/GS-DB2 와 사이드바가 보이지 않는다.
      # 시크릿 SHARE_DEPLOY_TOKEN(그 리포 Contents 쓰기 권한 PAT)이 없거나 실패해도
      # 본 GitHub Pages 배포는 그대로 간다(continue-on-error).
      # secrets 컨텍스트는 step `if` 에서 못 쓴다(워크플로 파일 자체가 거부돼 잡 0개로 실패 —
      # 10/19 실측) → 셸 스텝이 유무를 출력으로 바꿔 넘긴다.
      - name: 공유용 주소 토큰 확인
        id: share
        env:
          SHARE_DEPLOY_TOKEN: ${{ secrets.SHARE_DEPLOY_TOKEN }}
        run: |
          if [ -n "$SHARE_DEPLOY_TOKEN" ]; then echo "on=1" >> "$GITHUB_OUTPUT"
          else echo "on=0" >> "$GITHUB_OUTPUT"; echo "::warning::SHARE_DEPLOY_TOKEN 시크릿 없음 — 공유용 주소 배포 생략"; fi
      - name: 공유용 주소 배포 (gs-research-desk.github.io)
        if: steps.share.outputs.on == '1'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SHARE_DEPLOY_TOKEN }}
          external_repository: gs-research-desk/gs-research-desk.github.io
          publish_branch: main
          publish_dir: telegram_research_dashboard/_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
