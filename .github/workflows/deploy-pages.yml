name: 대시보드 업데이트 및 배포

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    # 매일 한국시간 오전 8시 30분
    - cron: "30 23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이전 수집 데이터 복원
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_messages.json
            telegram_research_dashboard/data/daol_tone_history.json
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/hhiun_snapshot.json
          key: dashboard-db-${{ github.run_id }}
          restore-keys: |
            dashboard-db-

      - name: 파이프라인 계약 테스트
        working-directory: telegram_research_dashboard
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Python 패키지 준비
        if: github.event_name != 'push'
        run: python -m pip install requests beautifulsoup4 lxml pycryptodome pypdf telethon

      - name: 공개 텔레그램 최신 글 수집
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        shell: bash
        run: |
          if [ -f data/dashboard.db ]; then PAGES=5; else PAGES=0; fi
          python public_importer.py --channel https://t.me/HI_GS --pages "$PAGES"

      - name: DAOL 톤 데이터 갱신
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        run: |
          python build_daol_tone_dashboard.py --refresh

      - name: 저장 원문 전체 재분류
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        run: python rebuild_parsed_data.py

      - name: 링크 기사 제목 및 기업 보강
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        run: python enrich_link_news.py --limit 5000 --all

      - name: 내 코멘트 backfill 및 기사 제목 정리
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        run: python backfill_comments.py

      - name: 수동 기업 교정 적용
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        run: python apply_corrections.py

      - name: 매크로 데이터 수집 (글로벌경제 · 핵심요약)
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        run: python fetch_macro.py

      - name: 배포용 HTML 생성
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
        run: |
          python build_hhiun_report.py
          python build_static.py

      - name: 검증된 완성본 준비
        if: github.event_name == 'push'
        working-directory: telegram_research_dashboard
        run: |
          mkdir -p _site
          cp prebuilt/index.html _site/index.html
          if [ -f static/hhiun_board_report.html ]; then
            cp static/hhiun_board_report.html _site/hhiun_board_report.html
          fi
          if [ -f static/etf_signal_report.html ]; then
            cp static/etf_signal_report.html _site/etf_signal_report.html
          fi
          if [ -f static/consensus_revision.html ]; then
            cp static/consensus_revision.html _site/consensus_revision.html
          fi

      - name: 배포 안전망 검사
        working-directory: telegram_research_dashboard
        run: |
          # push는 커밋된 완성본(prebuilt)을 쓰고, 스케줄·수동실행은 갓 빌드한 _site를 그대로 배포한다.
          if [ "${{ github.event_name }}" = "push" ] && [ -f prebuilt/index.html ]; then
            cp prebuilt/index.html _site/index.html
          fi
          python verify_static_output.py _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: telegram_research_dashboard/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
