  kr_trade:
    name: 한국 수출입 (관세청 잠정)
    agency: 관세청 / 산업통상자원부
    freq: 매월 1일 (전월 확정) · 매월 1·11·21일 (10일간 잠정)
    what: |
      **한국에서 가장 빨리 나오는 실물 지표.** 전월 수출이 1일 아침에 나온다.
      반도체·자동차·선박 등 품목별, 미국·중국 등 지역별로 쪼개 보는 게 핵심이다.
    watch: 수출 전년비, 일평균 수출(조업일수 보정), 반도체 수출, 대중국 수출
    read:
