name: (임시) 리서치요약 본문 형식 프로브

# 낱개 요약 글의 종류 분포(상향/하향/유지/신규/기타)를 세는 일회용 프로브.
on:
  push:
    branches: [claude/telegram-shipbuilding-alerts-xznnl4]
    paths: [.github/workflows/_probe-body.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: telethon 설치
        run: pip -q install telethon

      - name: 계정 세션 복호화
        env:
          SESSION_PASSPHRASE: ${{ secrets.SESSION_PASSPHRASE }}
        run: |
          VALUE=$(openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -d \
            -in source_watcher/state/session.enc -pass env:SESSION_PASSPHRASE)
          echo "::add-mask::$VALUE"
          echo "TELEGRAM_SESSION_STRING=$VALUE" >> "$GITHUB_ENV"

      - name: 요약 글 종류 분포
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python - <<'PY'
          import asyncio, os, sys
          from collections import Counter
          sys.path.insert(0, "source_watcher")
          from adapters import DEVICE_INFO, _account_session

          async def main():
              from telethon import TelegramClient
              client = TelegramClient(_account_session(),
                                      int(os.environ["TELEGRAM_API_ID"]),
                                      os.environ["TELEGRAM_API_HASH"], **DEVICE_INFO)
              await client.connect()
              try:
                  entity = await client.get_entity("ked_epic_ai")
                  kinds = Counter()
                  etc = []
                  total = 0
                  async for m in client.iter_messages(entity, limit=600):
                      text = (m.message or "").strip()
                      first = text.splitlines()[0] if text else ""
                      if "리서치 요약" not in first:
                          continue
                      total += 1
                      kind = next((k for k in ("목표주가 상향", "목표주가 하향", "목표주가 유지",
                                               "신규", "목표주가 상장") if k in first), None)
                      kinds[kind or "기타"] += 1
                      if kind is None and len(etc) < 8:
                          etc.append(first[:80])
                  print(f"최근 600개 메시지 중 낱개 요약 {total}건")
                  for k, v in kinds.most_common():
                      print(f"  {k}: {v}건")
                  for line in etc:
                      print(f"  기타 예: {line}")
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY
