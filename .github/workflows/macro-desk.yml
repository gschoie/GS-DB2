name: 매크로 데스크

# 매일 저녁 9시(KST) 금리·환율·원자재를 수집해 매크로 데스크 페이지를 굽는다.
# 정시성은 GAS 시계(gas/dispatch_proxy.gs SCHEDULE)가 담당하고, 아래 크론은 안전망이다
# — 무료 러너 크론은 몇 시간씩 밀린다(CLAUDE.md 17번).
on:
  workflow_dispatch:
    inputs:
      via:
        description: "호출 주체 — scheduler면 GAS 시계가 쏜 것"
        default: ""
      # 평소엔 정시 실행만 텔레그램을 보낸다(아래 발송 스텝 조건). 이 체크를 켜면
      # 수동 실행으로도 한 통 받아볼 수 있고, 주말 스킵도 넘긴다 — 테스트용.
      force_telegram:
        description: "텔레그램 지금 한 통 보내기 (주말에도)"
        type: boolean
        default: false
  schedule:
    - cron: "0 12 * * *"    # 12:00 UTC = 21:00 KST

permissions:
  contents: write

concurrency:
  group: macro-desk
  cancel-in-progress: false

jobs:
  # 24번 교훈: 가드는 "다른 경로가 했나"가 아니라 "이 일이 이미 됐나"를 묻는다.
  # 이벤트를 가리지 않고 창 안의 성공·진행중 run을 세되 자기 자신만 뺀다. fail-open.
  guard:
    runs-on: ubuntu-latest
    permissions: {actions: read}
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 최근 실행 확인
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-600 minutes' +%Y-%m-%dT%H:%M)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/macro-desk.yml/runs?created=%3E${since}" \
                --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) \
                       | select(.conclusion==\"success\" or .status==\"in_progress\" or .status==\"queued\")] | length" || echo 0)
          echo "최근 600분 내 선행 실행 ${n:-0}건"
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::이미 실행됐습니다 — 이 예약 실행은 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: guard
    if: ${{ always() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: macro_desk
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # discover 를 쓰지 않는 이유: tests/ 에는 러너 탐색용 probe_*.py 도 있고
      # test_releases.py 는 unittest 가 아니라 스크립트다. 둘을 따로 돌린다.
      - name: 테스트 — 발표일 계산 · 직전치 변환
        working-directory: macro_desk
        run: |
          python tests/test_calendar.py
          python tests/test_releases.py
          python tests/test_notify.py
          python tests/test_chart.py

      - name: 시세 수집
        working-directory: macro_desk
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python collect.py

      - name: 리포트 생성
        working-directory: macro_desk
        run: python build_report.py

      - name: 커밋 및 푸시 (→ Pages 재배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/macro_desk \
                  telegram_research_dashboard/static/macro_desk_report.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(macro): 매크로 데스크 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # 정시 실행(GAS 시계 via=scheduler, 또는 크론 안전망)에만 보낸다 —
      # 화면 '🔄 지표 갱신' 버튼은 dispatch 이지만 via 가 없으므로 발송에서 빠진다
      # (30번 교훈: 디스패치를 한 묶음으로 보면 수동 갱신이 텔레그램을 쏜다).
      # force_telegram 체크는 그 조건을 수동으로 넘기는 테스트 경로다.
      # 한 줄 생성 실패는 notify.py 안에서 처리한다. 발송 실패가 수집·배포를
      # 되돌리지는 않으므로 커밋 뒤에 둔다.
      - name: 텔레그램 발송
        if: ${{ github.event_name == 'schedule' || inputs.via == 'scheduler' || inputs.force_telegram }}
        working-directory: macro_desk
        env:
          MACRO_TELEGRAM_BOT_TOKEN: ${{ secrets.MACRO_TELEGRAM_BOT_TOKEN }}
          MACRO_TELEGRAM_CHAT_ID: ${{ secrets.MACRO_TELEGRAM_CHAT_ID }}
          CONGPT_TELEGRAM_BOT_TOKEN: ${{ secrets.CONGPT_TELEGRAM_BOT_TOKEN }}
          CONGPT_TELEGRAM_CHAT_ID: ${{ secrets.CONGPT_TELEGRAM_CHAT_ID }}
          MACRO_GEMINI_API_KEY: ${{ secrets.MACRO_GEMINI_API_KEY }}
          CONSTRUCTION_GEMINI_API_KEY: ${{ secrets.CONSTRUCTION_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # --force 는 주말 스킵만 넘긴다(평일엔 있으나 없으나 같다)
        run: python notify.py ${{ inputs.force_telegram && '--force' || '' }}
