name: "[시험용] K200 선물 시세 경로 확인"

# 베이시스 소급용 — KOSPI200 지수 '일별 종가' 경로를 확인한다.
# 확인이 끝나면 이 파일은 지운다.
on:
  push:
    branches: [claude/telegram-trend-analysis-logic-7efsdy]
    paths: [".github/workflows/_probe-futures-price.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: 탐색
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python - <<'PY'
          import os
          import requests

          S = requests.Session(); S.headers.update({"User-Agent": "Mozilla/5.0"})

          def show(label, r, cut=1200):
              print(f"\n[{label}] {r.status_code}")
              print("   ", r.text[:cut].replace("\n", " "))

          # A) 네이버 신규 front-api 지수 일별 시세
          F = "https://m.stock.naver.com/front-api"
          for p in ({"code": "KPI200", "page": 1, "pageSize": 30},
                    {"code": "KPI200", "pageSize": 30},
                    {"code": "KOSPI", "page": 1, "pageSize": 5}):
              show(f"naver index/price/list {p}",
                   S.get(F + "/stock/domestic/index/price/list", params=p, timeout=20))

          # B) 한투 지수 일봉
          BASE = "https://openapi.koreainvestment.com:9443"
          key, sec = os.environ["KIS_APP_KEY"], os.environ["KIS_APP_SECRET"]
          tok = S.post(f"{BASE}/oauth2/tokenP", timeout=20, json={
              "grant_type": "client_credentials", "appkey": key,
              "appsecret": sec}).json()["access_token"]
          h = {"authorization": f"Bearer {tok}", "appkey": key, "appsecret": sec,
               "tr_id": "FHKUP03500100", "custtype": "P"}
          for iscd in ("2001", "0001"):
              show(f"KIS 지수일봉 {iscd}",
                   S.get(BASE + "/uapi/domestic-stock/v1/quotations/inquire-daily-indexchartprice",
                         headers=h, timeout=20,
                         params={"FID_COND_MRKT_DIV_CODE": "U", "FID_INPUT_ISCD": iscd,
                                 "FID_INPUT_DATE_1": "20260801", "FID_INPUT_DATE_2": "20260922",
                                 "FID_PERIOD_DIV_CODE": "D"}), 1400)
          PY
