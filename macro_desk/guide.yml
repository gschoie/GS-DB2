      - {band: "만장일치 동결", tone: warm, mean: "당분간 변화 없음 — 채권 금리가 횡보"}
      - {band: "인하 + 매파적 기자회견", tone: warm, mean: "'한 번 하고 쉬어간다'는 신호일 수 있다"}
    market: 국고채 3년물이 기대를 먼저 반영한다 — 결정 전 금리 움직임을 보면 시장 예상을 알 수 있다.
    korea: 한미 금리차·환율·가계부채 셋에 묶여 있어 물가만으로 예측하면 자주 틀린다.
