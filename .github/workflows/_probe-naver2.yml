name: "[시험용] 네이버 증권 신규 구조 탐색"

# 신규 수급 API(/market/investorTrend)의 파라미터(기간·시장)를 확정하고,
# 전체 API 목록에서 '선물·파생'에 해당하는 것이 정말 하나도 없는지 못박는다.
# 확인이 끝나면 이 파일은 지운다.
on:
  push:
    branches: [claude/telegram-trend-analysis-logic-7efsdy]
    paths: [".github/workflows/_probe-naver2.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: 탐색
        run: |
          python - <<'PY'
          import re, json
          import requests

          HOST = "https://m.stock.naver.com"
          API = HOST + "/front-api"
          UA = ("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 "
                "(KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1")
          S = requests.Session(); S.headers.update({"User-Agent": UA, "Referer": HOST + "/"})

          def get(u, **kw):
              try: return S.get(u, timeout=25, **kw)
              except Exception as e:
                  print(f"   !! {u} -> {type(e).__name__}: {e}"); return None

          def show(path, params, cut=900):
              rr = get(API + path, params=params)
              if rr is None: return
              print(f"\n  [{rr.status_code}] {path} {params}\n    {rr.text[:cut]}")

          # ── 1) 선물·파생이 정말 없는지 ──────────────────────────────
          seeds = ["/", "/domestic/index/KPI200/total", "/domestic/stock/005930/total",
                   "/domestic/home/capitalization/total", "/worldstock/futures/EScv1/total",
                   "/marketindex"]
          chunks = set()
          for p in seeds:
              r = get(HOST + p)
              if r is not None and r.status_code == 200:
                  chunks |= set(re.findall(r'src="([^"]*/_next/static/[^"]+\.js)"', r.text))
          for c in list(chunks):
              rr = get(c if c.startswith("http") else HOST + c)
              if rr is None or rr.status_code != 200: continue
              chunks |= {"/_next/static/chunks/" + m for m in
                         re.findall(r'"(?:static/chunks/)?((?:pages|app)/[A-Za-z0-9/_.\-\[\]]+\.js)"', rr.text)}
          PAT = re.compile(r'url:\s*["`\']([^"`\']+)')
          urls = set()
          for c in sorted(chunks)[:500]:
              rr = get(c if c.startswith("http") else HOST + c)
              if rr is None or rr.status_code != 200: continue
              urls |= set(PAT.findall(rr.text))
          FUT = re.compile(r"futur|derivat|drv|option|선물", re.I)
          print("=" * 70); print(f"axios url 총 {len(urls)}개 · 선물/파생 해당:"); print("=" * 70)
          for u in sorted(x for x in urls if FUT.search(x)): print("   ", u)

          # ── 2) investorTrend 파라미터 확정 ─────────────────────────
          print("\n" + "=" * 70); print("investorTrend 파라미터"); print("=" * 70)
          for p in ({}, {"marketType": "KOSPI"}, {"marketType": "KOSDAQ"},
                    {"marketType": "ALL"}, {"marketType": "BAD"},
                    {"periodType": "BAD"}, {"periodType": "daily"},
                    {"marketType": "KOSPI", "fromDate": "20260915", "toDate": "20260919"},
                    {"marketType": "KOSPI", "startDate": "20260915", "endDate": "20260919"},
                    {"marketType": "KOSPI", "bizdate": "20260919"},
                    {"marketType": "KOSPI", "periodType": "weekly"}):
              show("/market/investorTrend", p, 700)

          # ── 3) 종목별 수급 이력 깊이 ───────────────────────────────
          print("\n" + "=" * 70); print("stock/domestic/trend"); print("=" * 70)
          show("/stock/domestic/trend", {"code": "005930", "size": 40}, 400)
          rr = get(API + "/stock/domestic/trend", params={"code": "005930", "size": 40})
          if rr is not None and rr.ok:
              try:
                  j = rr.json()["result"]
                  print("   건수", len(j.get("items") or []), "· cursor", j.get("cursor"))
              except Exception as e: print("   ", e)
          PY
