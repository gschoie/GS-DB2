    what: 한국 기준금리 결정. 총재 기자회견과 **소수의견 몇 명**이 다음 회의 방향을 알려준다.
    watch: 기준금리, 소수의견 수, 총재 발언, 수정 경제전망(2·5·8·11월)
    read:
