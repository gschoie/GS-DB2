name: probe-naver (임시)

# 종목별 외국인 수급 데이터 소스 탐색용 임시 워크플로 — 확인 후 삭제 예정
# urls 입력(공백 구분)으로 아무 페이지나 태그 제거 텍스트로 확인할 수 있다.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "확인할 URL들 (공백 구분)"
        required: false
        default: ""
      chars:
        description: "URL당 출력 문자수"
        required: false
        default: "6000"
      kis:
        description: "true면 한투 매매종목가집계(FHPTJ04400000) 응답 확인"
        required: false
        default: "false"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: URL 텍스트 덤프
        env:
          URLS: ${{ inputs.urls }}
          CHARS: ${{ inputs.chars }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          for u in $URLS; do
            echo "===== $u"
            curl -sS -m 20 -H "User-Agent: $UA" "$u" -o /tmp/raw || { echo "(fetch 실패)"; continue; }
            python3 - "$u" <<'EOF'
          import re, sys, os
          raw = open('/tmp/raw', 'rb').read()
          try:
              html = raw.decode('euc-kr')
          except UnicodeDecodeError:
              html = raw.decode('utf-8', 'replace')
          html = re.sub(r'<(script|style)[^>]*>.*?</\1>', ' ', html, flags=re.S | re.I)
          # 폼 파라미터 후보
          for m in re.findall(r'<(?:input|select)[^>]*name="([^"]+)"', html):
              print('[param]', m)
          for m in sorted(set(re.findall(r'href="([^"]*deal_rank[^"]*)"', html))):
              print('[link]', m)
          text = re.sub(r'<[^>]+>', ' ', html)
          text = re.sub(r'&nbsp;?', ' ', text)
          text = re.sub(r'[ \t]+', ' ', text)
          lines = [l.strip() for l in text.splitlines() if l.strip()]
          body = '\n'.join(lines)
          # 본문 표 근처부터 출력
          n = int(os.environ.get('CHARS', '6000'))
          i = max(body.find('상위'), 0)
          print(body[i:i + n])
          EOF
            echo
          done

      - name: KIS 매매종목가집계 확인
        if: ${{ inputs.kis == 'true' }}
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          pip install -q requests
          python3 <<'EOF'
          import os, json, requests
          BASE = "https://openapi.koreainvestment.com:9443"
          k, s = os.environ["KIS_APP_KEY"], os.environ["KIS_APP_SECRET"]
          r = requests.post(f"{BASE}/oauth2/tokenP", json={
              "grant_type": "client_credentials", "appkey": k, "appsecret": s}, timeout=15)
          r.raise_for_status()
          tok = r.json()["access_token"]
          H = {"authorization": f"Bearer {tok}", "appkey": k, "appsecret": s,
               "tr_id": "FHPTJ04400000", "custtype": "P"}
          for sort_cls in ("0", "1"):  # 0 순매수상위, 1 순매도상위
              p = {"FID_COND_MRKT_DIV_CODE": "V", "FID_COND_SCR_DIV_CODE": "16449",
                   "FID_INPUT_ISCD": "0000", "FID_DIV_CLS_CODE": "1",
                   "FID_RANK_SORT_CLS_CODE": sort_cls, "FID_ETC_CLS_CODE": "1"}
              r = requests.get(f"{BASE}/uapi/domestic-stock/v1/quotations/foreign-institution-total",
                               headers=H, params=p, timeout=15)
              print("== sort", sort_cls, "HTTP", r.status_code)
              try:
                  j = r.json()
                  print("rt_cd", j.get("rt_cd"), "msg", j.get("msg1"))
                  out = j.get("output") or j.get("output1") or []
                  print(json.dumps(out[:3], ensure_ascii=False, indent=1))
                  print("행수:", len(out))
              except Exception as e:
                  print("parse fail:", e, r.text[:500])
          EOF
