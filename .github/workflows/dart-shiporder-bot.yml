name: DART ShipOrder Bot

# 조선 수주공시(단일판매·공급계약체결) URL을 넣고 Run 하면
# 공시 화면을 캡처(형광펜)하고 선종/척수/납기/신조선가를 계산해 텔레그램에 보낸다.
on:
  workflow_dispatch:
    inputs:
      dart_url:
        description: "DART 수주공시 URL 또는 rcpNo (예: https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260708800164)"
        required: true
        type: string
      target:
        description: "보낼 채널"
        required: true
        type: choice
        default: "바담+공개채널"
        options:
          - "바담+공개채널"
          - "비공개(바담)"
          - "공개채널"
          - "비공개(미리보기)"
      comment:
        description: "내 코멘트 (선택 — 카드 맨 아래에 ❗로 붙습니다)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dart-shiporder-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: dart_shiporder_bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run DART ship-order bot
        working-directory: dart_shiporder_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # 대상별 chat_id — 쉼표로 여러 방(봇이 차례로 보낸다).
          # 기본(대시보드 폼) = 비공개 바담 방 + 공개채널(DAOL 조선/기계/방산 | 최광식, TELEGRAM_CHAT_ID)
          # 동시 발송(10/26 사용자 요청; 10/17 '폼은 바담만' 규칙 폐기).
          # 바담 방은 BADAM_TELEGRAM_CHAT_ID 가 있으면 그것, 없으면 COVFLOW_TELEGRAM_CHAT_ID 재사용.
          TELEGRAM_CHAT_ID: ${{ inputs.target == '바담+공개채널' && format('{0},{1}', secrets.BADAM_TELEGRAM_CHAT_ID || secrets.COVFLOW_TELEGRAM_CHAT_ID, secrets.TELEGRAM_CHAT_ID) || inputs.target == '공개채널' && secrets.TELEGRAM_CHAT_ID || inputs.target == '비공개(미리보기)' && secrets.TELEGRAM_CHAT_ID_PRIVATE || secrets.BADAM_TELEGRAM_CHAT_ID || secrets.COVFLOW_TELEGRAM_CHAT_ID }}
          DART_COMMENT: ${{ inputs.comment }}
          DART_TARGET: ${{ inputs.target }}   # 로그에 실제 발송 대상을 찍기 위해
        run: python dart_shiporder_bot.py --url "${{ inputs.dart_url }}"
