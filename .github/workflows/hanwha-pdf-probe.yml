name: 한경컨센서스 구조 진단 (일회성)
on:
  push:
    branches: ["claude/sweet-hypatia-1ozbht"]
    paths: [".github/workflows/hanwha-pdf-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -q requests beautifulsoup4 lxml
      - run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'}
          s=requests.Session(); s.headers.update(UA)
          B='https://consensus.hankyung.com'
          def collapse(t): return re.sub(r'\s+',' ',t)
          def dump(u, n=3):
              r=s.get(u,timeout=30); soup=BeautifulSoup(r.text,'lxml')
              rows=[tr for tr in soup.select('table tr') if tr.find('td')]
              print(f'\n=== {u}\n status={r.status_code} rows={len(rows)}')
              ths=[collapse(th.get_text()) for th in soup.select('table th')]; print(' TH:',ths)
              brokers={}
              for tr in rows:
                  tds=[collapse(td.get_text()) for td in tr.find_all('td')]
                  for t in tds:
                      if t.endswith('증권') or t in ('한화투자증권',): brokers[t]=brokers.get(t,0)+1
              print(' brokers:',brokers)
              for tr in rows[:n]:
                  tds=[collapse(td.get_text())[:60] for td in tr.find_all('td')]
                  links=[a.get('href') for a in tr.find_all('a',href=True)]
                  print(' TDS',tds,'|',links[:3])
              pg=soup.select_one('.paging, .pagination, div.paging'); print(' paging:',collapse(pg.get_text())[:200] if pg else None, [a.get('href') for a in (pg.find_all('a',href=True) if pg else [])][-3:])
              return rows
          dump(f'{B}/analysis/list?now_page=1&search_text=%ED%95%9C%ED%99%94%ED%88%AC%EC%9E%90%EC%A6%9D%EA%B6%8C&pagenum=20&sdate=2026-10-01&edate=2026-11-01')
          dump(f'{B}/analysis/list?now_page=2&search_text=%ED%95%9C%ED%99%94%ED%88%AC%EC%9E%90%EC%A6%9D%EA%B6%8C&pagenum=20&sdate=2026-10-01&edate=2026-11-01')
          dump(f'{B}/analysis/list?now_page=1&search_text=%ED%95%9C%ED%99%94%ED%88%AC%EC%9E%90%EC%A6%9D%EA%B6%8C&pagenum=80&sdate=2025-01-01&edate=2025-01-31')
          dump(f'{B}/analysis/list?now_page=1&search_text=&pagenum=20&sdate=2026-10-30&edate=2026-10-30', n=2)
          # form 구조(검색 종류 셀렉트)
          r=s.get(f'{B}/analysis/list',timeout=30); soup=BeautifulSoup(r.text,'lxml')
          for f in soup.find_all('form'):
              print('FORM',f.get('action'),f.get('method'))
              for i in f.find_all(['input','select']):
                  print('   ',i.name,i.get('name'),i.get('value'),[ (o.get('value'),collapse(o.get_text())) for o in i.find_all('option')][:12] if i.name=='select' else '')
          PY
