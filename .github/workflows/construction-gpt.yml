name: 건설기계 GPT 브리핑

# 건설기계 브리핑 GPT판(2탄) — 수동 등록 전용 워크플로.
# 자동 작성은 Claude 예약 세션(루틴 [7.5])이 웹서치 기반으로 수행하고
# claude-brief-ingest 가 main 반영+텔레 발송한다. 이 워크플로는 수집 크론이 없다
# (기존 건설기계 데일리가 이미 RSS·시세 수집판이라 GPT판은 웹서치로 차별화).
#
# 수동 입력 경로 두 가지(진짜 ChatGPT 앱 산출물 등록용 — 자동 작성보다 우선):
#   1. 대시보드 chatgpt_construction_report.html 의 ✍️ 폼 → GAS dispatch_proxy(congpt)
#      → workflow_dispatch inputs.content → 즉시 발행 + 텔레그램
#   2. construction_gpt/inbox/YYYY-MM-DD.md 를 main에 커밋 (push 트리거)
#      — workflow_dispatch 문자열 입력칸은 한 줄짜리라 여러 줄 md가 뭉개진다.
# 텔레그램: 건기 텔레는 통합본 한 통만 매크로_공부 방으로 나간다(claude-brief-ingest
# 담당, 2026-09-17 변경) — GPT판 개별 발송은 중복이라 이 워크플로에 없음.

on:
  workflow_dispatch:
    inputs:
      content:
        description: "브리핑 마크다운 본문 (대시보드 폼이 채움)"
        type: string
        required: false
        default: ""
      date:
        description: "브리핑 날짜 YYYY-MM-DD (비우면 오늘 KST)"
        type: string
        required: false
        default: ""
  push:
    branches: ["main"]
    paths: ["construction_gpt/inbox/*.md"]

permissions:
  contents: write

concurrency:
  group: construction-gpt
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수동 발행 (폼 content 또는 inbox 파일)
        working-directory: construction_briefing
        env:
          # 셸 인자 대신 환경변수로 — 본문에 따옴표·백틱이 있어도 안전하다.
          CONTENT: ${{ inputs.content }}
          DATE: ${{ inputs.date }}
        run: python gpt_construction_publish.py --ingest

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d telegram_research_dashboard/static/chatgpt_construction ]; then
            git add telegram_research_dashboard/static/chatgpt_construction
          fi
          git add telegram_research_dashboard/static/chatgpt_construction_report.html
          git add -A construction_gpt/inbox
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(congpt): 건설기계 GPT판 수동 발행 $(TZ=Asia/Seoul date +%F)"
            ok=""
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              sleep $((i * 5))
            done
            [ -n "$ok" ] || exit 1
          fi
