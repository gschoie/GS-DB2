name: 글로벌 건설기계 주간정리

# 매주 토요일 KST 12:10에 지난 7일의 건설기계 데일리 브리핑을 종합한
# 주간 정리본을 생성해 대시보드에 커밋한다. 방산 주간정리(11:50)와
# 20분 오프셋 — 같은 Gemini 키를 쓸 경우 분당 한도 충돌을 피한다.
# 최근 4주 묶음(last4weeks.md/.html)도 함께 갱신 — 월간 세미나(NotebookLM) 소스.
on:
  workflow_dispatch:
  schedule:
    # UTC 03:10 = KST 12:10 (토) — 안전망. 정시 발사는 GAS 스케줄러(conweekly 슬롯)가
    # 담당한다(토요일 크론이 매주 +4.5시간대로 밀려 텔레가 오후 5시에 오던 문제, 9/19).
    - cron: "10 3 * * 6"

permissions:
  contents: write

concurrency:
  group: construction-weekly
  cancel-in-progress: false

jobs:
  # 예약(schedule) 실행 중복 가드 — 이벤트를 가리지 않고 최근 600분 내
  # 성공·진행중 run(자기 자신 제외)이 있으면 뒤늦은 크론을 건너뛴다. fail-open.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 최근 실행 확인
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-600 minutes' +%Y-%m-%dT%H:%M)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/construction-weekly.yml/runs?created=%3E${since}" \
                --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion=="success" or .status=="in_progress" or .status=="queued")] | length' || echo 0)
          echo "최근 600분 내 다른 실행 ${n:-0}건"
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::이번 주 주간정리는 이미 처리됐습니다 — 이 예약 실행은 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  weekly:
    needs: guard
    if: ${{ always() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: construction_briefing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 주간 정리 생성
        working-directory: construction_briefing
        env:
          # 전용 키(별도 GCP 프로젝트) 권장 — 없으면 방산과 같은 키로 폴백
          GEMINI_API_KEY: ${{ secrets.CONSTRUCTION_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          # 신규 GCP 프로젝트 키는 gemini-2.5-pro 사용 불가(404) — flash 폴백 내장
          GEMINI_MODEL: gemini-3.1-pro-preview
          # 텔레그램은 시크릿 설정 시에만 발송 (미설정이면 봇이 생략)
          TELEGRAM_BOT_TOKEN: ${{ secrets.CONSTRUCTION_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CONSTRUCTION_TELEGRAM_CHAT_ID }}
        run: python weekly_construction_bot.py

      - name: 아카이브 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/construction_weekly \
                  telegram_research_dashboard/static/construction_weekly_report.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(construction): 건설기계 주간 정리 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "push 실패" >&2
          exit 1
