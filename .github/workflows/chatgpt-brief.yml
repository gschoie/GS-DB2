name: ChatGPT 방산 브리핑

# 사용자가 ChatGPT(스케줄 태스크)로 받은 방산 브리핑을 대시보드+텔레그램으로 발행한다.
# 입력 경로 두 가지:
#   1. 대시보드 chatgpt_defense_report.html 의 ✍️ 폼 → GAS dispatch_proxy(gptbrief)
#      → workflow_dispatch inputs.content
#   2. chatgpt_briefing/inbox/YYYY-MM-DD.md 를 main에 커밋 (GitHub 웹/모바일 보조 경로)
#      — workflow_dispatch의 문자열 입력칸은 한 줄짜리라 여러 줄 md가 뭉개지므로
#        수동 등록은 파일 커밋으로 한다. 처리 후 inbox 파일은 지워서 재실행을 막는다.
# 텔레그램은 방산 데일리(Gemini)와 같은 채널(KDEF_TELEGRAM_*) 기본,
# GPT_TELEGRAM_* 시크릿을 만들면 그쪽이 우선한다.

on:
  workflow_dispatch:
    inputs:
      content:
        description: "브리핑 마크다운 본문 (대시보드 폼이 채움 — 수동은 inbox 파일 권장)"
        type: string
        required: false
        default: ""
      date:
        description: "브리핑 날짜 YYYY-MM-DD (비우면 오늘 KST)"
        type: string
        required: false
        default: ""
  push:
    branches: ["main"]
    paths: ["chatgpt_briefing/inbox/*.md"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest & render
        env:
          # 셸 인자 대신 환경변수로 — 본문에 따옴표·백틱이 있어도 안전하다.
          CONTENT: ${{ inputs.content }}
          DATE: ${{ inputs.date }}
        run: python defense_briefing/gpt_brief_publish.py --ingest

      - name: Commit pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/chatgpt_defense \
                  telegram_research_dashboard/static/chatgpt_defense_report.html
          git add -A chatgpt_briefing/inbox
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: chatgpt 방산 브리핑 $(TZ=Asia/Seoul date +%F)"
            ok=""
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              sleep $((i * 5))
            done
            [ -n "$ok" ] || exit 1
          fi

      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GPT_TELEGRAM_BOT_TOKEN || secrets.KDEF_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GPT_TELEGRAM_CHAT_ID || secrets.KDEF_TELEGRAM_CHAT_ID }}
        run: |
          pip -q install requests
          python defense_briefing/gpt_brief_publish.py --send-processed
