name: Claude 방산 브리핑 수집
# Claude 예약 작업 세션은 main 직접 push 권한이 없을 수 있어 전용 브랜치
# (claude/defense-brief-daily)에 결과물을 올린다. 이 워크플로가 그 push를 받아
# 브리핑 파일만 main에 반영하고 텔레그램을 발송한다.
# 2026-08-25부터 건설기계 브리핑(Claude 작성판), 2026-09-17부터 방산 RSS판
# (chatgpt_defense — 3탄)도 같은 경로로 나른다.
# 주의: 세션은 push 전 반드시 origin/main을 머지해 브랜치의 건설기계 파일이
# main보다 뒤처지지 않게 유지할 것 (Gemini 폴백이 main에 직접 쓰는 날 대비).
# GITHUB_TOKEN push는 on:push 워크플로를 다시 깨우지 못하므로, 배포는
# deploy-pages.yml 의 workflow_run 목록에 이 워크플로 이름을 등록해 잇는다.

on:
  workflow_dispatch:
  push:
    branches: ["claude/defense-brief-daily"]

permissions:
  contents: write

concurrency:
  group: claude-brief-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: 브리핑 파일 가져오기 (브랜치 → 작업트리)
        run: |
          git fetch origin claude/defense-brief-daily
          # RSS판(chatgpt_defense)은 초기에 브랜치에 없을 수 있어 경로별로 관대하게 가져온다
          for p in \
            'telegram_research_dashboard/static/claude_defense/' \
            'telegram_research_dashboard/static/claude_defense_report.html' \
            'telegram_research_dashboard/static/construction_daily/' \
            'telegram_research_dashboard/static/construction_briefing_report.html' \
            'telegram_research_dashboard/static/chatgpt_defense/' \
            'telegram_research_dashboard/static/chatgpt_defense_report.html' \
            'telegram_research_dashboard/static/defense_unified/' \
            'telegram_research_dashboard/static/defense_unified_report.html' \
            'telegram_research_dashboard/static/chatgpt_construction/' \
            'telegram_research_dashboard/static/chatgpt_construction_report.html' \
            'telegram_research_dashboard/static/construction_unified/' \
            'telegram_research_dashboard/static/construction_unified_report.html'; do
            git checkout origin/claude/defense-brief-daily -- "$p" \
              || echo "skip: $p (브랜치에 없음)"
          done

      - name: main에 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/claude_defense \
                  telegram_research_dashboard/static/claude_defense_report.html \
                  telegram_research_dashboard/static/construction_daily \
                  telegram_research_dashboard/static/construction_briefing_report.html \
                  telegram_research_dashboard/static/chatgpt_defense_report.html \
                  telegram_research_dashboard/static/defense_unified_report.html
          if [ -d telegram_research_dashboard/static/chatgpt_defense ]; then
            git add telegram_research_dashboard/static/chatgpt_defense
          fi
          if [ -d telegram_research_dashboard/static/defense_unified ]; then
            git add telegram_research_dashboard/static/defense_unified
          fi
          for p in chatgpt_construction construction_unified; do
            if [ -d "telegram_research_dashboard/static/$p" ]; then
              git add "telegram_research_dashboard/static/$p"
            fi
            if [ -f "telegram_research_dashboard/static/${p}_report.html" ]; then
              git add "telegram_research_dashboard/static/${p}_report.html"
            fi
          done
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략 (재실행 등)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "send_gpt=false" >> "$GITHUB_OUTPUT"
            echo "send_congpt=false" >> "$GITHUB_OUTPUT"
          else
            # 텔레그램은 새 브리핑 md가 실제로 바뀐 판만 — 렌더러 수정이나 다른 판만
            # 바뀐 커밋에서 요약이 중복 발송되는 것을 막는다.
            if git diff --cached --name-only | grep -q 'claude_defense/.*\.md$'; then
              echo "send=true" >> "$GITHUB_OUTPUT"
            else
              echo "claude md 변경 없음 — 방산(클) 텔레그램 생략"
              echo "send=false" >> "$GITHUB_OUTPUT"
            fi
            if git diff --cached --name-only | grep -q 'chatgpt_defense/.*\.md$'; then
              echo "send_gpt=true" >> "$GITHUB_OUTPUT"
            else
              echo "send_gpt=false" >> "$GITHUB_OUTPUT"
            fi
            if git diff --cached --name-only | grep -q 'chatgpt_construction/.*\.md$'; then
              echo "send_congpt=true" >> "$GITHUB_OUTPUT"
            else
              echo "send_congpt=false" >> "$GITHUB_OUTPUT"
            fi
            if git diff --cached --name-only | grep -q 'claude_defense/'; then
              msg="Claude 방산 브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            elif git diff --cached --name-only | grep -q 'chatgpt_defense/'; then
              msg="방산 브리핑 RSS판 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            elif git diff --cached --name-only | grep -q 'defense_unified/'; then
              msg="방산 브리핑 통합본 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            elif git diff --cached --name-only | grep -q 'chatgpt_construction/'; then
              msg="건설기계 브리핑 GPT판 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            elif git diff --cached --name-only | grep -q 'construction_unified/'; then
              msg="건설기계 브리핑 통합본 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            else
              msg="Claude 건설기계 브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            fi
            git commit -m "$msg"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.commit.outputs.send == 'true' || steps.commit.outputs.send_gpt == 'true' || steps.commit.outputs.send_congpt == 'true'
        with:
          python-version: "3.12"

      - name: 텔레그램 발송 (새 방산(클) 브리핑일 때만)
        if: steps.commit.outputs.send == 'true'
        env:
          CLAUDE_TELEGRAM_BOT_TOKEN: ${{ secrets.CLAUDE_TELEGRAM_BOT_TOKEN }}
          CLAUDE_TELEGRAM_CHAT_ID: ${{ secrets.CLAUDE_TELEGRAM_CHAT_ID }}
        run: |
          python -m pip install requests
          python defense_briefing/claude_brief_publish.py --send-only

      - name: 텔레그램 발송 (새 RSS판 브리핑일 때만)
        if: steps.commit.outputs.send_gpt == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GPT_TELEGRAM_BOT_TOKEN || secrets.KDEF_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GPT_TELEGRAM_CHAT_ID || secrets.KDEF_TELEGRAM_CHAT_ID }}
        run: |
          python -m pip install requests
          python defense_briefing/gpt_brief_publish.py --send-only

      - name: 텔레그램 발송 (새 건설기계 GPT판일 때만)
        if: steps.commit.outputs.send_congpt == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.CONGPT_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CONGPT_TELEGRAM_CHAT_ID }}
        working-directory: construction_briefing
        run: |
          python -m pip install requests
          python gpt_construction_publish.py --send-only
