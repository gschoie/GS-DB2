<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>월별 근태 체크</title><style>
:root{color-scheme:light}
body{margin:0;padding:28px 24px 60px;background:#fff;color:#333c46;
  font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;line-height:1.7;font-size:15px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:21px;color:#1f2937;margin:0 0 4px}
.meta{color:#8a94a0;font-size:12.5px;margin-bottom:18px}
.pager{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.pager button{background:#f5f8fb;border:1px solid #d4dbe3;border-radius:8px;
  padding:4px 12px;font-size:14px;cursor:pointer;color:#2b5f8a}
.pager button:disabled{opacity:.35;cursor:default}
.pager .label{font-size:16.5px;font-weight:700;color:#1f2937;min-width:110px;text-align:center}
.count{color:#8a94a0;font-size:13px;margin-left:6px}
.count b{color:#2b7a4b}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}
th{color:#8a94a0;font-weight:600;font-size:12.5px}
.name{font-weight:700;color:#1f2937;white-space:nowrap}
.chk{font-size:18px;cursor:pointer;user-select:none;display:inline-block;min-width:26px;text-align:center}
.chk.on{color:#2b7a4b}
.chk.off{color:#c3ccd6}
tr.pending td{opacity:.55}
.when{color:#8a94a0;font-size:12.5px;white-space:nowrap}
.quote{color:#57616c;font-size:13px}
.quote .manual{color:#8a94a0}
.hint{color:#8a94a0;font-size:12.5px;margin-top:16px}
@media (max-width:640px){
  body{padding:18px 10px 50px}
  th.h-when,td.c-when{display:none}
}
</style></head><body><div class="wrap">
<h1>✅ 월별 근태 체크</h1>
<div class="meta">갱신 2026-09-09 09:27 · 텔레그램 1:1 대화의 "근태 완벽합니다" 보고를 자동 수집 ·
확인 칸을 누르면 수동 토글</div>
<div class="pager"><button id="m-prev">◀</button><span class="label" id="m-label"></span>
<button id="m-next">▶</button><span class="count" id="m-count"></span></div>
<div class="att-month" data-month="2026-09" data-done="1" hidden><table><thead><tr><th>이름</th><th>확인</th><th class="h-when">시각</th><th>내용</th></tr></thead><tbody><tr data-name="고영민" data-checked="1"><td class="c-name name">고영민</td><td class="c-chk"><span class="chk on">✅</span></td><td class="c-when when">09/09 09:27</td><td class="c-quote quote"><span class="manual">수동 체크</span></td></tr><tr data-name="김상혁" data-checked="0"><td class="c-name name">김상혁</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="김연미" data-checked="0"><td class="c-name name">김연미</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="김지원" data-checked="0"><td class="c-name name">김지원</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="김진영" data-checked="0"><td class="c-name name">김진영</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="김혜영" data-checked="0"><td class="c-name name">김혜영</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="박소현" data-checked="0"><td class="c-name name">박소현</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="박영도" data-checked="0"><td class="c-name name">박영도</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="박종현" data-checked="0"><td class="c-name name">박종현</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="유지웅" data-checked="0"><td class="c-name name">유지웅</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="이다연" data-checked="0"><td class="c-name name">이다연</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="이정우" data-checked="0"><td class="c-name name">이정우</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="이준범" data-checked="0"><td class="c-name name">이준범</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="이지수" data-checked="0"><td class="c-name name">이지수</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="임도영" data-checked="0"><td class="c-name name">임도영</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr><tr data-name="한수빈" data-checked="0"><td class="c-name name">한수빈</td><td class="c-chk"><span class="chk off">☐</span></td><td class="c-when when"></td><td class="c-quote quote"></td></tr></tbody></table></div>
<p id="att-status"></p>
<p class="hint">자동 체크 문구 예: "근태 완벽합니다", "9월 근태 이상 없습니다" —
달을 안 적으면 메시지를 보낸 달로 기록됩니다.</p>
</div>
<script>
const EP="https://script.google.com/macros/s/AKfycbx3RjIjtlO2Z6fIYo2T3LhJrFg9Wp2hS7dMS3Is52-JVF1hizoCWewbQ1uM_v5sdhR2jw/exec";
const PAGE_STAMP="2026-09-09 09:27";
const CURRENT="2026-09";
</script>
<script>

const $id=i=>document.getElementById(i);
const months=[...document.querySelectorAll('.att-month')];
let idx=Math.max(0,months.findIndex(m=>m.dataset.month===CURRENT));
function label(ym){const[y,m]=ym.split('-');return y+'년 '+Number(m)+'월'}
function render(){
  months.forEach((el,i)=>{el.hidden=i!==idx});
  const el=months[idx];
  $id('m-label').textContent=label(el.dataset.month);
  const total=el.querySelectorAll('tbody tr').length;
  const done=el.querySelectorAll('tr[data-checked="1"]').length;
  $id('m-count').innerHTML='확인 <b>'+done+'</b> / '+total;
  $id('m-prev').disabled=idx<=0;
  $id('m-next').disabled=idx>=months.length-1;
}
$id('m-prev').onclick=()=>{if(idx>0){idx--;render()}};
$id('m-next').onclick=()=>{if(idx<months.length-1){idx++;render()}};
render();

async function watchDeploy(){
  for(let i=0;i<24;i++){
    await new Promise(r=>setTimeout(r,15000));
    try{
      const r=await fetch('attendance_report.html?t='+Date.now(),{cache:'no-store'});
      const m=(await r.text()).match(/갱신 ([0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2})/);
      if(m&&m[1]!==PAGE_STAMP){location.reload();return}
    }catch(e){}
  }
  const s=$id('att-status');
  if(s)s.textContent='서버 반영 확인이 오래 걸립니다 — 잠시 뒤 수동 새로고침해 주세요';
}

// 확인 칸 클릭 → 토글. 화면에 우선 반영하고 서버(워크플로) 처리 뒤 자동 새로고침.
document.addEventListener('click',async ev=>{
  const chk=ev.target.closest('.chk');if(!chk)return;
  const row=chk.closest('tr'),monthEl=chk.closest('.att-month');
  const name=row.dataset.name,month=monthEl.dataset.month;
  const next=row.dataset.checked!=='1';
  if(!confirm(name+' — '+label(month)+' 근태를 '+(next?'확인 처리':'해제')+'할까요?'))return;
  const status=$id('att-status');
  status.textContent='요청 중…';
  try{
    const payload={op:'att',name:name,month:month,checked:next};
    const r=await fetch(EP,{method:'POST',
      body:JSON.stringify({workflow:'vacation',entry:JSON.stringify(payload)})});
    try{const d=await r.json();
      if(d&&d.ok===false){status.textContent='⚠ 거절 '+(d.code||'?')+' — '+(d.error||'GAS 프록시 확인 필요');return}
    }catch(e){}
    row.dataset.checked=next?'1':'0';
    row.classList.add('pending');
    chk.textContent=next?'✅':'☐';
    chk.classList.toggle('on',next);chk.classList.toggle('off',!next);
    const q=row.querySelector('.c-quote');
    if(q)q.innerHTML=next?'<span class="manual">수동 체크 (반영 중…)</span>':'';
    const w=row.querySelector('.c-when');if(w)w.textContent='방금';
    render();
    status.textContent='✅ 반영 요청됨 — 서버 반영이 끝나면 자동 새로고침됩니다';
    watchDeploy();
  }catch(e){status.textContent='실패: '+e.message}
});
</script></body></html>
