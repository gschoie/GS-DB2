<!DOCTYPE html>
<!--
  커버리지 영업이익 컨센서스 추이 — ecos-fx-rates 리포의 Actions('커버리지 컨센서스 추이 이미지')가 굽는
  PNG/SVG 를 대시보드 안에서 보고, 그림마다 다운로드·클립보드 복사. 파일은 그 리포 output/consensus/ 에 있고
  raw.githubusercontent(CORS *) 로 읽는다 — GitHub 폴더 페이지로 나가지 않게(사용자 "누르면 github가 뜬다").
  peer_price.html 과 같은 틀. 복사는 PNG(클립보드 표준 이미지 형식)만 된다. 내려받는 파일명은 영문
  (consensus_quarter_YYYYMMDD.png) — 한글 이름은 헤드리스 크롬 실측에서 'download' 로 바뀌었다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>컨센서스 추이 — GS Research Desk</title>
<style>
:root{--bg:#fff;--fg:#1c2430;--muted:#6b7684;--line:#e5e8ec;--card:#f7f8fa;--btn:#1f2937;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e6e9ee;--muted:#8b93a1;--line:#2a313c;--card:#1b212b;--btn:#e6e9ee;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;padding:18px 16px 48px;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.note{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.7}
.note a{color:inherit}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.jump a{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;background:var(--card)}
.card{border:1px solid var(--line);border-radius:8px;margin:0 0 18px;background:var(--card);overflow:hidden}
.card .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.card .hd h2{font-size:14px;margin:0 auto 0 0}
.card .hd small{color:var(--muted);font-size:11.5px;margin-left:8px;font-weight:400}
button,a.btn{font:600 12.5px inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;text-decoration:none}
button.p{background:var(--btn);color:var(--bg);border-color:var(--btn)}
button:disabled{opacity:.5;cursor:wait}
.card .im{background:#fff;padding:6px}
.card img{display:block;width:100%;height:auto}
.msg{font-size:12px;padding:0 12px 8px;min-height:0}
.msg.err{color:#b45309}.msg.ok{color:var(--ok)}
#stamp{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 커버리지 영업이익 컨센서스 추이</h1>
  <p class="sub">조선·조기 9 · 방산 5 · 건기 2 — 최근 6개월 컨센서스(평균) 추이, 범례 숫자는 최신 컨센(억원)·%는 1개월 전 대비. <span id="stamp"></span></p>
  <p class="note"><b>📋 복사</b> 후 위클리(워드·PPT)에 바로 <b>Ctrl+V</b>. 확대해도 선명하게 넣으려면 <b>SVG</b> 를 내려받아 <b>삽입 → 그림 → 이 디바이스</b>.
    갱신은 <a href="https://github.com/gschoie/ecos-fx-rates/actions/workflows/consensus-chart.yml" target="_blank" rel="noopener">ecos-fx-rates Actions › 커버리지 컨센서스 추이 이미지 › Run workflow</a>
    → 약 5분 뒤 이 페이지 새로고침. 자료: FnGuide · 네이버증권(WiseReport).</p>
  <div class="jump" id="jump"></div>
  <div id="cards"></div>
</div>
<script>
(function(){
  const RAW="https://raw.githubusercontent.com/gschoie/ecos-fx-rates/main/output/consensus/";
  const FILES=[
    ["분기 컨센서스","다음 2개 분기 영업이익 (예: 4Q26 · 1Q27)","컨센서스_추이_분기","consensus_quarter"],
    ["연간 컨센서스","올해E · 내년E 영업이익","컨센서스_추이_연간","consensus_annual"],
  ];
  const bust="?t="+Math.floor(Date.now()/600000);   // 10분 단위 캐시 버스트
  const url=(f,ext)=>RAW+encodeURIComponent(f)+"."+ext+bust;
  const canCopy=!!(navigator.clipboard&&window.ClipboardItem);
  const cards=document.getElementById("cards"),jump=document.getElementById("jump");
  FILES.forEach(([title,desc,f,dn],i)=>{
    const j=document.createElement("a");j.href="#img"+i;j.textContent=title;jump.appendChild(j);
    const c=document.createElement("section");c.className="card";c.id="img"+i;
    c.innerHTML=`<div class="hd"><h2>${title}${desc?`<small>${desc}</small>`:""}</h2>
        ${canCopy?`<button class="p" data-f="${f}" data-act="copy">📋 복사</button>`:""}
        <button data-f="${f}" data-dn="${dn}" data-act="dl" data-ext="png">⬇ PNG</button><button data-f="${f}" data-dn="${dn}" data-act="dl" data-ext="svg">⬇ SVG</button>
        <button data-f="${f}" data-dn="${dn}" data-act="dl" data-ext="csv">⬇ 데이터(CSV)</button>
        <a class="btn" href="${url(f,"png")}" target="_blank" rel="noopener">새 창</a></div>
      <div class="im"><img src="${url(f,"png")}" alt="${title}" loading="lazy"></div><div class="msg"></div>`;
    c.querySelector("img").onerror=function(){const m=c.querySelector(".msg");m.className="msg err";
      m.textContent="그림을 불러오지 못했습니다 — Actions 가 아직 한 번도 돌지 않았거나 파일명이 바뀌었을 수 있습니다."};
    cards.appendChild(c);
  });
  const ymd=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Seoul"}).replace(/-/g,"");
  async function getBlob(f,ext){const r=await fetch(url(f,ext),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.blob()}
  document.addEventListener("click",async e=>{
    const b=e.target.closest("button[data-f]");if(!b)return;
    const f=b.dataset.f,m=b.closest(".card").querySelector(".msg");b.disabled=true;m.className="msg";m.textContent="";
    try{
      if(b.dataset.act==="copy"){
        // 클립보드에는 image/png 만 표준 — Promise 를 그대로 넘겨야 사파리도 사용자 제스처로 인정한다
        await navigator.clipboard.write([new ClipboardItem({"image/png":getBlob(f,"png").then(x=>new Blob([x],{type:"image/png"}))})]);
        m.className="msg ok";m.textContent="✓ 복사됨 — 워드·PPT·카톡에 Ctrl+V";
      }else{
        const ext=b.dataset.ext,blob=await getBlob(f,ext),a=document.createElement("a");
        a.href=URL.createObjectURL(blob);a.download=(b.dataset.dn||f)+"_"+ymd()+"."+ext;   // 한글 파일명은 일부 브라우저가 'download' 로 바꿔 저장
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),5000);
      }
    }catch(x){m.className="msg err";m.textContent=(b.dataset.act==="copy"?"복사 실패: ":"다운로드 실패: ")+x.message+" — '새 창' 에서 우클릭으로 복사·저장하세요."}
    finally{b.disabled=false}
  });
  // 파일 갱신 시각(raw 의 Last-Modified) — 못 읽으면 조용히 생략
  fetch(url(FILES[0][2],"png"),{method:"HEAD",cache:"no-store"}).then(r=>{const lm=r.headers.get("last-modified");
    if(lm)document.getElementById("stamp").textContent="파일 갱신: "+new Date(lm).toLocaleString("ko-KR",{timeZone:"Asia/Seoul"})}).catch(()=>{});
})();
</script>
</body>
</html>
