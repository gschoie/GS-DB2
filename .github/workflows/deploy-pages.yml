name: 대시보드 업데이트 및 배포

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    # 한국시간 06·09·12·15·18·21·24시 (3시간 간격, 하루 7회) 자동 갱신.
    # KST→UTC: 06→21(전일) 09→00 12→03 15→06 18→09 21→12 24→15
    # 정각은 GitHub 큐가 몰려 자주 밀리므로 10분 오프셋을 준다(베스트에포트).
    - cron: "10 0,3,6,9,12,15,21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 취소 대신 대기(false): push가 진행 중인 스케줄 수집을 취소해 뉴스가 유실되던 문제 방지
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이전 수집 데이터 복원
        # push에서도 복원한다: 스케줄이 캐시에 쌓은 최신 뉴스를 push가 옛 커밋 DB로
        # 덮어 배포하던 문제를 막는다(캐시 DB = 사실상 단일 진실원본).
        uses: actions/cache@v4
        with:
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_messages.json
            telegram_research_dashboard/data/daol_tone_history.json
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/hhiun_snapshot.json
            telegram_research_dashboard/data/hhiun_top.json
            telegram_research_dashboard/static/hhiun_board_report.html
            telegram_research_dashboard/data/macro.json
          key: dashboard-db-${{ github.run_id }}
          restore-keys: |
            dashboard-db-

      - name: 파이프라인 계약 테스트
        working-directory: telegram_research_dashboard
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Python 패키지 준비
        if: github.event_name != 'push'
        run: python -m pip install requests beautifulsoup4 lxml pycryptodome pypdf telethon

      - name: 공개 텔레그램 최신 글 수집
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        # 날짜 기반 증분 수집. 3시간마다(하루 7회) 도는 자동 갱신이라 3일 재확인이면
        # 겹침이 충분해 누락 0이고, 매번 재긁는 페이지가 적어 빠르다. (수동 🔄뉴스갱신은 2주창)
        # --pages 120 은 안전 상한(콜드스타트·이상시 무한 크롤 방지).
        run: python public_importer.py --channel https://t.me/HI_GS --pages 120 --since-days 3

      - name: DAOL 톤 데이터 갱신
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        run: |
          python build_daol_tone_dashboard.py --refresh

      # (제거) 전체 재분류: 새 메시지는 import 때 이미 완전 파싱되므로 매 run 전체 재파싱
      # (~4,900개 × 느린 파서 = 40분+)은 낭비다. 파서 규칙을 바꾼 뒤에만 수동으로
      # `python rebuild_parsed_data.py` 를 돌린다.

      - name: 링크 기사 제목 및 기업 보강
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        run: python enrich_link_news.py --limit 5000 --all

      - name: 내 코멘트 backfill 및 기사 제목 정리
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        run: python backfill_comments.py

      - name: 수동 기업 교정 적용
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        run: python apply_corrections.py

      - name: 매크로 데이터 수집 (글로벌경제 · 핵심요약)
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        run: python fetch_macro.py

      - name: 배포용 HTML 생성
        if: github.event_name != 'push'
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
        # 노조게시판(build_hhiun) 수집은 여기서 빼고 별도 refresh-union 워크플로가 하루 2회만 돌린다.
        # 캐시로 복원된 hhiun_top.json 을 build_static 이 그대로 구우므로 대시보드엔 항상 표시된다.
        run: python build_static.py

      - name: 배포용 HTML 생성 (push · 커밋된 데이터로 재빌드)
        # push에서도 얼어붙은 prebuilt 대신, 리포지토리에 커밋된 최신 데이터(dashboard.db·톤)로
        # 다시 빌드한다. 텔레그램 수집 등 무거운 단계는 건너뛰고 build_static만 돌린다(표준 라이브러리).
        # → static/app.js 등 코드 변경도 prebuilt 재생성 없이 바로 반영된다.
        if: github.event_name == 'push'
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
        run: python build_static.py

      - name: 배포 안전망 검사
        working-directory: telegram_research_dashboard
        run: python verify_static_output.py _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: telegram_research_dashboard/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
