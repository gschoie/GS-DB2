name: 글로벌 건설기계 브리핑

# 2단 구조 (2026-08-25 개편):
#   06:10 KST — 수집 전용: 시세·매크로·뉴스를 construction_briefing/inputs/<날짜>.json으로
#               main에 커밋. 해석·작성은 Claude 예약 세션이 이 파일을 읽어 수행하고,
#               claude-brief-ingest 경유로 main에 브리핑을 올린다.
#   07:40 KST — Gemini 폴백: 그 시각까지 오늘 브리핑 md가 없으면(Claude 세션 장애 등)
#               Gemini(flash)가 전체 파이프라인으로 대신 작성한다.
# 방산 브리핑(UTC 20:40)과 오프셋 유지 — 같은 Gemini 키의 분당 한도 충돌 회피.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "collect=수집만 / full=Gemini 전체 생성"
        type: choice
        options: [collect, full]
        default: collect
  schedule:
    # UTC 21:10 = KST 06:10 수집. GitHub 큐 지연(보통 5~30분)을 감안하면 실수집 ~06:30.
    - cron: "10 21 * * *"
    # UTC 22:40 = KST 07:40 폴백 — 오늘 md가 이미 있으면 아무것도 안 한다.
    - cron: "40 22 * * *"

permissions:
  contents: write

concurrency:
  group: construction-briefing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: 실행 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "10 21 * * *" ]; then
              mode=collect
            else
              mode=fallback
            fi
          else
            mode="${{ inputs.mode || 'collect' }}"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "실행 모드: $mode"

      - name: 폴백 필요 여부 확인 (오늘 브리핑 md 존재 시 종료)
        id: need
        run: |
          today=$(TZ=Asia/Seoul date +%Y-%m-%d)
          if [ "${{ steps.mode.outputs.mode }}" = "fallback" ] && \
             [ -f "telegram_research_dashboard/static/construction_daily/$today.md" ]; then
            echo "오늘($today) 브리핑 이미 존재 — 폴백 생략"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.need.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        if: steps.need.outputs.run == 'true'
        working-directory: construction_briefing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 데이터 수집 (시세·매크로·뉴스 → inputs JSON)
        if: steps.need.outputs.run == 'true' && steps.mode.outputs.mode == 'collect'
        working-directory: construction_briefing
        run: python construction_briefing_bot.py --collect-only

      - name: Gemini 브리핑 생성 (폴백/수동 full)
        if: steps.need.outputs.run == 'true' && steps.mode.outputs.mode != 'collect'
        working-directory: construction_briefing
        env:
          # 전용 키(별도 GCP 프로젝트) 권장 — 없으면 방산과 같은 키로 폴백
          GEMINI_API_KEY: ${{ secrets.CONSTRUCTION_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          # 무료 티어에서 pro 쿼터가 0이 되어(2026-08-25 확인) flash 별칭을 1순위로 사용.
          # 실패 시 gemini-2.5-flash 자동 폴백 (봇 내장).
          GEMINI_MODEL: gemini-flash-latest
          # 텔레그램은 나중 단계 — 시크릿 미설정이면 봇이 발송을 생략한다
          TELEGRAM_BOT_TOKEN: ${{ secrets.CONSTRUCTION_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CONSTRUCTION_TELEGRAM_CHAT_ID }}
        run: python construction_briefing_bot.py

      # 아카이브 커밋 → deploy-pages가 workflow_run으로 이어서 재배포한다.
      # (봇 GITHUB_TOKEN push는 on:push를 트리거하지 않으므로 workflow_run 필수)
      - name: 커밋 및 푸시
        if: steps.need.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add construction_briefing/inputs \
                  telegram_research_dashboard/static/construction_daily \
                  telegram_research_dashboard/static/construction_briefing_report.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          if [ "${{ steps.mode.outputs.mode }}" = "collect" ]; then
            msg="chore(construction): 브리핑 데이터 수집 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          else
            msg="chore(construction): 글로벌 건설기계 브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          fi
          git commit -m "$msg"
          # 실행 중 main이 앞서가면 rebase 후 재시도 (최대 5회)
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "push 실패" >&2
          exit 1
