# 감시할 소스 목록. 소스를 늘릴 때 손대는 파일은 여기 하나뿐이다.
#
# 필수 키
#   key   : 상태 파일(state/seen.json)의 식별자. 한 번 정하면 절대 바꾸지 말 것
#           (바꾸면 그 소스가 '첫 실행'으로 되돌아가 과거 글을 다시 읽음 처리한다)
#   name  : 텔레그램 메시지 머리에 찍히는 이름
#   type  : telegram | rss | web
#
# 자주 쓰는 선택 키
#   enabled       : false면 건너뜀 (기본 true)
#   match         : 제목+본문에 걸 정규식. 한 채널에서 원하는 자료만 골라낼 때
#   exclude       : 걸리면 버릴 정규식
#   max_per_run   : 한 번에 보낼 최대 글 수 (기본 5)
#   lookback_hours: 이보다 오래된 글은 미발송분이어도 안 보냄 (기본 48)
#   push          : full(본문 통째) | excerpt(요약+링크) | hit(걸린 문장만). 생략하면 종류별 기본값
#   excerpt_chars : excerpt 길이 (기본 600)
#   tags          : 메시지에 붙는 해시태그
#
# 여러 채널을 같은 조건으로 훑을 때
#   channels      : 채널 목록. 한 항목이 채널 수만큼의 소스로 펼쳐진다(key는 자동 생성)
#   match_any     : 낱말 목록(정규식 아님). 회사 이름 아래에 별칭·종목코드를 묶어도 된다
#   exclude_any   : 낱말 목록. 하나라도 걸리면 버린다
#   dedupe_scope  : 같은 값을 가진 소스끼리 '내용이 같은 글'을 한 번만 보낸다
#                   (channels로 펼친 것들은 자동으로 묶음 key를 공유한다)

defaults:
  max_per_run: 5
  lookback_hours: 48
  excerpt_chars: 600

# 조선 감시에 쓰는 낱말 묶음. 아래 두 소스가 이 목록 하나를 같이 쓴다(YAML 앵커).
# 왼쪽이 알림 머리에 찍히는 이름, 오른쪽이 실제로 찾을 낱말이다. 별칭과 종목코드를
# 같이 넣어야 '한국조선해양', '대우조선'처럼 옛 이름으로 쓴 코멘트를 놓치지 않는다.
# 정규식이 아니라 글자 그대로 찾으므로 괄호·점이 들어가도 그냥 쓰면 된다.
x_ship_keywords: &ship_keywords
  HD현대중공업: [현대중공업, HD현대중공업, HD한국조선해양, 한국조선해양, 현대삼호, 현대미포, HD현대미포, "009540", "329180", "010620"]
  삼성중공업: [삼성중공업, "010140"]
  한화오션: [한화오션, 대우조선해양, 대우조선, "042660"]
  조선업황: [신조선가, 클락슨, Clarksons, 수주잔고, 선가지수, LNG운반선, LNG선, 컨테이너선, VLCC, 탱커, 조선업, 조선주, 조선섹터]
  함정·MRO: [함정, 특수선, KDDX, 잠수함, 필리조선소, 한화필리, MASGA, 마스가, 존스법, Jones Act]

sources:
  # 네이버 블로그는 rss.blog.naver.com/<블로그ID>.xml 로 RSS를 준다.
  # 본문이 iframe(PostView.naver) 안에 있어 RSS 요약분만 오므로 전문은 원문 링크로 본다.
  - key: mer
    name: 메르
    type: rss
    url: https://rss.blog.naver.com/ranto28.xml
    tags: [블로그]
    excerpt_chars: 900
    # 메르는 하루에 여러 건 올릴 때가 있어 상한을 조금 넉넉히 둔다.
    max_per_run: 8

  # 한화투자증권 임혜윤 <오늘 개장전 꼭 알아야할 5가지>. https://t.me/lim_econ
  # 이 채널은 데일리 말고 다른 자료도 올리므로 match로 데일리만 골라낸다.
  # 채널의 다른 글까지 전부 받고 싶으면 match 줄을 지우면 된다.
  # 반대로 match 때문에 아무것도 안 오는 것 같으면 `--check --only hanwha_5things`가
  # '필터 통과 n/m건'을 찍어주므로 정규식을 손볼지 바로 알 수 있다.
  - key: hanwha_5things
    name: 한화 임혜윤 · 개장전 5가지
    type: telegram
    channel: "@lim_econ"
    match: "개장전|꼭 알아야|5가지"
    tags: [매크로, 개장전]
    # 개장전 자료라 당일치만 의미가 있다. 지난 글이 뒤늦게 오는 것을 막는다.
    lookback_hours: 18
    max_per_run: 3

  # ── 조선 코멘트 감시 ────────────────────────────────────────────────────
  #
  # 방법 A: 채널을 지정해서 훑기 (로그인 불필요 — 공개 채널만)
  #
  # channels 목록 하나가 채널 수만큼의 소스로 펼쳐진다. 채널 주소만 줄줄이 넣으면
  # 되고, 필터·발송형식은 여기 한 번만 쓴다. 채널이 20~30개여도 실행당 HTTP 요청
  # 각 1번이라 부담이 없다. 서로 퍼나른 같은 글은 dedupe가 걸러 한 번만 온다.
  #
  # 붙일 채널의 @아이디를 아래 목록에 넣고 enabled: true 로 바꾸면 시작된다.
  # 먼저 `python watch_sources.py --check --only ship_channels__채널아이디` 로
  # 잡히는지 확인할 것.
  - key: ship_channels
    enabled: false
    name: 조선 코멘트
    type: telegram
    channels:
      - "@예시채널1"        # ← 실제 @채널아이디로 바꾸세요
      - "@예시채널2"
      # - channel: "@예시채널3"
      #   name: 표시할 이름     # 채널아이디 대신 이 이름이 알림에 찍힌다
    match_any: *ship_keywords
    exclude_any: [휴장, 공지]
    push: hit               # 걸린 문장만 발췌해 보낸다 (전문은 원문 링크로)
    tags: [조선]
    lookback_hours: 24
    max_per_run: 4

  # 방법 B: 내가 가입한 모든 채널 훑기 (비공개 포함 — 계정 로그인 필요)
  #
  # 채널 목록을 관리할 필요가 없다. 대신 준비가 필요하다:
  #   1. telegram_research_dashboard처럼 my.telegram.org에서 api_id/api_hash 발급
  #   2. pip install telethon 후 `python login_account.py` 로 한 번 로그인
  #   3. 이 소스를 enabled: true 로
  # GitHub Actions에서 돌리려면 `python login_account.py --string`이 찍어주는
  # 세션 문자열을 TELEGRAM_SESSION_STRING 시크릿으로 넣는다(README 참고).
  - key: ship_all
    enabled: false
    name: 조선 코멘트(전 채널)
    type: telegram_account
    match_any: *ship_keywords
    exclude_any: [휴장, 공지]
    # 이미 채널 지정으로 받는 곳·잡담방은 이름이나 @아이디로 뺀다
    # exclude_chats: ["@lim_econ", 어떤 채팅방 이름]
    # include_groups: true   # 채널 말고 (슈퍼)그룹 대화까지 볼 때
    dedupe_scope: ship       # 방법 A와 함께 켤 거라면 ship_channels 쪽도 dedupe_scope: ship 으로
    push: hit
    tags: [조선]
    lookback_hours: 24
    max_per_run: 6

  # ── 소스를 늘릴 때 아래 형식을 복사해서 쓰세요 ──────────────────────────
  #
  # - key: some_channel          # 영문 소문자 + 밑줄 권장
  #   name: 보여줄 이름
  #   type: telegram
  #   channel: "@채널아이디"
  #   tags: [태그]
  #
  # - key: some_blog
  #   name: 보여줄 이름
  #   type: rss
  #   url: https://example.com/rss
  #
  # RSS도 텔레그램도 없을 때만 web을 쓴다(사이트 개편에 그대로 깨진다):
  # - key: some_site
  #   name: 보여줄 이름
  #   type: web
  #   url: https://example.com/list
  #   item_selector: "ul.board > li"
  #   title_selector: "a.title"
  #   link_selector: "a.title"
