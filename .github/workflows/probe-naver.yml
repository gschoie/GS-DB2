name: probe-naver (임시)

# 종목별 외국인 수급 데이터 소스 탐색용 임시 워크플로 — 확인 후 삭제 예정
on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 후보 URL 구조 확인
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          fetch() {
            echo "===== $1"
            curl -sS -m 20 -H "User-Agent: $UA" "$1" | iconv -f euc-kr -t utf-8 2>/dev/null \
              | tr -d '\r' | sed 's/\t/ /g' | grep -v '^\s*$' | head -c 4000 || echo "(fetch 실패)"
            echo; echo
          }
          fetchj() {
            echo "===== $1"
            curl -sS -m 20 -H "User-Agent: $UA" "$1" | head -c 3000 || echo "(fetch 실패)"
            echo; echo
          }
          # 시세분석 허브에서 관련 메뉴 링크 훑기
          echo "===== 메뉴 링크 목록 (finance.naver.com/sise/)"
          curl -sS -m 20 -H "User-Agent: $UA" "https://finance.naver.com/sise/" \
            | iconv -f euc-kr -t utf-8 2>/dev/null \
            | grep -o 'href="/sise/[^"]*"[^>]*>[^<]*' | sort -u | head -60
          echo
          # 외국인/기관 매매 상위 후보들
          fetch "https://finance.naver.com/sise/sise_deal_rank.naver"
          fetch "https://finance.naver.com/sise/sise_deal_rank.naver?sosok=01&investor_gubun=9000"
          fetch "https://finance.naver.com/sise/sise_foreign_deal.naver"
          # 모바일 API 후보
          fetchj "https://m.stock.naver.com/api/stocks/dealTrend/foreign?page=1&pageSize=10"
          fetchj "https://m.stock.naver.com/api/dealTrend/foreign/buy?page=1&pageSize=10"
