name: 발간 보고서만 갱신

# 발간 보고서만 빠르게 다시 수집·반영하는 초경량 워크플로 (보통 2~3분).
# 뉴스 기사 제목 보강(enrich_link_news)·코멘트 backfill·톤·매크로·노조 재수집을
# 모두 건너뛴다. 보고서/뉴스는 같은 텔레그램 수집에서 나오므로 뉴스 원문도 DB에는
# 들어가지만, 느린 보강 단계가 없어 새 발간 보고서 반영이 목적일 때 가장 빠르다.
# 전부 표준 라이브러리만 사용해 pip 설치도 없다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 뉴스DB 캐시 복원
        uses: actions/cache/restore@v5
        with:
          # 주의: 캐시 '버전'은 path 목록의 해시다. 다른 워크플로(deploy-pages 등)와 목록이
          # 다르면 같은 키라도 절대 매칭되지 않는다(2026-07-30 사고 원인). 반드시 3개로 통일.
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/macro.json
          key: newsdb2-${{ github.run_id }}
          restore-keys: |
            newsdb2-

      - name: 노조 캐시 복원(읽기전용 · 노조는 안 건드림)
        uses: actions/cache/restore@v5
        with:
          path: |
            telegram_research_dashboard/data/hhiun_snapshot.json
            telegram_research_dashboard/data/hhiun_top.json
            telegram_research_dashboard/static/hhiun_board_report.html
          key: hhiun-${{ github.run_id }}
          restore-keys: |
            hhiun-

      - name: 파이프라인 계약 테스트
        working-directory: telegram_research_dashboard
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: 공개 텔레그램 최신 글 수집 (최근 1주)
        working-directory: telegram_research_dashboard
        # 발간 보고서는 저빈도라 1주 재확인이면 충분하다. 그 이전 글 수정까지
        # 반영하려면 '뉴스 갱신'(2주창) 또는 전체 파이프라인을 쓴다.
        run: python public_importer.py --channel https://t.me/HI_GS --pages 40 --since-days 7

      # 파서 규칙이 바뀐 직후라면 여기서도 전체 재분류가 1회 돈다(그때만 40분+, 평소엔 즉시 생략).
      - name: 파서 변경 시 전체 재분류 (1회성)
        working-directory: telegram_research_dashboard
        run: python rebuild_parsed_data.py --if-parser-changed

      - name: 수동 기업 교정 적용
        working-directory: telegram_research_dashboard
        run: python apply_corrections.py

      - name: TP 보강 패키지 준비 (PDF·OCR)
        run: |
          python -m pip install -q requests pypdf pycryptodome pypdfium2 pytesseract
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor

      # 텔레그램 본문에 TP가 없는 기업분석 보고서는 PDF 표지에서 적정주가를 읽어 채운다.
      # 재수집이 최근 2주 행을 다시 만들며 지운 TP도 여기서 복원된다(캐시 히트라 수 초).
      - name: 보고서 TP 보강 (PDF 표지·OCR)
        working-directory: telegram_research_dashboard
        timeout-minutes: 20
        continue-on-error: true
        run: python enrich_report_tp.py --budget-seconds 300

      - name: 배포용 HTML 생성 (보고서만 갱신 · 톤/매크로/노조는 기존 데이터 유지)
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
          # 배포본 안전망 fetch가 Access 로그인 벽을 통과하기 위한 서비스 토큰(선택)
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python build_static.py

      - name: 배포 안전망 검사
        working-directory: telegram_research_dashboard
        run: python verify_static_output.py _site/index.html

      - name: 뉴스DB 캐시 저장
        uses: actions/cache/save@v5
        with:
          # path 목록은 복원 단계·다른 워크플로와 반드시 동일해야 한다(버전 해시 일치).
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/macro.json
          key: newsdb2-${{ github.run_id }}

      - uses: actions/configure-pages@v6
        with:
          # 8/18 Unpublish로 사이트가 꺼져 있으면 자동으로 다시 켠다
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: telegram_research_dashboard/_site

      # 공유용 주소(https://gs-research-desk.pages.dev)에도 같은 산출물을 올린다.
      # 대시보드의 '새 창으로'·사이드바 새 탭 링크·공유 허브(invest.html)가 전부 이 주소로
      # 열려, 화면 공유 때 주소창에 gschoie.github.io/GS-DB2 와 사이드바가 보이지 않는다.
      # 시크릿이 없거나 실패해도 GitHub Pages 배포는 그대로 간다(continue-on-error).
      - name: Cloudflare Pages 배포 (공유용 주소)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 공유용 주소 배포를 생략합니다"
            exit 0
          fi
          npx --yes wrangler@3 pages deploy telegram_research_dashboard/_site \
            --project-name=gs-research-desk --branch=main --commit-dirty=true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
