# 매크로 데스크 — 수집 대상과 발표 일정 규칙
#
# 시세는 yfinance(키 불필요)를 기본으로 하고, FRED_API_KEY 가 있으면 FRED 계열을
# 덧붙인다. 키가 없으면 그 줄만 빠지고 나머지는 그대로 나온다.

# ── 시세판 ────────────────────────────────────────────────────────────────
# unit: pct(%) | idx(지수) | krw(원) | usd($)
# invert: true 면 '오르는 게 나쁜' 축(예: VIX) — 색을 뒤집는다
quotes:
  - group: 미국 금리·채권
    items:
      - {id: us13w, name: 미국 3개월물, ticker: "^IRX", unit: pct}
      - {id: us2y,  name: 미국 2년물,   ticker: "^FVX", unit: pct, note: "yfinance에 2년물이 없어 5년물로 대체(FRED 키 넣으면 진짜 2년물)"}
      - {id: us10y, name: 미국 10년물,  ticker: "^TNX", unit: pct, key: true}
      - {id: us30y, name: 미국 30년물,  ticker: "^TYX", unit: pct}

  - group: 달러·환율
    items:
      - {id: dxy,    name: 달러지수,   ticker: "DX-Y.NYB", unit: idx, key: true}
      - {id: usdkrw, name: 원/달러,    ticker: "KRW=X",    unit: krw, key: true}
      - {id: usdjpy, name: 엔/달러,    ticker: "JPY=X",    unit: idx}
      - {id: eurusd, name: 유로/달러,  ticker: "EURUSD=X", unit: idx}

  - group: 원자재·위험
    items:
      - {id: wti,  name: WTI 유가,  ticker: "CL=F", unit: usd}
      - {id: gold, name: 금,        ticker: "GC=F", unit: usd}
      - {id: copper, name: 구리,    ticker: "HG=F", unit: usd, note: "경기 선행 — '닥터 코퍼'"}
      - {id: vix,  name: VIX 변동성, ticker: "^VIX", unit: idx, invert: true}

# FRED_API_KEY 가 있을 때만 — 여기에 진짜 2년물·스프레드·기대인플레가 들어온다
fred:
  - {id: dgs2,    name: 미국 2년물(FRED),     series: DGS2,    unit: pct}
  - {id: t10y2y,  name: 10년-2년 스프레드,    series: T10Y2Y,  unit: pct, key: true,
     note: "마이너스 = 장단기 금리 역전"}
  - {id: t10yie,  name: 10년 기대인플레(BEI), series: T10YIE,  unit: pct}
  - {id: dfii10,  name: 10년 실질금리(TIPS),  series: DFII10,  unit: pct, key: true}
  - {id: sofr,    name: SOFR(하루짜리 조달금리), series: SOFR, unit: pct}

# ── 발표 일정 ─────────────────────────────────────────────────────────────
# rule 문법 (calendar_rules.py 가 해석):
#   nth_weekday: [n, 요일]      n번째 해당 요일 (음수면 뒤에서)   예: [1, fri] 첫째 금요일
#   nth_bizday:  n              n번째 영업일(주말만 제외)
#   day:         n              매월 n일 (주말이면 다음 영업일)
#   around:      n              매월 n일 '전후' — 확정일 아님을 ~ 로 표시
# months: 생략하면 매월. [1,4,7,10] 처럼 주면 그 달만(분기물).
# fixed: true 면 규칙으로 못 정하고 기관 공표일을 받아와야 하는 것(FOMC·금통위).
calendar:
  - {id: us_payrolls, name: 미국 고용보고서, country: US, rule: {nth_weekday: [1, fri]},
     time: "밤 9:30(서머타임) / 10:30", guide: us_payrolls}
  - {id: us_cpi,  name: 미국 소비자물가 CPI, country: US, rule: {around: 12},
     time: "밤 9:30 / 10:30", guide: us_cpi}
  - {id: us_ppi,  name: 미국 생산자물가 PPI, country: US, rule: {around: 14}, guide: us_cpi}
  - {id: us_retail, name: 미국 소매판매, country: US, rule: {around: 16}, guide: us_retail}
  - {id: us_pce,  name: 미국 PCE 물가, country: US, rule: {nth_weekday: [-1, fri]},
     time: "밤 9:30 / 10:30", guide: us_pce}
  - {id: us_ism_mfg, name: 미국 ISM 제조업, country: US, rule: {nth_bizday: 1}, guide: us_ism}
  - {id: us_ism_svc, name: 미국 ISM 서비스업, country: US, rule: {nth_bizday: 3}, guide: us_ism}
  - {id: us_gdp,  name: 미국 GDP(속보), country: US, rule: {nth_weekday: [-1, thu]},
     months: [1, 4, 7, 10], guide: us_gdp}
  - {id: fomc,    name: FOMC 금리 결정, country: US, fixed: true, guide: fomc}

  - {id: kr_cpi,  name: 한국 소비자물가, country: KR, rule: {around: 2}, guide: kr_cpi}
  - {id: kr_trade, name: 한국 수출입(잠정), country: KR, rule: {day: 1}, guide: kr_trade}
  - {id: kr_jobs, name: 한국 고용동향, country: KR, rule: {around: 15}}
  - {id: kr_gdp,  name: 한국 GDP(속보), country: KR, rule: {around: 25},
     months: [1, 4, 7, 10], guide: us_gdp}
  - {id: bok,     name: 한국은행 금통위, country: KR, fixed: true, guide: bok}
