name: "[시험용] K200 선물 시세 경로 확인"

# 한투 선물 시세 API 는 열리는데 월물 단축코드가 틀려 output1 이 비어 온다.
# 한투가 배포하는 지수선물옵션 종목마스터(.mst)에서 코스피200 선물 월물 코드를 찾는다.
# 확인이 끝나면 이 파일은 지운다.
on:
  push:
    branches: [claude/telegram-trend-analysis-logic-7efsdy]
    paths: [".github/workflows/_probe-futures-price.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: 탐색
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python - <<'PY'
          import io, os, re, time, zipfile
          import requests

          S = requests.Session()
          S.headers.update({"User-Agent": "Mozilla/5.0"})

          # ── 1) 종목마스터에서 월물 코드 찾기 ────────────────────────
          codes = []
          for url in ("https://new.real.download.dws.co.kr/common/master/fo_idx_code_mts.mst.zip",
                      "https://new.real.download.dws.co.kr/common/master/fo_code_mts.mst.zip"):
              try:
                  r = S.get(url, timeout=60)
                  print(f"\n[마스터] {url} -> {r.status_code} {len(r.content)}바이트")
                  if r.status_code != 200:
                      continue
                  z = zipfile.ZipFile(io.BytesIO(r.content))
                  print("   파일:", z.namelist())
                  raw = z.read(z.namelist()[0]).decode("cp949", "ignore")
                  lines = raw.splitlines()
                  print("   줄수:", len(lines))
                  hits = [l for l in lines if "K200" in l or "코스피200" in l or "KOSPI200" in l]
                  print(f"   K200 관련 {len(hits)}줄 · 앞 12줄:")
                  for l in hits[:12]:
                      print("     |", l[:120])
                  for l in hits:
                      m = re.match(r"\s*(\d{3}[A-Z0-9]{3,5})", l)
                      if m:
                          codes.append(m.group(1))
                  if hits:
                      break
              except Exception as e:
                  print("   실패:", type(e).__name__, e)

          codes = list(dict.fromkeys(codes))
          print("\n마스터에서 뽑은 후보 코드:", codes[:20])

          # ── 2) 후보 + 규칙 조합을 시세로 확인 ───────────────────────
          BASE = "https://openapi.koreainvestment.com:9443"
          key, sec = os.environ["KIS_APP_KEY"], os.environ["KIS_APP_SECRET"]
          tok = S.post(f"{BASE}/oauth2/tokenP", timeout=20, json={
              "grant_type": "client_credentials", "appkey": key,
              "appsecret": sec}).json()["access_token"]
          H = {"authorization": f"Bearer {tok}", "appkey": key, "appsecret": sec,
               "tr_id": "FHMIF10000000", "custtype": "P"}

          def price(code):
              rr = S.get(f"{BASE}/uapi/domestic-futureoption/v1/quotations/inquire-price",
                         headers=H, timeout=15,
                         params={"FID_COND_MRKT_DIV_CODE": "F", "FID_INPUT_ISCD": code})
              try: j = rr.json()
              except Exception: return None
              o1 = j.get("output1") or {}
              return o1 if o1 else None

          tried, found = [], []
          # 마스터 후보 먼저, 그다음 규칙 조합(101 + 연도문자 + 월코드 + 000)
          cand = codes[:30] + [f"101{y}{m}000" for y in "VWXY" for m in "369C"] \
                            + [f"101{y}{m}" for y in "VWXY" for m in ("03", "06", "09", "12")]
          for c in dict.fromkeys(cand):
              o1 = price(c)
              tried.append(c)
              if o1:
                  found.append((c, o1))
                  print(f"\n★ {c} → {str(o1)[:600]}")
              time.sleep(0.12)
          print(f"\n시도 {len(tried)}개 · 성공 {len(found)}개")
          if not found:
              print("모두 빈 응답 — 코드 규칙이 다르거나 별도 권한 필요")
          PY
