# 지표 해석 가이드 — "숫자가 얼마면 무슨 뜻인가"
#
# 이 파일은 API가 아니라 **사람이 쓴 설명**이다. 숫자가 바뀌어도 해석 틀은 잘 안 바뀌므로
# 수집과 분리해 둔다. 고칠 일이 생기면 여기만 고치면 화면이 따라 바뀐다.
#
# links 는 **기관 원문**만 적는다(주소가 안 바뀌는 곳).
# youtube 는 영상 ID를 적지 않고 **검색 링크**로 건다 — 영상은 내려가도 검색은 남는다.

indicators:
  us_cpi:
    name: 미국 소비자물가 (CPI)
    agency: 미 노동통계국 (BLS)
    freq: 매월 (전월치)
    what: |
      도시 소비자가 사는 물건·서비스 값이 1년 전 대비 얼마나 올랐나(YoY)를 잰다.
      **헤드라인**은 전부 포함, **근원(core)**은 식품·에너지를 뺀 것. 둘이 갈리면
      연준은 근원을 본다 — 유가는 통화정책으로 어쩔 수 없기 때문이다.
    watch: 근원 CPI 전년비(core YoY)와 전월비(core MoM)
    read:
      - {band: "근원 YoY 3.5% 이상", tone: hot,  mean: "물가가 안 잡힌다. 금리 인하 기대가 뒤로 밀리고 장기금리가 튄다"}
      - {band: "근원 YoY 2.5~3.5%", tone: warm, mean: "둔화 중이지만 목표(2%)보다 높다. 연준이 '서두르지 않겠다'고 말하는 구간"}
      - {band: "근원 YoY 2.5% 미만", tone: cool, mean: "목표에 근접. 인하 여지가 커지고 금리·달러가 눌린다"}
      - {band: "근원 MoM 0.2% 이하", tone: cool, mean: "연율로 환산하면 2%대 — 추세가 목표에 닿았다는 신호"}
      - {band: "근원 MoM 0.4% 이상", tone: hot,  mean: "한 달치만으로도 연율 5% — 시장이 가장 싫어하는 숫자"}
    market: |
      **절대 수준보다 '예상 대비'가 훨씬 중요하다.** 시장은 예상치를 이미 가격에 넣어둔다.
      예상보다 높으면 → 금리↑ 달러↑ 주식↓ (장기채·성장주가 가장 아프다)
      예상보다 낮으면 → 금리↓ 달러↓ 주식↑
    korea: 미 금리가 뛰면 원화가 약해지고 외국인 수급이 나빠진다. 코스피엔 보통 역풍.
    links:
      - [BLS 소비자물가 공식, "https://www.bls.gov/cpi/"]
      - [FRED 근원 CPI 그래프, "https://fred.stlouisfed.org/series/CPILFESL"]
    youtube: 미국 CPI 소비자물가 해석

  us_ppi:
    name: 미국 생산자물가 (PPI)
    agency: 미 노동통계국 (BLS)
    freq: 매월 (전월치) · CPI 발표 1~2일 뒤
    what: |
      기업이 **물건을 팔 때 받는 값**이 얼마나 올랐나. 소비자가 내는 값(CPI)보다
      한 단계 앞이라 **물가의 선행 지표**로 본다 — 원가가 오르면 몇 달 뒤 소비자가격에
      얹히기 때문이다. 화면 숫자는 **최종수요(final demand)** 기준이다.
      PPI의 서비스·의료 항목은 연준이 보는 PCE 계산에 그대로 들어가므로,
      **PPI가 튀면 월말 PCE 예상치가 같이 올라간다.**
    watch: 최종수요 PPI 전년비(YoY)와 전월비(MoM). 근원은 식품·에너지·무역서비스를 뺀 것
    read:
      - {band: "YoY 3.0% 이상", tone: hot,  mean: "원가 압력이 되살아났다. 몇 달 뒤 CPI 반등 걱정 + 월말 PCE 예상치 상향"}
      - {band: "YoY 1.5~3.0%", tone: warm, mean: "정상 구간. CPI를 밀어올리지도, 끌어내리지도 않는다"}
      - {band: "YoY 1.5% 미만", tone: cool, mean: "원가가 식었다. 기업이 가격을 올릴 힘이 줄어 물가 둔화를 예고"}
      - {band: "MoM 0.4% 이상", tone: hot,  mean: "한 달치만으로 연율 5% — CPI가 좋게 나온 달에도 분위기를 뒤집는다"}
      - {band: "MoM 마이너스", tone: cool, mean: "유가·원자재가 빠진 달에 자주 나온다. 헤드라인만 내려갔는지 근원도 같이인지 볼 것"}
    market: |
      **CPI보다 반응은 작지만, CPI와 방향이 엇갈릴 때 영향이 커진다.**
      CPI가 좋았는데 PPI가 튀면 '아직 끝나지 않았다'로 읽혀 금리 하락분을 되돌린다.
      예상보다 높으면 → 금리↑ 달러↑ / 낮으면 → 금리↓ 달러↓ (경로는 CPI와 같다)
    korea: 수출기업엔 **원가 쪽 신호**다. 미국 PPI가 오르면 그쪽 전방산업 마진이 눌려
      단가 인상 협상이 어려워지고, 미 금리 경로를 통해 원달러·외국인 수급에도 같이 걸린다.
    links:
      - [BLS 생산자물가 공식, "https://www.bls.gov/ppi/"]
      - [BLS PPI 발표 일정, "https://www.bls.gov/schedule/news_release/ppi.htm"]
      - [FRED 최종수요 PPI, "https://fred.stlouisfed.org/series/PPIFIS"]
    youtube: 미국 PPI 생산자물가 해석

  us_pce:
    name: 미국 PCE 물가지수
    agency: 미 경제분석국 (BEA)
    freq: 매월 (전월치)
    what: |
      **연준이 공식 물가 목표(2%)를 재는 잣대**가 CPI가 아니라 이것이다.
      CPI와 다른 점은 사람들이 비싼 물건을 싼 대체재로 바꾸는 걸 반영한다는 것 —
      그래서 보통 CPI보다 조금 낮게 나온다. 근원 PCE가 진짜 주인공이다.
    watch: 근원 PCE 전년비
    read:
      - {band: "근원 PCE YoY 2.0% 근처", tone: cool, mean: "연준 목표 달성. 금리를 낮출 명분이 생긴다"}
      - {band: "2.0~2.8%", tone: warm, mean: "목표 위지만 방향은 맞다 — 연준이 참으며 지켜보는 구간"}
      - {band: "2.8% 이상", tone: hot,  mean: "목표에서 멀다. 긴축 유지 또는 재강화 얘기가 나온다"}
    market: CPI와 방향은 같지만 **연준의 공식 잣대**라 FOMC 직전 발표면 영향이 더 크다.
    korea: CPI와 동일 경로(미 금리 → 원달러 → 외국인 수급).
    links:
      - [BEA 개인소비지출, "https://www.bea.gov/data/personal-consumption-expenditures-price-index"]
      - [FRED 근원 PCE, "https://fred.stlouisfed.org/series/PCEPILFE"]
    youtube: PCE 물가지수 연준 목표

  us_payrolls:
    name: 미국 고용보고서 (비농업고용·실업률)
    agency: 미 노동통계국 (BLS)
    freq: 매월 첫째 금요일
    what: |
      한 달 동안 농업 외 일자리가 몇 개 늘었나(비농업고용, NFP)와 실업률.
      **한 달에 한 번뿐인 가장 큰 지표**로 통한다. 시간당임금(YoY)도 같이 보는데,
      임금이 오르면 물가가 따라 오른다고 보기 때문이다.
    watch: 비농업고용 증감(천 명), 실업률(%), 시간당임금 전년비
    read:
      - {band: "신규고용 25만 이상", tone: hot,  mean: "경기가 뜨겁다 → 금리 인하가 멀어진다. 주식엔 '좋은 뉴스가 나쁜 뉴스'가 되는 구간"}
      - {band: "10만~25만", tone: cool, mean: "과열도 침체도 아닌 연착륙 구간. 시장이 가장 편안해한다"}
      - {band: "10만 미만 / 실업률 급등", tone: hot, mean: "경기 둔화 신호. 금리는 내려가지만 침체 공포로 주식이 같이 빠질 수 있다"}
      - {band: "시간당임금 YoY 4% 이상", tone: hot, mean: "임금발 물가 압력 — 연준이 가장 경계하는 숫자"}
    market: |
      고용이 '적당히 식는' 숫자를 시장은 가장 좋아한다. 너무 뜨거우면 금리 공포,
      너무 차가우면 침체 공포. **같은 방향이라도 정도에 따라 주식 반응이 뒤집힌다.**
    korea: 미 금리 경로를 통해 원달러·외국인 수급에 전달. 발표가 한국 새벽이라 월요일 시초가에 반영된다.
    links:
      - [BLS 고용상황 공식, "https://www.bls.gov/news.release/empsit.toc.htm"]
      - [FRED 비농업고용, "https://fred.stlouisfed.org/series/PAYEMS"]
    youtube: 미국 고용보고서 비농업고용 해석

  fomc:
    name: FOMC 금리 결정
    agency: 미 연방준비제도
    freq: 연 8회 (확정일은 연준이 미리 공표)
    what: |
      미국 기준금리를 정하는 회의. **발표문 문구 변화 → 기자회견 → 점도표** 순으로
      시장이 읽는다. 3·6·9·12월 회의에는 점도표(위원들이 생각하는 향후 금리 수준)가
      같이 나와서 더 중요하다.
    watch: 기준금리, 성명서 문구 변화, 점도표(분기), 파월 기자회견 톤
    read:
      - {band: "동결 + 성명서 완화", tone: cool, mean: "'다음은 인하' 기대 — 금리↓ 주식↑"}
      - {band: "동결 + 매파 발언", tone: hot,  mean: "'더 오래 높게' — 장기금리가 튀고 성장주가 아프다"}
      - {band: "점도표 상향", tone: hot,  mean: "연준이 보는 금리 경로가 올라갔다. 시장 기대와 벌어지면 충격이 크다"}
      - {band: "점도표 하향", tone: cool, mean: "인하 경로가 앞당겨진다 — 위험자산에 우호적"}
    market: |
      **결정 자체보다 '앞으로의 경로'가 가격을 움직인다.** 금리 인하·인상은 이미
      선물시장(FedWatch)에 확률로 반영돼 있어서, 놀라움이 없으면 숫자만으로는 안 움직인다.
    korea: 한미 금리차가 벌어지면 원화 약세·외국인 자금 이탈 압력. 금통위 판단에도 직접 영향.
    links:
      - [FOMC 일정·성명서, "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"]
      - [CME FedWatch (인하 확률), "https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html"]
    youtube: FOMC 점도표 보는 법

  us_ism:
    name: 미국 ISM 구매관리자지수 (PMI)
    agency: 공급관리협회 (ISM)
    freq: 매월 (제조업 1영업일 / 서비스업 3영업일)
    what: |
      구매 담당자들에게 "지난달보다 나아졌나"를 물어 만든 설문 지수.
      **50이 기준선** — 넘으면 확장, 밑이면 수축. 실제 생산 통계보다 빨리 나와서
      경기 방향을 먼저 알려주는 선행지표로 쓴다.
    watch: 종합지수(50 기준), 신규주문(가장 선행), 고용, 가격지불(물가 선행)
    read:
      - {band: "55 이상", tone: cool, mean: "확장 국면이 뚜렷하다. 경기민감주·소재에 우호적"}
      - {band: "50~55", tone: warm, mean: "완만한 확장. 방향이 더 중요하다 — 3개월 연속 하락이면 경계"}
      - {band: "48~50", tone: warm, mean: "수축이지만 얕다. 바닥을 다지는 구간일 수 있다"}
      - {band: "48 미만", tone: hot,  mean: "뚜렷한 수축. 침체 우려가 금리 인하 기대로 번진다"}
      - {band: "가격지불 60 이상", tone: hot, mean: "원가 압력 — 두세 달 뒤 소비자물가로 넘어온다"}
    market: 서비스업이 미국 경제의 7할이라 서비스 PMI가 제조업보다 지수 영향은 크다.
    korea: 한국은 수출국이라 **미국·중국 제조업 PMI가 수출 물량의 선행 신호**. 조선·기계·반도체와 직결.
    links:
      - [ISM 보고서, "https://www.ismworld.org/supply-management-news-and-reports/reports/ism-report-on-business/"]
    youtube: ISM PMI 50 기준선 해석

  us_retail:
    name: 미국 소매판매
    agency: 미 통계국 (Census)
    freq: 매월
    what: |
      미국 경제의 약 7할이 소비다. 그 소비가 지난달 대비 얼마나 늘었나(MoM).
      자동차·휘발유를 뺀 **근원 소매판매(control group)**가 GDP에 직접 들어가서 더 중요하다.
    watch: 전월비(MoM), control group
    read:
      - {band: "MoM +0.4% 이상", tone: warm, mean: "소비가 강하다 — 경기는 좋지만 물가 압력도 남는다"}
      - {band: "MoM -0.2% ~ +0.3%", tone: cool, mean: "완만한 소비. 연착륙 그림에 부합"}
      - {band: "MoM -0.3% 이하", tone: hot,  mean: "소비가 꺾인다 — 침체 논쟁이 다시 붙는다"}
    market: 소비가 식으면 금리 인하 기대는 커지지만 기업 이익 전망은 나빠진다 — 주식 방향은 둘의 힘겨루기.
    korea: 미국 소비는 한국 수출(IT·자동차·소비재)의 최종 수요. 둔화는 수출 기업 실적에 시차를 두고 반영.
    links:
      - [Census 소매판매, "https://www.census.gov/retail/index.html"]
    youtube: 미국 소매판매 지표 해석

  us_gdp:
    name: GDP (국내총생산)
    agency: 미 BEA / 한국은행
    freq: 분기 (속보 → 잠정 → 확정 3번 발표)
    what: |
      한 분기 동안 만들어진 부가가치의 총합. 미국은 **연율(annualized)**로 발표해서
      분기 성장률에 대략 4를 곱한 숫자가 나온다 — 한국식(전기비)과 단위가 달라 헷갈리기 쉽다.
    watch: 전기비 연율(미국) / 전기비(한국), 소비·설비투자 기여도
    read:
      - {band: "미국 연율 3% 이상", tone: warm, mean: "강한 성장. 금리를 높게 유지할 체력이 있다는 뜻"}
      - {band: "미국 연율 1.5~3%", tone: cool, mean: "추세 성장 근처 — 가장 무난한 구간"}
      - {band: "미국 연율 1% 미만", tone: hot, mean: "둔화. 2개 분기 연속 마이너스면 기술적 침체"}
    market: 속보치가 가장 크게 움직이고 잠정·확정은 거의 안 움직인다(이미 알려진 정보라서).
    korea: 한국 GDP는 수출 기여도를 같이 봐야 한다 — 내수가 약해도 수출이 끌면 숫자는 버틴다.
    links:
      - [BEA GDP, "https://www.bea.gov/data/gdp/gross-domestic-product"]
      - [한국은행 경제통계시스템, "https://ecos.bok.or.kr/"]
    youtube: GDP 연율 전기비 차이

  kr_cpi:
    name: 한국 소비자물가
    agency: 통계청
    freq: 매월 초 (전월치)
    what: 한국 물가. 한국은행 목표도 2%다. 근원(식료품·에너지 제외)과 생활물가를 같이 본다.
    watch: 전년비(YoY), 근원 YoY
    read:
