name: 컨센 fwd분기 소스 프로브 (일회용)

# 다음 분기(4Q26) 컨센 소스 탐색 — 러너 IP에서 후보 페이지/API를 덤프한다.
# 원인 파악 후 이 워크플로와 kospi_consensus/probe_fwd.py는 삭제할 것.
on:
  workflow_dispatch:
  push:
    branches: [claude/kospi200-consensus-tracking-qwoucl]
    paths: [kospi_consensus/probe_fwd.py]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: 프로브 실행
        working-directory: kospi_consensus
        run: python probe_fwd.py
