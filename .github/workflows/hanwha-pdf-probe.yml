name: 한경컨센서스 보관 범위 진단 (일회성)
on:
  push:
    branches: ["claude/sweet-hypatia-1ozbht"]
    paths: [".github/workflows/hanwha-pdf-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -q requests
      - run: |
          python - <<'PY'
          import re, requests, time
          from urllib.parse import quote
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'}
          s=requests.Session(); s.headers.update(UA)
          B='https://consensus.hankyung.com/analysis/list'
          def rows(sd,ed,broker=True,page=1):
              q=quote('한화투자증권') if broker else ''
              r=s.get(f'{B}?sdate={sd}&edate={ed}&search_value=&search_text={q}&order_type=&pagenum=80&now_page={page}',timeout=40)
              ds=re.findall(r'<td[^>]*>\s*(\d{4}-\d{2}-\d{2})\s*</td>',r.text)
              brokers=re.findall(r'<td[^>]*>\s*([^<]*증권[^<]*)\s*</td>',r.text)
              return ds, len(set(brokers))
          for m in range(1,13):
              sd=f'2016-{m:02d}-01'; ed=f'2016-{m:02d}-31' if m!=2 else '2016-02-29'
              ds,_=rows(sd,ed); time.sleep(0.4); print(f'2016-{m:02d}: 한화 rows={len(ds)} first={min(ds) if ds else "-"}')
          for name in ('한화증권','한화'):
              q=quote(name); r=s.get(f'{B}?sdate=2005-01-01&edate=2015-12-31&search_value=&search_text={q}&order_type=&pagenum=80&now_page=1',timeout=40)
              ds=re.findall(r'<td[^>]*>\s*(\d{4}-\d{2}-\d{2})\s*</td>',r.text); br=set(re.findall(r'<td[^>]*>\s*([^<]*증권[^<]*)\s*</td>',r.text))
              print(f'{name} 2005~2015: rows={len(ds)} range={min(ds) if ds else "-"}~{max(ds) if ds else "-"} brokers={sorted(br)[:8]}')
          PY
