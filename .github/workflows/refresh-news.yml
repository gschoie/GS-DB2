name: 뉴스 아카이브만 갱신

# 뉴스.아카이브만 다시 수집·반영하는 경량 워크플로.
# 전체 파이프라인(deploy-pages)과 달리 DAOL 톤·매크로·노조 재수집은 건너뛴다.
# (build_static 은 톤/매크로/노조를 '있으면 읽고 없으면 기본값'으로 처리하므로 안전)
on:
  workflow_dispatch:
    inputs:
      since_days:
        description: "재수집 일수 (기본 14 · 과거 답글 오염 정리 시 120 등으로 크게)"
        default: "14"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 뉴스DB 캐시 복원
        uses: actions/cache/restore@v5
        with:
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/macro.json
          key: newsdb2-${{ github.run_id }}
          # newsdb2-: 2026-07-30 캐시 오염 사고 후 새 네임스페이스. path 목록이 버전 해시라
          # 5개 워크플로 모두 동일해야 함(다르면 조용한 복원 미스).
          restore-keys: |
            newsdb2-

      - name: 노조 캐시 복원(읽기전용 · 노조는 안 건드림)
        uses: actions/cache/restore@v5
        with:
          path: |
            telegram_research_dashboard/data/hhiun_snapshot.json
            telegram_research_dashboard/data/hhiun_top.json
            telegram_research_dashboard/static/hhiun_board_report.html
          key: hhiun-${{ github.run_id }}
          restore-keys: |
            hhiun-

      - name: 파이프라인 계약 테스트
        working-directory: telegram_research_dashboard
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Python 패키지 준비
        run: python -m pip install requests beautifulsoup4 lxml

      - name: 공개 텔레그램 최신 글 수집 (뉴스)
        working-directory: telegram_research_dashboard
        # 날짜 기반 증분 수집(기본 2주 안전창). since_days 입력으로 과거까지 재수집 가능.
        run: python public_importer.py --channel https://t.me/HI_GS --pages 120 --since-days ${{ github.event.inputs.since_days || '14' }}

      # (제거) 전체 재분류: 새 메시지는 import 때 이미 완전 파싱됨 → 매 run 전체 재파싱은 낭비.

      - name: 링크 기사 제목 및 기업 보강
        working-directory: telegram_research_dashboard
        run: python enrich_link_news.py --limit 5000 --all

      - name: 내 코멘트 backfill 및 기사 제목 정리
        working-directory: telegram_research_dashboard
        run: python backfill_comments.py

      - name: 수동 기업 교정 적용
        working-directory: telegram_research_dashboard
        run: python apply_corrections.py

      - name: TP 보강 패키지 준비 (PDF·OCR)
        run: |
          python -m pip install -q pypdf pycryptodome pypdfium2 pytesseract
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor

      # 재수집이 최근 2주 보고서 행을 다시 만들며 TP 보강값을 지우므로 여기서 복원한다.
      - name: 보고서 TP 보강 (PDF 표지·OCR)
        working-directory: telegram_research_dashboard
        timeout-minutes: 20
        continue-on-error: true
        run: python enrich_report_tp.py --budget-seconds 300

      - name: 배포용 HTML 생성 (뉴스만 갱신 · 톤/매크로는 기존 데이터 유지)
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
          # 배포본 안전망 fetch가 Access 로그인 벽을 통과하기 위한 서비스 토큰(선택)
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python build_static.py

      - name: 배포 안전망 검사
        working-directory: telegram_research_dashboard
        run: python verify_static_output.py _site/index.html

      - name: 뉴스DB 캐시 저장
        uses: actions/cache/save@v5
        with:
          path: |
            telegram_research_dashboard/data/dashboard.db
            telegram_research_dashboard/data/daol_pdf_text_cache.json
            telegram_research_dashboard/data/macro.json
          key: newsdb2-${{ github.run_id }}

      - uses: actions/configure-pages@v6
        with:
          # 8/18 Unpublish로 사이트가 꺼져 있으면 자동으로 다시 켠다
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: telegram_research_dashboard/_site

      # 공유용 주소(https://gs-research-desk.github.io)에도 같은 산출물을 올린다 — GitHub 조직
      # `gs-research-desk` 의 Pages 리포(gs-research-desk/gs-research-desk.github.io) main 에 _site 를
      # 통째로 push(매번 orphan 커밋이라 이력이 안 쌓인다). 대시보드의 '새 창으로'·사이드바 새 탭
      # 링크·공유 허브(invest.html)가 전부 이 주소로 열려, 화면 공유 때 주소창에
      # gschoie.github.io/GS-DB2 와 사이드바가 보이지 않는다.
      # 시크릿 SHARE_DEPLOY_TOKEN(그 리포 Contents 쓰기 권한 PAT)이 없거나 실패해도
      # 본 GitHub Pages 배포는 그대로 간다(continue-on-error).
      # secrets 컨텍스트는 step `if` 에서 못 쓴다(워크플로 파일 자체가 거부돼 잡 0개로 실패 —
      # 10/19 실측) → 셸 스텝이 유무를 출력으로 바꿔 넘긴다.
      - name: 공유용 주소 토큰 확인
        id: share
        env:
          # 사용자가 등록한 시크릿 이름이 다를 수 있어 두 이름 중 있는 쪽을 쓴다
          SHARE_DEPLOY_TOKEN: ${{ secrets.SHARE_DEPLOY_TOKEN || secrets.SHARE_DEPLOY_2_GS_RESEARCH_DESK }}
        run: |
          if [ -n "$SHARE_DEPLOY_TOKEN" ]; then echo "on=1" >> "$GITHUB_OUTPUT"
          else echo "on=0" >> "$GITHUB_OUTPUT"; echo "::warning::SHARE_DEPLOY_TOKEN 시크릿 없음 — 공유용 주소 배포 생략"; fi
      - name: 공유용 주소 배포 (gs-research-desk.github.io)
        if: steps.share.outputs.on == '1'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SHARE_DEPLOY_TOKEN || secrets.SHARE_DEPLOY_2_GS_RESEARCH_DESK }}
          external_repository: gs-research-desk/gs-research-desk.github.io
          publish_branch: main
          publish_dir: telegram_research_dashboard/_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
