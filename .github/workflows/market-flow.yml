name: 시장 수급 동향

# 하루 4회(평일, KST): 10:00 / 13:00 / 15:40(마감 잠정) / 16:40(확정)
# NAVER 증권에서 KOSPI 투자자별·프로그램 수급을 수집 → 리포트 → 텔레그램(gs_macro_get)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1-5"    # 01:00 UTC = KST 10:00
    - cron: "0 4 * * 1-5"    # 04:00 UTC = KST 13:00
    - cron: "40 6 * * 1-5"   # 06:40 UTC = KST 15:40
    - cron: "40 7 * * 1-5"   # 07:40 UTC = KST 16:40

permissions:
  contents: write   # history.json·리포트 HTML 커밋 → deploy-pages(workflow_run) 재배포

concurrency:
  group: market-flow
  cancel-in-progress: false

jobs:
  # GAS 시계(gas/dispatch_proxy.gs의 tick)가 정시에 workflow_dispatch로 쏘고,
  # GitHub 크론은 안전망으로 남긴다. 크론이 뒤늦게 돌 때 같은 일을 두 번 하지
  # 않도록, **같은 슬롯 안에서** dispatch 실행이 이미 있었으면 이 예약 실행은 건너뛴다.
  # 슬롯 경계는 scrape.decide_slot과 같다(11:30 / 14:30 / 16:10 KST) — 단순 분 단위
  # 창으로 하면 몇 시간 늦은 크론이 다음 슬롯을 덮어써 수급 메시지가 두 번 간다.
  # 수동 버튼(dispatch)은 언제나 그대로 실행된다.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 같은 슬롯의 dispatch 실행 확인
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hm=$(TZ=Asia/Seoul date +%H%M)
          if   [ "$hm" -lt 1130 ]; then slot=1000; from="00:00"
          elif [ "$hm" -lt 1430 ]; then slot=1300; from="11:30"
          elif [ "$hm" -lt 1610 ]; then slot=1540; from="14:30"
          else                          slot=1640; from="16:10"
          fi
          since=$(TZ=Asia/Seoul date -u -d "today $from" +%Y-%m-%dT%H:%M)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/market-flow.yml/runs?event=workflow_dispatch&created=%3E${since}" \
                --jq '[.workflow_runs[] | select(.conclusion=="success" or .status=="in_progress" or .status=="queued")] | length' || echo 0)
          echo "슬롯 ${slot}(${from} KST~) 안의 dispatch 실행 ${n:-0}건"
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::GAS가 이 슬롯을 이미 처리했습니다 — 예약 실행은 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  snapshot:
    needs: guard
    if: ${{ always() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: market_flow
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 수급 스냅샷 수집 (휴장일이면 자동 생략)
        working-directory: market_flow
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scrape.py

      - name: 리포트 HTML 생성
        working-directory: market_flow
        run: python build_report.py

      - name: 텔레그램 발송 (gs_macro_get)
        working-directory: market_flow
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.market_flow_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.market_flow_TELEGRAM_CHAT_ID }}
        run: python telegram_send.py

      - name: 커밋 및 푸시 (→ Pages 재배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_flow/data telegram_research_dashboard/static/market_flow_report.html market_flow/telegram_status.json
          if git diff --cached --quiet; then
            echo "변경 없음(휴장일 등) — 커밋 생략"
          else
            git commit -m "chore(flow): 수급 스냅샷 $(TZ=Asia/Seoul date +%m-%d\ %H:%M)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
