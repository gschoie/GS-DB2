name: DAOL 톤만 갱신 및 배포

# 뉴스 파이프라인은 건드리지 않고 DAOL 리서치톤(build_daol_tone_dashboard.py)만
# 재수집·재빌드해서 배포한다. 수동 실행(Run workflow) 전용.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PDF 파싱 캐시만 복원한다. dashboard.db·daol_messages·tone은 커밋된 정상본을 그대로 쓴다
      # (캐시의 빈 DB로 덮어써서 리포트가 8건으로 떨어지는 문제 방지).
      - name: PDF 파싱 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            telegram_research_dashboard/data/daol_pdf_text_cache.json
          key: daol-pdf-cache-${{ github.run_id }}
          restore-keys: |
            daol-pdf-cache-
            dashboard-db-

      - name: Python 패키지 준비
        run: python -m pip install requests beautifulsoup4 lxml pycryptodome pypdf

      - name: DAOL 톤 데이터 갱신
        working-directory: telegram_research_dashboard
        run: python build_daol_tone_dashboard.py --refresh

      - name: 배포용 HTML 생성 (fresh, prebuilt 덮어쓰기 없음)
        working-directory: telegram_research_dashboard
        env:
          DASHBOARD_OUTPUT: _site/index.html
        run: python build_static.py

      - name: 배포 안전망 검사
        working-directory: telegram_research_dashboard
        run: python verify_static_output.py _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: telegram_research_dashboard/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
