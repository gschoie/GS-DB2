name: "[시험용] 매크로 수집 확인"
on:
  push:
    branches: [claude/macro-desk]
    paths: [".github/workflows/_probe-macro.yml", "macro_desk/collect.py", "macro_desk/config.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: 패키지
        working-directory: macro_desk
        run: pip install -r requirements.txt
      - name: 일정 테스트
        working-directory: macro_desk
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: 수집 (저장 안 함)
        working-directory: macro_desk
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python collect.py --dry-run > /tmp/out.txt 2>&1 || true
          cat /tmp/out.txt
          echo "=============== PAYLOAD ==============="
          python - <<'PY'
          import json, collect
          print(json.dumps(collect.collect(collect.load_config()), ensure_ascii=False))
          PY
