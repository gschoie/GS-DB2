ass=\"pmeta\">(조회 24411) <a href=\"https://gall.dcinside.com/mgallery/board/view/?id=krstock&amp;no=3689280&amp;page=1\" target=\"_blank\" rel=\"noopener\">원문<\/a><\/span><\/li><li><b>[국내주식갤러리]<\/b> 갤 ai 댓글 꼬라지보면 <span class=\"pmeta\">(조회 24398) <a href=\"https://gall.dcinside.com/mgallery/board/view/?id=krstock&amp;no=3689279&amp;page=1\" target=\"_blank\" rel=\"noopener\">원문<\/a><\/span><\/li><li><b>[국내주식갤러리]<\/b> 삼전7만원 가면 <span class=\"pmeta\">(조회 24394) <a href=\"https://gall.dcinside.com/mgallery/board/view/?id=krstock&amp;no=3689278&amp;page=1\" target=\"_blank\" rel=\"noopener\">원문<\/a><\/span><\/li><\/ul><\/div>", "2026-10-19": "<p class=\"oneliner\">글로벌 사회 불안과 지정학적 리스크가 고조되는 가운데, 국내 증시는 국민연금 손실로 인한 하방 압력에 직면했으며, AI/반도체 섹터는 변동성 속에서 장기 전망과 단기 과열 해소 사이의 줄다리기를 하고 있습니다.<\/p><p class=\"sub\">창 10-18 06:00~10-19 06:00 KST · 채널 47개 · 글 375건(중복 접은 뒤 349건) · Gemini(gemini-2.5-flash)<\/p><div class=\"card theme\"><div class=\"ctitle\">1. 글로벌 사회 불안 및 지정학적 리스크 고조 <span class=\"badge\">지속<\/span> <span class=\"dots\">●●●●●<\/span><\/div><p class=\"narr\">유럽 전역에서 생활비 상승에 대한 대규모 시위가 폭력 사태로 번지며 사회 불안이 심화되고 있으며, 프랑스 마크롱 대통령에 대한 비판 여론이 확산되고 있습니다. 동시에 우크라이나-러시아, 파키스탄-아프가니스탄 국경 분쟁 및 중동 지역의 긴장이 이어지며 지정학적 리스크가 시장에 부담을 주고 있습니다.<\/p><div class=\"kws\"><span class=\"kw\">시위<\/span><span class=\"kw\">마크롱<\/span><span class=\"kw\">분노<\/span><span class=\"kw\">시청<\/span><span class=\"kw\">청년들<\/span><span class=\"kw\">국경<\/span><span class=\"kw\">이란 외무장관<\/span><span class=\"kw\">상트페테르부르크<\/span><\/div><ul class=\"ev\"><li><b>미국 주식 인사이더 🇺🇸 (US Stocks Insider)<\/b> — “• 프랑스에서 생활비 상승에 항의하는 대규모 시위가 발생해 약 80만 명이 참여했다고 AFP가 보도. 학생들과 노란 조끼 시위대가 합류한 가운데 리옹에서는 관광안내소 건물에 화재가 발생. 마크롱 대통령은 폭력을 통한 정치적 요구 관철을 용납하지 않겠다고 강조하며 상점과 공공시설을 공격한 가담자들을 처벌하겠다고 밝혀.”<\/li><li><b>서화백의 AI놀이🚀<\/b> — “📝 우크라이나 장거리 드론이 러시아 상트페테르부르크 항구의 석유 터미널을 잇...”<\/li><li><b>이상헌 부장 iM 지주/ESG/중소형주<\/b> — “* 이란 외무 &quot;호르무즈 재개방, 美 선택에 달려…대화 문 열렸다&quot; - 아바스 아라그치 이란 외무장관은 17일(현지시간) 호르무즈 해협 재개방은 미국의 선택에 달려 있다고 강조했다.”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">2. 국내 증시 하방 압력 및 국민연금 손실 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●●●<\/span><\/div><p class=\"narr\">국민연금의 대규모 평가손실 소식이 국내 증시의 투자 심리를 크게 위축시키고 있으며, 코스피/코스닥의 급격한 하락세와 반대매매 증가로 전반적인 시장에 공포감이 팽배합니다. 이는 AI 산업의 자금 조달 리스크와 맞물려 시장의 하방 압력을 가중시키고 있습니다.<\/p><div class=\"kws\"><span class=\"kw\">국민연금<\/span><span class=\"kw\">조정될<\/span><\/div><ul class=\"ev\"><li><b>서화백의 AI놀이🚀<\/b> — “💡 요약 국민연금의 대규모 평가손실과 코스피/코스닥의 급격한 하락세로 인해 전반적인 투자 심리가 공포에 휩싸였으며, 반도체 업황 둔화 및 AI 산업의 자금 조달 리스크가 부각되고 있습니다.”<\/li><li><b>서화백의 AI놀이🚀<\/b> — “💡 요약 국민연금의 대규모 주식 손실과 AI 인프라 기업의 자금조달 부담, 지정학적 리스크가 시장을 압박하고 있습니다. 주요 기술주 및 가상자산 시장의 급락, 반대매매 증가 등으로 투자 심리가 위축되고 있습니다.”<\/li><li><b>서화백의 그림놀이 🚀<\/b> — “💡 요약 미국 증시 AI/반도체 매도세, 국민연금 대규모 손실, 증시의 금융 위기급 하락폭 등 전반적인 시장 하방 압력과 불안 심리가 팽배하며, 물가고 시위 등 거시 경제 불확실성이 가중되고 있습니다.”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">3. AI/반도체 섹터 변동성 및 전망 <span class=\"badge\">지속<\/span> <span class=\"dots\">●●●●○<\/span><\/div><p class=\"narr\">AI 인프라 및 HBM 투자 확대에 대한 강한 기대감이 존재하지만, AI 섹터의 과열 해소 과정이 진행될 가능성과 자금 조달 비용 상승으로 인한 인프라 프로젝트 지연 우려가 동시에 나타나고 있습니다. 일부에서는 DRAM 가격 상승폭 상향 조정 전망과 함께 반도체 시장의 잠재적 과잉 공급 우려도 제기되고 있습니다.<\/p><div class=\"kws\"><span class=\"kw\">AI<\/span><span class=\"kw\">반도체<\/span><span class=\"kw\">HBM<\/span><span class=\"kw\">메모리 공급<\/span><span class=\"kw\">조정될<\/span><span class=\"kw\">과잉<\/span><span class=\"kw\">딥시크<\/span><span class=\"kw\">다이<\/span><span class=\"kw\">배분<\/span><span class=\"kw\">진행될<\/span><\/div><ul class=\"ev\"><li><b>서화백의 AI놀이🚀<\/b> — “💡 요약 AI 인프라 및 HBM 투자 확대, 서버 시장 전망 상향 등 기술 섹터에 대한 강한 기대감이 존재하나, 국내 증시(코스피)의 급락과 국민연금 손실, 메모리 반도체 업황 둔화 우려, 지정학적 리스크가 시장에 부담으로 작용하고 있습니다.”<\/li><li><b>하나 중국/신흥국 전략 김경환<\/b> — “•GAM 인베스트먼트 매니지먼트의 취리히 소재 펀드매니저 제인 시 콜테시는 “자금조달 비용은 AI 호황을 억누르는 중력과 같음. 차입 비용이 상승하면 인프라 프로젝트의 자금조달이 어려워지고 자본지출이 지연됨. 단순히 일정이 연기되는 것만으로도 아시아 공급업체의 이익 전망과 밸류에이션이 하향 조정될 수 있음”이라고 밝힘”<\/li><li><b>서화백의 AI놀이🚀<\/b> — “- ASML: 고무적인 실적을 발표하며, 고객사들이 AI me\"><div class=\"ctitle\">1. 거시경제 - 美 CPI 상회 및 연준 매파 발언 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●●○<\/span><\/div><p class=\"narr\">미국의 10월 소비자물가지수(CPI)가 예상치를 웃돌고, 연준 월러 이사가 12월 50bp 금리 인상 가능성을 언급하며 시장의 금리 인상 우려가 재부각되었다. 이는 전반적인 투자 심리를 위축시키는 요인으로 작용하고 있다.<\/p><div class=\"kws\"><span class=\"kw\">월러 이사<\/span><span class=\"kw\">CPI 전월<\/span><\/div><ul class=\"ev\"><li><b>키움증권 전략/시황 한지영<\/b> — “미국의 10월 CPI는 전월비(MoM) 기준으로 헤드라인(0.4% vs 컨센 0.3%), 근원(0.3% vs 컨센 0.2%) 모두 예상보다 높았습니다.”<\/li><li><b>여의도스토리 Ver2.0-习近平是个狗东西<\/b> — “- 월러 연준 이사가 근원 CPI 0.3% 이상이면 12월 50bp 인상 검토가 필요하다고 밝혀 빅스텝 논쟁 부각”<\/li><li><b>[다올 매크로/투자전략] 조병현/박영찬/정현하/홍록은<\/b> — “-미국증시, 10월 CPI가 예상치 상회한 가운데 월러 연준 이사가 12월 빅스텝의 가능성을 언급하자 투자심리 위축, 3대 지수 하락 마감”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">2. AI/반도체 - IPO 흥행 및 인프라 투자 확대 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●●●<\/span><\/div><p class=\"narr\">AI 인프라 기업 CoreWeave의 견조한 실적 발표와 Anthropic의 IPO 공모 물량에 대한 수배 초과 청약 소식이 전해지며 AI 섹터에 대한 강한 시장의 기대감을 보여주고 있다. 이는 반도체 후공정 및 관련 설비 수요 확대로 이어지며 산업 전반의 성장을 견인할 것으로 전망된다.<\/p><div class=\"kws\"><span class=\"kw\">CoreWeave<\/span><span class=\"kw\">Anthropic IPO<\/span><span class=\"kw\">공모가<\/span><span class=\"kw\">배정<\/span><span class=\"kw\">후공정<\/span><span class=\"kw\">재계약<\/span><span class=\"kw\">높아지<\/span><\/div><ul class=\"ev\"><li><b>서화백의 AI놀이🚀<\/b> — “다만, CoreWeave와 OpenAI 같은 AI 관련 기업들의 견조한 실적 발표는 긍정적인 신호…”<\/li><li><b>[삼성 이영진] 글로벌 AI/SW<\/b> — “앤스로픽 IPO, 공모 물량 대비 수배 초과 청약 : 앤스로픽 IPO에 공모 가능 주식 수의 수배에 달하는 투자 주문이 접수된 것으로 알려짐.”<\/li><li><b>하나증권 리서치<\/b> — “또한 반도체 고객사의 신규 팹 투자와 HBM 후공정 유틸리티 설비 수요 확대를 근거로 2027년 매출액은 전년 대비 51% 증가한 4988억원, 영업이익은 205% 증가한 435억원으로 전망했습니다.”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">3. 개별 기업 실적 및 이슈 - 희비 엇갈린 발표 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●●○<\/span><\/div><p class=\"narr\">대한조선, 코스맥스, JYP Ent.는 시장 예상치를 상회하는 양호한 실적을 발표하며 긍정적인 반응을 얻었다. 반면 이마트, 시프트업, 실리콘투는 부진한 실적을 기록 function show(i) {
  idx = Math.max(0, Math.min(i, DATES.length - 1));
  document.getElementById("day").innerHTML = PAGES[DATES[idx]];
  sel.value = DATES[idx];
  prev.disabled = idx === 0;
  next.disabled = idx === DATES.length - 1;
}
prev.addEventListener("click", function () { show(idx - 1); });
next.addEventListener("click", function () { show(idx + 1); });
sel.addEventListener("change", function () { show(DATES.indexOf(sel.value)); });
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowLeft") show(idx - 1);
  else if (e.key === "ArrowRight") show(idx + 1);
});
show(idx);
</script>
</body></html>
