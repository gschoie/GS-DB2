# 시장관심.내러티브 설정. 튜닝할 때 손대는 파일은 여기 하나뿐이다.
#
# 급증 판정은 '최근 7일 평소 대비 배수'라서 매일 나오는 흔한 낱말은 기준선이 알아서
# 눌러 준다. 불용어 사전을 무한정 키울 필요는 없고, 조사·접속사류와 리서치 상투어만
# 막으면 된다. 소음이 눈에 띄면 stopwords에 한 줄 추가하는 것으로 충분하다.

window_hours: 24        # 하루 창 크기
window_anchor_kst: 6    # 창의 경계 시각 — 전일 06:00 ~ 당일 06:00 KST
min_chars: 25           # 링크를 뗀 뒤 이보다 짧은 글은 버린다
min_doc_count: 3        # 이보다 적게 언급된 낱말은 후보에서 제외
max_doc_share: 0.10     # 하루 글의 이 비율 넘게 등장하는 낱말은 상투어로 보고 자동 제외
max_msgs_per_chat: 400  # 채널당 하루 최대 수집 글 수
top_terms: 25           # LLM에 넘길 급증 키워드 수
top_posts: 15           # LLM에 넘길 전파 상위 글 수
excerpt_chars: 180      # 발췌 한 줄 길이

# 훑지 않을 방 (@아이디 또는 표시 이름). 잡담방·개인 알림방을 여기 적는다.
exclude_chats: []

# 커뮤니티 온도(community_naver.py) — 네이버 종목토론실.
# 감시 종목은 aliases의 종목코드 + 네이버 검색상위 30이 자동으로 들어가므로
# 평소엔 관리할 게 없다. 특정 종목을 더 보고 싶을 때만 extra_codes에 추가.
community:
  max_stocks: 80     # 감시 종목 상한
  max_pages: 5       # 종목당 게시판 페이지 상한 (페이지당 20글 — 대형주는 잘릴 수 있다)
  delay_sec: 0.3     # 페이지 사이 간격 (네이버 예의)
  extra_codes: []    # 예: [{"005490": POSCO홀딩스}]

# 커뮤니티 온도 2(community_dc.py) — DC인사이드 주식 갤러리.
# 갤러리 ID가 바뀌면(디시는 종종 바꾼다) 여기만 고치면 된다.
# minor: true 는 마이너 갤러리(mgallery 주소)라는 뜻.
community_dc:
  max_pages: 6       # 갤러리당 일반글 샘플 페이지 상한 (페이지당 ~50글)
  delay_sec: 0.5     # 페이지 사이 간격
  galleries:
    - id: stock_new2
      name: 주식갤러리
    - id: stockus
      name: 해외주식갤러리
      minor: true

# 걸리면 글 전체를 버리는 광고·리딩방 패턴(정규식). 과하게 잡으면 진짜 뉴스가
# 사라지므로 확실한 문구만 넣는다.
ad_patterns:
  - "무료\\s*체험"
  - "리딩방"
  - "수익\\s*보장"
  - "선착순\\s*모집"
  - "입장\\s*하기"
  - "VIP\\s*방"

# 별칭 접기 — 왼쪽 정식명으로 오른쪽 표기들을 합산한다. 종목코드·옛 이름·영문 표기를
# 묶어야 같은 얘기가 여러 낱말로 흩어져 급증을 놓치는 일이 없다.
# (조선·방산 목록은 source_watcher/sources.yml의 x_ship_keywords를 옮겨 온 것 —
#  YAML 앵커는 파일을 건너지 못해 복사했다. 그쪽을 고치면 여기도 맞출 것.)
aliases:
  HD현대중공업: [현대중공업, HD한국조선해양, 한국조선해양, 현대삼호, 현대미포, HD현대미포, "009540", "329180", "010620"]
  삼성중공업: ["010140"]
  한화오션: [대우조선해양, 대우조선, "042660"]
  HD현대마린엔진: [현대마린엔진, STX중공업]
  HD현대마린솔루션: [현대마린솔루션, "443060"]
  한화엔진: [HSD엔진, "082740"]
  한화에어로스페이스: [한화에어로, "012450"]
  한화시스템: ["272210"]
  한국항공우주: [KAI, "047810"]
  LIG넥스원: ["LIG D&A", "079550"]
  현대로템: ["064350"]
  삼성전자: [삼전, "005930"]
  SK하이닉스: [하이닉스, "000660"]
  현대차: [현대자동차, "005380"]
  엔비디아: [NVIDIA, NVDA]
  테슬라: [Tesla, TSLA]
  연준: [Fed, FOMC, 연방준비제도]
  트럼프: [Trump]

