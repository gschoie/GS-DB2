var PAGES = {"2026-09-20": "<p class=\"oneliner\">AI·반도체 및 암호화폐 강세 속 미·중 국빈회담과 중동 지정학적 리스크가 교차하는 하루<\/p><p class=\"sub\">창 09-19 06:00~09-20 06:00 KST · 채널 42개 · 글 374건(중복 접은 뒤 350건) · Gemini(gemini-flash-lite-latest)<\/p><div class=\"card theme\"><div class=\"ctitle\">1. 미·중 정상회담 및 무역 협상 기대감 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●●○<\/span><\/div><p class=\"narr\">시진핑 중국 국가주석의 방미를 앞두고 미·중 양국이 LNG 관세 인하와 300억 달러 규모 상품 상호 관세 인하를 논의 중이며, 빅테크 CEO들이 참석하는 국빈 만찬이 예정되어 시장의 기대를 모으고 있다.<\/p><div class=\"kws\"><span class=\"kw\">국빈<\/span><span class=\"kw\">대표단<\/span><span class=\"kw\">미국산<\/span><span class=\"kw\">희토류<\/span><\/div><ul class=\"ev\"><li><b>미국 주식 인사이더 🇺🇸 (US Stocks Insider)<\/b> — “• 시진핑 중국 국가주석은 9월 25일까지 사흘간 워싱턴을 국빈 방문할 예정. 트럼프 대통령과 시 주석 회담에서는 AI, 미·중 무역 휴전, 펜타닐, 희토류 및 수출통제 등이 주요 의제로 논의될 전망.”<\/li><li><b>하나 중국/신흥국 전략 김경환<\/b> — “•이날 저녁 트럼프 부부는 백악관 이스트룸에서 중국 대표단을 위한 국빈 만찬을 개최하며, 트럼프와 시진핑이 만찬 시작에 앞서 연설할 예정임.”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">2. 비트코인 8만불 탈환 및 암호화폐 관련주 강세 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●●○<\/span><\/div><p class=\"narr\">비트코인이 8만 달러선을 탈환하며 전고점 돌파 기대감이 재점화된 가운데, Strategy Inc.의 보유량 확대와 SEC의 블록체인 증권거래 &#x27;혁신 예외&#x27; 승인 등 제도화 진척이 관련주 매수세를 견인하고 있다.<\/p><div class=\"kws\"><span class=\"kw\">Strategy<\/span><span class=\"kw\">블록체인<\/span><span class=\"kw\">Robinhood<\/span><\/div><ul class=\"ev\"><li><b>연수르 해외주식<\/b> — “• MSTR (+16.39%): Bitcoin이 $80,000선을 탈환하며 전고점 돌파 기대감 재점화; Strategy Inc.의 BTC 보유량 약 845,050개...”<\/li><li><b>김현석(자본주의 바이어스 있는 채널입니다)<\/b> — “-SEC의 블록체인 증권거래 &quot;혁신 예외(Innovation Exemption)&quot; 승인 소식에 코인베이스 COIN(+6.55%)·로빈후드 HOOD(+5.94%) 등 핀테크·가상자산 관련주 강세”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">3. 반도체·AI 장비 수요 확대 및 설비투자 전망 상향 <span class=\"badge new\">NEW<\/span> <span class=\"dots\">●●●●○<\/span><\/div><p class=\"narr\">씨티(Citi)의 글로벌 반도체 장비 지출 전망 상향과 AI 메모리·HBM 수요의 구조적 성장 재확인에 힘입어 반도체 장비 및 스토리지 종목들이 강세를 보이고 있다.<\/p><div I 산업의 자금 조달 리스크와 맞물려 시장의 하방 압력을 가중시키고 있습니다.<\/p><div class=\"kws\"><span class=\"kw\">국민연금<\/span><span class=\"kw\">조정될<\/span><\/div><ul class=\"ev\"><li><b>서화백의 AI놀이🚀<\/b> — “💡 요약 국민연금의 대규모 평가손실과 코스피/코스닥의 급격한 하락세로 인해 전반적인 투자 심리가 공포에 휩싸였으며, 반도체 업황 둔화 및 AI 산업의 자금 조달 리스크가 부각되고 있습니다.”<\/li><li><b>서화백의 AI놀이🚀<\/b> — “💡 요약 국민연금의 대규모 주식 손실과 AI 인프라 기업의 자금조달 부담, 지정학적 리스크가 시장을 압박하고 있습니다. 주요 기술주 및 가상자산 시장의 급락, 반대매매 증가 등으로 투자 심리가 위축되고 있습니다.”<\/li><li><b>서화백의 그림놀이 🚀<\/b> — “💡 요약 미국 증시 AI/반도체 매도세, 국민연금 대규모 손실, 증시의 금융 위기급 하락폭 등 전반적인 시장 하방 압력과 불안 심리가 팽배하며, 물가고 시위 등 거시 경제 불확실성이 가중되고 있습니다.”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">3. AI/반도체 섹터 변동성 및 전망 <span class=\"badge\">지속<\/span> <span class=\"dots\">●●●●○<\/span><\/div><p class=\"narr\">AI 인프라 및 HBM 투자 확대에 대한 강한 기대감이 존재하지만, AI 섹터의 과열 해소 과정이 진행될 가능성과 자금 조달 비용 상승으로 인한 인프라 프로젝트 지연 우려가 동시에 나타나고 있습니다. 일부에서는 DRAM 가격 상승폭 상향 조정 전망과 함께 반도체 시장의 잠재적 과잉 공급 우려도 제기되고 있습니다.<\/p><div class=\"kws\"><span class=\"kw\">AI<\/span><span class=\"kw\">반도체<\/span><span class=\"kw\">HBM<\/span><span class=\"kw\">메모리 공급<\/span><span class=\"kw\">조정될<\/span><span class=\"kw\">과잉<\/span><span class=\"kw\">딥시크<\/span><span class=\"kw\">다이<\/span><span class=\"kw\">배분<\/span><span class=\"kw\">진행될<\/span><\/div><ul class=\"ev\"><li><b>서화백의 AI놀이🚀<\/b> — “💡 요약 AI 인프라 및 HBM 투자 확대, 서버 시장 전망 상향 등 기술 섹터에 대한 강한 기대감이 존재하나, 국내 증시(코스피)의 급락과 국민연금 손실, 메모리 반도체 업황 둔화 우려, 지정학적 리스크가 시장에 부담으로 작용하고 있습니다.”<\/li><li><b>하나 중국/신흥국 전략 김경환<\/b> — “•GAM 인베스트먼트 매니지먼트의 취리히 소재 펀드매니저 제인 시 콜테시는 “자금조달 비용은 AI 호황을 억누르는 중력과 같음. 차입 비용이 상승하면 인프라 프로젝트의 자금조달이 어려워지고 자본지출이 지연됨. 단순히 일정이 연기되는 것만으로도 아시아 공급업체의 이익 전망과 밸류에이션이 하향 조정될 수 있음”이라고 밝힘”<\/li><li><b>서화백의 AI놀이🚀<\/b> — “- ASML: 고무적인 실적을 발표하며, 고객사들이 AI 관련 투자를 중심으로 장비 수요를 늘리고 있다고 밝혔습니다. 하지만 2028년 생산 능력을 대폭 늘릴 계획은 반도체 시장의 잠재적 과잉 공급 우려를 낳았습니다.”<\/li><\/ul><\/div><div class=\"card theme\"><div class=\"ctitle\">4. 글로벌 경제 지표 및 기업 실적 발표 집중 <span class=\"badge\">지속<\/span> <span class=\"dots\">●●●○○<\/span><\/div><p class=\"narr
