name: ChatGPT 방산 브리핑

# 방산 브리핑 RSS판(3탄) — 수집은 러너, 작성은 Claude 예약 세션 (건설기계와 동일 구조).
# 매일 아침 이 워크플로가 yfinance 확정 시세 + 구글뉴스 RSS(24h)를 수집해
# chatgpt_briefing/inputs/<날짜>.json 으로 main에 커밋하면, Claude 예약 세션이
# 그 inputs 를 근거로 브리핑을 작성해 발행한다(claude-brief-ingest 가 main 반영+텔레 발송).
# OpenAI API 자동 작성은 유료라 쓰지 않기로 함(2026-09-17) — 봇의 --api 경로로만 남김.
#
# 수동 입력 경로 두 가지는 수집·세션 작성보다 우선한다(진짜 ChatGPT 앱 산출물 등록용):
#   1. 대시보드 chatgpt_defense_report.html 의 ✍️ 폼 → GAS dispatch_proxy(gptbrief)
#      → workflow_dispatch inputs.content → 즉시 발행 + 텔레그램
#   2. chatgpt_briefing/inbox/YYYY-MM-DD.md 를 main에 커밋 (push 트리거)
#      — workflow_dispatch의 문자열 입력칸은 한 줄짜리라 여러 줄 md가 뭉개지므로
#        수동 등록은 파일 커밋으로 한다. 처리 후 inbox 파일은 지워서 재실행을 막는다.
# 텔레그램: 방산 텔레는 통합본 한 통만 방산 채널로 나간다(claude-brief-ingest
# 담당, 2026-09-17 변경) — RSS판 개별 발송은 중복이라 이 워크플로에 없음.

on:
  workflow_dispatch:
    inputs:
      content:
        description: "브리핑 마크다운 본문 (대시보드 폼이 채움 — 비우면 수집만 수행)"
        type: string
        required: false
        default: ""
      date:
        description: "브리핑 날짜 YYYY-MM-DD (비우면 오늘 KST)"
        type: string
        required: false
        default: ""
  schedule:
    # UTC 20:05 = KST 05:05 — 미장 마감 직후로 앞당김(2026-09-18, 통합본 06시 완성 목표).
    # 제미나이 방산(20:00)과 5분 오프셋. 지연 시 세션이 05:25경 수동 트리거로 보완.
    - cron: "5 20 * * *"
  push:
    branches: ["main"]
    paths: ["chatgpt_briefing/inbox/*.md"]

permissions:
  contents: write

concurrency:
  group: chatgpt-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r defense_briefing/requirements.txt

      - name: 수집 또는 수동 발행
        working-directory: defense_briefing
        env:
          # 셸 인자 대신 환경변수로 — 본문에 따옴표·백틱이 있어도 안전하다.
          CONTENT: ${{ inputs.content }}
          DATE: ${{ inputs.date }}
        run: python chatgpt_briefing_bot.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 수집 실행에서는 chatgpt_defense 디렉터리가 아직 없을 수 있다 — 있는 것만 add
          if [ -d telegram_research_dashboard/static/chatgpt_defense ]; then
            git add telegram_research_dashboard/static/chatgpt_defense
          fi
          git add telegram_research_dashboard/static/chatgpt_defense_report.html
          git add -A chatgpt_briefing/inbox chatgpt_briefing/inputs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(gptbrief): RSS판 수집/발행 $(TZ=Asia/Seoul date +%F)"
            ok=""
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              sleep $((i * 5))
            done
            [ -n "$ok" ] || exit 1
          fi
