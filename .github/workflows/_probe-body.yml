name: (임시) 리서치요약 본문 형식 프로브

# 낱개 '[✨ 리서치 요약]' 글 본문에서 실제 리포트 제목이 어떤 줄에 있는지 확인하는
# 일회용 프로브. 확인이 끝나면 지운다.
on:
  push:
    branches: [claude/telegram-shipbuilding-alerts-xznnl4]
    paths: [.github/workflows/_probe-body.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: telethon 설치
        run: pip -q install telethon

      - name: 계정 세션 복호화
        env:
          SESSION_PASSPHRASE: ${{ secrets.SESSION_PASSPHRASE }}
        run: |
          VALUE=$(openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -d \
            -in source_watcher/state/session.enc -pass env:SESSION_PASSPHRASE)
          echo "::add-mask::$VALUE"
          echo "TELEGRAM_SESSION_STRING=$VALUE" >> "$GITHUB_ENV"

      - name: 요약 글 본문 앞 12줄 출력
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python - <<'PY'
          import asyncio, os, sys
          sys.path.insert(0, "source_watcher")
          from adapters import DEVICE_INFO, _account_session

          async def main():
              from telethon import TelegramClient
              client = TelegramClient(_account_session(),
                                      int(os.environ["TELEGRAM_API_ID"]),
                                      os.environ["TELEGRAM_API_HASH"], **DEVICE_INFO)
              await client.connect()
              try:
                  entity = await client.get_entity("ked_epic_ai")
                  shown = 0
                  async for m in client.iter_messages(entity, limit=120):
                      text = (m.message or "")
                      first = text.splitlines()[0] if text.strip() else ""
                      if "리서치 요약" not in first:
                          continue
                      print(f"===== msg {m.id} =====")
                      for line in text.splitlines()[:12]:
                          print(f"| {line}")
                      shown += 1
                      if shown >= 4:
                          break
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY
