name: ETF 신호 백테스트

# 수동 실행 전용. 신호 유형별 사후 성과(D+5·D+20)를 재고 결과를 커밋한다.
# 정기 실행은 하지 않는다 — 과거 데이터라 매일 돌 이유가 없고 API 호출도 크다.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "수집 범위(달력일). 1100 ≈ 3년"
        required: false
        default: "1100"

permissions:
  contents: write

concurrency:
  group: etf-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: etf_signal
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 백테스트 실행
        working-directory: etf_signal
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          BT_DAYS: ${{ inputs.days }}
        run: python backtest.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add etf_signal/backtest_result.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(etf): 신호 백테스트 결과 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
