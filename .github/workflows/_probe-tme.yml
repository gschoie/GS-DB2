name: (임시) t.me 주소 프로브

# ked_epic_ai_summary 주소가 텔레그램에 실존하는지 러너에서 확인하는 일회용 프로브.
# 확인이 끝나면 이 파일은 지운다.
on:
  push:
    branches: [claude/telegram-shipbuilding-alerts-xznnl4]
    paths: [.github/workflows/_probe-tme.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: t.me 페이지 확인
        run: |
          for name in ked_epic_ai_summary ked_epic_ai; do
            echo "===== https://t.me/$name ====="
            curl -sL "https://t.me/$name" | grep -oE '<meta property="og:(title|description)" content="[^"]*"' | head -4 || true
            curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://t.me/$name"
            echo "===== https://t.me/s/$name (웹 미리보기) ====="
            curl -s -o /dev/null -w "HTTP %{http_code} (redirect: %{redirect_url})\n" "https://t.me/s/$name"
          done
