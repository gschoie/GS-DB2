name: ETF 섹터 신호

# 매일 한국시간 오전 10시: 49개 ETF 스캔 → HTML 신호판 + 텔레그램 알림 → 배포
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 한국 10:00

permissions:
  contents: write   # 갱신된 신호판 HTML 커밋/푸시 → deploy-pages 트리거

concurrency:
  group: etf-signal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        working-directory: etf_signal
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 49개 ETF 스캔
        working-directory: etf_signal
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python etf_signal.py

      - name: HTML 신호판 생성 (대시보드 static)
        working-directory: etf_signal
        env:
          ETF_REPORT_OUT: ../telegram_research_dashboard/static/etf_signal_report.html
        run: python build_report.py

      - name: 텔레그램 알림 (새 신호 있을 때만)
        working-directory: etf_signal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python etf_telegram.py

      - name: 신호판 커밋 및 푸시 (→ Pages 재배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_research_dashboard/static/etf_signal_report.html etf_signal/signals.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(etf): 신호 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
