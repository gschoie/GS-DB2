name: 한경컨센서스 보관 범위 진단 (일회성)
on:
  push:
    branches: ["claude/sweet-hypatia-1ozbht"]
    paths: [".github/workflows/hanwha-pdf-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -q requests
      - run: |
          python - <<'PY'
          import re, requests, time
          from urllib.parse import quote
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'}
          s=requests.Session(); s.headers.update(UA)
          B='https://consensus.hankyung.com/analysis/list'
          def rows(sd,ed,broker=True,page=1):
              q=quote('한화투자증권') if broker else ''
              r=s.get(f'{B}?sdate={sd}&edate={ed}&search_value=&search_text={q}&order_type=&pagenum=80&now_page={page}',timeout=40)
              ds=re.findall(r'<td[^>]*>\s*(\d{4}-\d{2}-\d{2})\s*</td>',r.text)
              brokers=re.findall(r'<td[^>]*>\s*([^<]*증권[^<]*)\s*</td>',r.text)
              return ds, len(set(brokers))
          for y in range(2000,2026):
              ds,_=rows(f'{y}-01-01',f'{y}-12-31'); time.sleep(0.4)
              ds_all,nb=rows(f'{y}-01-01',f'{y}-12-31',broker=False); time.sleep(0.4)
              print(f'{y}: 한화 rows(page1)={len(ds)} range={min(ds) if ds else "-"}~{max(ds) if ds else "-"} | 전체 rows(page1)={len(ds_all)} range={min(ds_all) if ds_all else "-"}~{max(ds_all) if ds_all else "-"} brokers_on_page={nb}')
          # 한화 가장 오래된 해: 월별로 좁혀 최초 날짜
          PY
