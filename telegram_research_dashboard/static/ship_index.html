<!DOCTYPE html>
<!--
  조선주 상대 INDEX — peer_price.html 과 같은 틀(파일 목록만 다름). 원본:
  ecos-fx-rates peergroup/weekly_peer_index_image.py (같은 Actions 가 굽는다).
  피어그룹 주가흐름표 — ecos-fx-rates 리포의 Actions('피어그룹 주가 흐름 이미지')가 굽는
  PNG/SVG 를 대시보드 안에서 한 창에 모아 보고 그림마다 내려받는 갤러리. 파일 자체는 그 리포
  output/peer_price/ 에 있고(raw.githubusercontent — Content-Type image/svg+xml, CORS * 실측 11/7),
  여기는 미리보기 + 다운로드 버튼만 둔다 — GitHub 파일 페이지로 나가지 않게(사용자 "github로만 가는데",
  "html 로 여러 이미지들이 뜨는 창을 하나 만들자").
  SVG 는 벡터라 엑셀·PPT '삽입 → 그림' 으로 넣으면 확대해도 선명하다(복사·붙여넣기는 비트맵).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주가 INDEX 비교 — GS Research Desk</title>
<style>
:root{--bg:#fff;--fg:#1c2430;--muted:#6b7684;--line:#e5e8ec;--card:#f7f8fa;--accent:#a68a64;--btn:#1f2937}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e6e9ee;--muted:#8b93a1;--line:#2a313c;--card:#1b212b;--btn:#e6e9ee}}
*{box-sizing:border-box}
body{margin:0;padding:18px 16px 48px;background:var(--bg);color:var(--fg);font:14px/1.6 "나눔스퀘어OTF Light","NanumSquareOTF Light","NanumSquare OTF Light","나눔스퀘어 Light","NanumSquare Light","나눔스퀘어OTF","NanumSquareOTF","NanumSquare",-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
/* 보고서 서체 나눔스퀘어OTF Light — 설치된 PC 만 적용, 없으면 맑은고딕 폴백 */
button,a.btn{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.note{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.7}
.note a{color:inherit}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.jump a{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;background:var(--card)}
.card{border:1px solid var(--line);border-radius:8px;margin:0 0 18px;background:var(--card);overflow:hidden}
.card .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.card .hd h2{font-size:14px;margin:0 auto 0 0}
.card .hd small{color:var(--muted);font-size:11.5px;margin-left:8px;font-weight:400}
button,a.btn{font:600 12.5px inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;text-decoration:none}
button.p{background:var(--btn);color:var(--bg);border-color:var(--btn)}
button:disabled{opacity:.5;cursor:wait}
.card .im{background:#fff;padding:6px}
.card.main{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
details.card>summary{list-style:none;cursor:pointer;user-select:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .tog{font-size:12px;color:var(--muted);white-space:nowrap}
details.card[open]>summary .tog::before{content:"▲ 접기"}
details.card:not([open])>summary .tog::before{content:"▼ 펼치기"}
.card .hd.tools{border-bottom:0;padding-top:6px;justify-content:flex-end}
.card img{display:block;width:100%;height:auto}
.err{color:#b45309;font-size:12px;padding:0 12px 8px}
#stamp{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h1">📉 조선주 상대 INDEX</h1>
  <p class="sub"><span id="subtxt"></span> <span id="stamp"></span></p>
  <div class="jump" id="utabs" style="margin-bottom:10px"></div>
  <p class="note"><b>📋 복사</b> 후 위클리(워드·PPT)에 바로 <b>Ctrl+V</b>(비트맵). 엑셀·PPT 에 확대해도 선명하게 넣으려면 <b>SVG</b> 를 내려받아 <b>삽입 → 그림 → 이 디바이스</b> 로 넣으면 확대해도 선명하다(화면에서 복사·붙여넣기는 비트맵이 되어 흐려짐). 매일 07:10 KST 자동 갱신 + 아래 <b>🔄 지금 갱신</b>(야후 수집 → 엑셀·그림 전부, 2~3분 뒤 자동 새로고침). 기준일·계산 기준은 그림 하단 각주.</p>
<div class="bar" style="display:flex;gap:10px;align-items:center;margin:0 0 14px"><button class="p" id="refresh">🔄 지금 갱신</button><span id="rstatus" class="note" style="margin:0"></span></div>
  <div class="jump" id="jump"></div>
  <div id="cards"></div>
</div>
<script>
(function(){
  // 유니버스 2종 — 생성기는 ecos-fx-rates peergroup/weekly_peer_index_image.py(조선)·weekly_defense_index_image.py(방산),
  // 같은 워크플로가 둘 다 굽는다. ?u=ship|defense 로 고른다(peer_price.html 과 같은 방식). 파일명은 생성기 OUT_ALL/OUT_ONE 과 일치해야 한다.
  const UNIVERSES={
    ship:{tab:"🚢 조선",h1:"📉 조선주 상대 INDEX",dir:"peer_price",
      sub:"KOSPI vs 조선주 · 한국 조선 7사 Performance · 한/중/일/싱 조선주 비교 · 조선 5사 vs 엔진 vs 조선기자재 — 12주(60거래일) 전 = 100, 국가·밸류체인 지수는 기준일 USD 시총 가중.",
      files:[
      ["조선주 INDEX 4종 (2×2 묶음)","PPT 한 장용 — ①②③④ + 각주(맨 아래)","조선주_INDEX_4종"],
      ["① 한국 주식시장 vs 조선주","KOSPI vs 한국 조선주(시총가중)","IDX1_한국시장_vs_조선주"],
      ["② 한국 조선 7사 Performance","HD현대중공업·HD한국조선해양·삼성중공업·한화오션·대한조선·한화엔진·HD현대마린엔진","IDX2_한국조선_Performance"],
      ["③ 한/중/일/싱 조선주 비교","국가별 시총가중 지수 (한국 7·중국 3·일본 6·싱가포르 1)","IDX3_한중일싱_조선주"],
      ["④ 조선 5사 vs 엔진 vs 조선기자재","국내 밸류체인 3단 시총가중 지수 — 조선 4사+대한조선 · 엔진 3사(한화엔진·HD현대마린엔진·STX엔진) · 기자재 20사","IDX4_조선_엔진_기자재"]]},
    defense:{tab:"🛡️ 방산",h1:"📉 방산 상대 INDEX",dir:"peer_price_defense",
      sub:"한국 방산 체계 5사 · 부체계(부품) 11사 Performance · 한국 체계/부체계 vs 미국 체계 vs 유럽 체계 · 드론/엔진·부품/항공/우주(글로벌) — 12주(60거래일) 전 = 100, 묶음 지수는 기준일 USD 시총 가중.",
      files:[
      ["방산 INDEX 4종 (2×2 묶음)","PPT 한 장용 — ①②③④ + 각주(맨 아래)","방산_INDEX_4종"],
      ["① 한국 방산 체계 5사 Performance","한화에어로스페이스·한국항공우주·LIG D&A·한화시스템·현대로템","DIDX1_한국체계5사"],
      ["② 한국 방산 부체계(부품) Performance","풍산·SNT다이내믹스·엠앤씨솔루션·아이쓰리시스템·퍼스텍·휴니드·빅텍·코츠테크놀로지·한일단조·삼영컴텍·웨이브일렉트로닉스","DIDX2_한국부체계"],
      ["③ 한국 체계·부체계 vs 미국 체계 vs 유럽 체계","시총가중 — 미국 체계 7(LMT·RTX·NOC·GD·LHX·BA·HII) · 유럽 체계 8(Rheinmetall·BAE·Thales·Leonardo·Saab·Hensoldt·Renk·Kongsberg)","DIDX3_한국vs미국유럽"],
      ["④ 드론 · 엔진/부품 · 항공 · 우주 (글로벌)","시총가중 — 드론(Kratos·AeroVironment) · 엔진/부품(GE·Howmet·TransDigm·Curtiss-Wright·RR·Safran·MTU) · 항공(Airbus·Dassault·Embraer) · 우주 15(Rocket Lab·AST SpaceMobile·Iridium·Viasat·Planet·Redwire·OHB·ispace 등)","DIDX4_드론_엔진_항공"]]},
    construction:{tab:"🏗️ 기계",h1:"📉 건설기계 상대 INDEX",dir:"peer_price_construction",
      sub:"HD건설기계·두산밥캣·한국 부품사 · 한국 2사 vs 미국·중국·일본 피어 · 대형 OEM 8 · 소형/농기계 4 — 12주(60거래일) 전 = 100, 묶음 지수는 기준일 USD 시총 가중.",
      files:[
      ["건설기계 INDEX 4종 (2×2 묶음)","PPT 한 장용 — ①②③④ + 각주(맨 아래)","건설기계_INDEX_4종"],
      ["① HD건설기계 · 두산밥캣 · 한국 건기 부품사","부품사 6(디와이파워·진성티이씨·대창단조·동일금속·흥국·우림피티에스)는 시총가중 지수","CIDX1_한국2사_부품"],
      ["② 한국 2사 vs 미국 · 중국 · 일본 피어","시총가중 — 미국(CAT·Terex·Oshkosh·Manitowoc) · 중국(SANY·XCMG·Zoomlion·LiuGong·Lonking) · 일본(Komatsu·Hitachi CM·Kubota·SHI·Takeuchi·Tadano)","CIDX2_한국vs미중일"],
      ["③ 대형 OEM — HD건설기계 · CAT · Komatsu · Hitachi CM · SANY · XCMG · Zoomlion · LiuGong","중국은 SANY 만 실선, 나머지 점선","CIDX3_대형OEM"],
      ["④ 소형·농기계 — 두산밥캣 · Deere · CNH · Kobelco · 대동","Kobelco 는 건설기계 자회사 비상장이라 모회사 Kobe Steel 주가","CIDX4_소형_농기계"]]},
  };
  const uname=(new URLSearchParams(location.search).get("u")||"ship").toLowerCase();
  const U=UNIVERSES[uname]||UNIVERSES.ship;
  const RAW="https://raw.githubusercontent.com/gschoie/ecos-fx-rates/main/output/"+U.dir+"/";
  const FILES=U.files;
  document.getElementById("h1").textContent=U.h1;document.title=U.h1.replace(/^📉 /,"")+" — GS Research Desk";
  document.getElementById("subtxt").textContent=U.sub;
  {const t=document.getElementById("utabs");Object.entries(UNIVERSES).forEach(([k,u])=>{const a=document.createElement("a");a.href="?u="+k;a.textContent=u.tab;
    if(u===U){a.style.fontWeight="700";a.style.textDecoration="underline"}t.appendChild(a)})}
  const bust="?t="+Math.floor(Date.now()/600000);   // 10분 단위 캐시 버스트
  const url=(f,ext)=>RAW+encodeURIComponent(f)+"."+ext+bust;
  const cards=document.getElementById("cards"),jump=document.getElementById("jump");
  const canCopy=!!(navigator.clipboard&&window.ClipboardItem);   // 클립보드는 PNG 만 표준 — 복사 = PNG, 벡터는 SVG 내려받기
  FILES.forEach(([title,desc,f],i)=>{
    const j=document.createElement("a");j.href="#img"+i;j.textContent=title;jump.appendChild(j);
    const tools=`${canCopy?`<button class="p" data-f="${f}" data-act="copy">📋 복사</button>`:""}<button class="p" data-f="${f}" data-ext="svg">⬇ SVG</button><button data-f="${f}" data-ext="png">⬇ PNG</button>
        <a class="btn" href="${url(f,"svg")}" target="_blank" rel="noopener">새 창</a>`;
    const body=`<div class="im"><img src="${url(f,"png")}" alt="${title}" loading="lazy"></div><div class="err"></div>`;
    const h2=`<h2>${title}${desc?`<small>${desc}</small>`:""}</h2>`;
    const main=i===0;   // 묶음이 메인(펼침), 낱장은 접힘 — 버튼은 summary 밖(summary 안 버튼은 클릭마다 접힘이 토글된다)
    const c=document.createElement(main?"section":"details");c.className="card"+(main?" main":"");c.id="img"+i;
    c.innerHTML=main?`<div class="hd">${h2}${tools}</div>${body}`
      :`<summary class="hd">${h2}<span class="tog"></span></summary><div class="hd tools">${tools}</div>${body}`;
    c.querySelector("img").onerror=function(){c.querySelector(".err").textContent="그림을 불러오지 못했습니다 — Actions 가 아직 한 번도 돌지 않았거나 파일명이 바뀌었을 수 있습니다."};
    cards.appendChild(c);
  });
  const openHash=()=>{const d=location.hash&&document.querySelector(location.hash);if(d&&d.tagName==="DETAILS")d.open=true};
  window.addEventListener("hashchange",openHash);openHash();
  document.addEventListener("click",async e=>{
    const j=e.target.closest(".jump a");if(j){const d=document.querySelector(j.getAttribute("href"));if(d&&d.tagName==="DETAILS")d.open=true;return}
    const b=e.target.closest("button[data-f]");if(!b)return;
    const f=b.dataset.f,copy=b.dataset.act==="copy",ext=copy?"png":b.dataset.ext,err=b.closest(".card").querySelector(".err");b.disabled=true;err.textContent="";
    const getBlob=async()=>{const r=await fetch(url(f,ext),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.blob()};
    try{
      if(copy){   // blob Promise 를 그대로 넘겨야 사파리가 사용자 제스처로 인정한다
        await navigator.clipboard.write([new ClipboardItem({"image/png":getBlob().then(x=>new Blob([x],{type:"image/png"}))})]);
        err.style.color="#15803d";err.textContent="✓ 복사됨 — 워드·PPT·카톡에 Ctrl+V";setTimeout(()=>{err.textContent="";err.style.color=""},4000);
      }else{const blob=await getBlob(),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f+"."+ext;
        document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
    }catch(x){err.style.color="";err.textContent=(copy?"복사 실패: ":"다운로드 실패: ")+x.message+" — '새 창' 에서 우클릭으로 복사·저장하세요."}
    finally{b.disabled=false}
  });
  const EP="https://script.google.com/macros/s/AKfycbx3RjIjtlO2Z6fIYo2T3LhJrFg9Wp2hS7dMS3Is52-JVF1hizoCWewbQ1uM_v5sdhR2jw/exec";  // app.js DISPATCH_ENDPOINT 와 같은 GAS
  const lastMod=async()=>{try{const r=await fetch(RAW+encodeURIComponent(FILES[0][2])+".png?x="+Date.now(),{method:"HEAD",cache:"no-store"});return r.headers.get("last-modified")||""}catch{return ""}};
  document.getElementById("refresh").onclick=async function(){
    const b=this,st=document.getElementById("rstatus");b.disabled=true;st.textContent="요청 중…";
    const before=await lastMod();
    try{const r=await fetch(EP,{method:"POST",body:JSON.stringify({workflow:"peer"})});let d=null;try{d=await r.json()}catch{}
      if(d&&d.ok===false){st.textContent=`⚠ 거절 ${d.code||"?"} — ${d.error||"GAS 프록시 확인"}`;b.disabled=false;return}
    }catch(x){st.textContent="실패: "+x.message;b.disabled=false;return}
    const t0=Date.now();
    const tick=async()=>{const m=Math.round((Date.now()-t0)/60000);const now=await lastMod();
      if(now&&now!==before){st.textContent="갱신됨 — 새로고침";location.reload();return}
      if(Date.now()-t0>12*60000){st.textContent="12분 안에 새 파일이 안 보입니다 — ecos-fx-rates Actions 를 확인하세요";b.disabled=false;return}
      st.textContent=`✅ 요청됨 — 수집·커밋 대기 중 ${m}분 경과`;setTimeout(tick,30000)};
    setTimeout(tick,60000);
  };
  // 파일 갱신 시각(raw 의 Last-Modified) — 못 읽으면 조용히 생략
  fetch(url(FILES[0][2],"png"),{method:"HEAD",cache:"no-store"}).then(r=>{const lm=r.headers.get("last-modified");
    if(lm)document.getElementById("stamp").textContent="파일 갱신: "+new Date(lm).toLocaleString("ko-KR",{timeZone:"Asia/Seoul"})}).catch(()=>{});
})();
</script>
</body>
</html>
