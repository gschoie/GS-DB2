name: "[시험용] 네이버 증권 신규 구조 탐색"

# 찾아낸 신규 수급 API(/market/investorTrend 등)의 호출 규약을 번들 코드에서
# 떠내고, 실제로 호출해 응답 모양을 확인한다. 확인이 끝나면 이 파일은 지운다.
on:
  push:
    branches: [claude/telegram-trend-analysis-logic-7efsdy]
    paths: [".github/workflows/_probe-naver2.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: 탐색
        run: |
          python - <<'PY'
          import json, re, itertools
          import requests

          HOST = "https://m.stock.naver.com"
          API = HOST + "/front-api"
          UA = ("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 "
                "(KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1")
          S = requests.Session(); S.headers.update({"User-Agent": UA, "Referer": HOST + "/"})

          def get(u, **kw):
              try: return S.get(u, timeout=25, **kw)
              except Exception as e:
                  print(f"   !! {u} -> {type(e).__name__}: {e}"); return None

          TARGETS = ["/market/investorTrend", "/stock/domestic/trend",
                     "/market/tradingTrend/ranking", "/stock/index/periodChanges",
                     "/stock/domestic/index/price/list", "/chart/domesticPriceByTime"]

          # ── 1) 번들에서 호출부 주변 코드 떠내기 ─────────────────────
          seeds = ["/", "/domestic/index/KPI200/total", "/domestic/index/KOSPI/total",
                   "/domestic/stock/005930/total", "/domestic/home/capitalization/total"]
          chunks = set()
          for p in seeds:
              r = get(HOST + p)
              if r is not None and r.status_code == 200:
                  chunks |= set(re.findall(r'src="([^"]*/_next/static/[^"]+\.js)"', r.text))
          for c in list(chunks):
              rr = get(c if c.startswith("http") else HOST + c)
              if rr is None or rr.status_code != 200: continue
              chunks |= {"/_next/static/chunks/" + m for m in
                         re.findall(r'"(?:static/chunks/)?((?:pages|app)/[A-Za-z0-9/_.\-\[\]]+\.js)"', rr.text)}

          found = {t: [] for t in TARGETS}
          for c in sorted(chunks)[:500]:
              rr = get(c if c.startswith("http") else HOST + c)
              if rr is None or rr.status_code != 200: continue
              t = rr.text
              for tgt in TARGETS:
                  for m in re.finditer(re.escape(tgt), t):
                      if len(found[tgt]) < 3:
                          found[tgt].append(t[max(0, m.start()-420):m.start()+220])

          print("=" * 78); print("호출부 코드"); print("=" * 78)
          for tgt, ctxs in found.items():
              print(f"\n───── {tgt} ({len(ctxs)}곳) ─────")
              for c in ctxs:
                  print("  …", c.replace("\n", " ")[-620:])

          # ── 2) 실제 호출 ────────────────────────────────────────────
          print("\n" + "=" * 78); print("실호출"); print("=" * 78)
          trials = [
              ("/market/investorTrend", {}),
              ("/market/investorTrend", {"market": "KOSPI"}),
              ("/market/investorTrend", {"marketType": "KOSPI"}),
              ("/market/investorTrend", {"indexCode": "KOSPI"}),
              ("/market/investorTrend", {"stockExchangeType": "KRX"}),
              ("/market/tradingTrend/ranking", {}),
              ("/market/tradingTrend/ranking", {"market": "KOSPI", "investorType": "FOREIGN"}),
              ("/stock/domestic/trend", {"code": "005930"}),
              ("/stock/domestic/trend", {"code": "KPI200", "endType": "index"}),
              ("/stock/domestic/trend", {"code": "KOSPI", "endType": "index"}),
              ("/stock/index/periodChanges", {"code": "KPI200"}),
              ("/stock/domestic/index/price/list", {"indexCode": "KPI200", "page": 1, "pageSize": 10}),
          ]
          for path, params in trials:
              rr = get(API + path, params=params)
              if rr is None: continue
              body = rr.text[:1400].replace("\n", " ")
              print(f"\n  [{rr.status_code}] {path} {params}\n    {body}")
          PY
